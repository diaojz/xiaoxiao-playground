olute;top:20%;left:0;right:0;text-align:center;font-size:1.4em;font-weight:1000;color:#eea02c;text-shadow:0 2px white,2px 0 white,-2px 0 white,0 -2px white;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@keyframes bob{to{transform:translateY(-9px)}}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

<script>
(() => {
'use strict';
// 世界单位用米，所有碰撞、物体位置与透视绘制共用同一份桥面几何。
const RADIUS=.13, GRAVITY=16, PRICES=[0,30,50,70,90,110,140,180,220];
const FEVER_NEED=5, FEVER_DURATION=6, GIFT_FIRST=9, GIFT_INTERVAL=18, GIFT_COINS=8;
const RAINBOW=['#ff619c','#ffad36','#ffe060','#74db85','#54c9f5','#ab7eee'];
const NAMES=['彩虹糖','我的头像','星星球','西瓜球','月亮球','足球','橘子球','冰晶球','草莓球'];
const BALLS=['ball_rainbow','ball_kid','ball_star','ball_watermelon','ball_moon','ball_soccer','ball_orange','ball_ice','ball_berry'];
const THEMES=['糖果平原','彩虹云桥','冰淇淋山','棉花糖天空','饼干城堡'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const levelNumber=n=>clamp(Math.floor(Number(n)||1),1,1000000);
const integer=(n,max=9999999)=>clamp(Math.floor(Number(n)||0),0,max);
// 前十二关的安排手工固定，之后用有种子的模块拼接；每关始终有完整可达的终点。
const PLANS=[
 ['wide','coins','narrow','checkpoint','ramp','block'],
 ['coins','narrow','boost','gap','checkpoint','block','spring'],
 ['block','ramp','checkpoint','hammer','coins','narrow','gap'],
 ['narrow','spring','checkpoint','boulder','gap','boost','coins'],
 ['block','hammer','checkpoint','gap','narrow','spring','boulder'],
 ['boost','gap','checkpoint','hammer','spring','narrow','boulder','coins'],
 ['ramp','block','narrow','checkpoint','boulder','gap','hammer','spring'],
 ['spring','gap','checkpoint','block','hammer','narrow','boost','boulder'],
 ['narrow','boulder','checkpoint','gap','spring','hammer','block','boost'],
 ['boost','gap','narrow','checkpoint','hammer','spring','boulder','gap'],
 ['block','narrow','gap','checkpoint','hammer','boost','boulder','spring','gap'],
 ['hammer','gap','narrow','checkpoint','boulder','spring','block','gap','boost','hammer']
];
function makeLevel(number){
 const n=levelNumber(number), easy=n<=10, tier=Math.min(8,Math.floor((n-1)/12));let seed=(n*7919)>>>0;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const choices=['narrow','gap','hammer','boulder','block','boost','spring','ramp','coins'];
 const plan=n<=12?PLANS[n-1]:Array.from({length:10+tier},(_,i)=>i%4===3?'checkpoint':choices[Math.floor(rand()*choices.length)]);
 const spans=[],items=[],gaps=[];let z=0;
 const span=(length,half=1.12,rise=0)=>{spans.push({z,end:z+length,half,center:0,rise});z+=length;};
 span(16);
 plan.forEach((type,i)=>{
   const start=z,side=i%2===0?-1:1;
   if(type==='gap'){
     span(10);const startGap=z, length=easy?5.6:6.5+Math.min(1,tier*.1);
     items.push({type:'jump',z:startGap-1.8,x:0,half:.9,impulse:10});
     gaps.push({z:startGap,end:startGap+length});span(length,0);span(13);
   }else if(type==='narrow'){span(8,.92);span(15,easy?.64:.48);span(8,.92);}
   else if(type==='ramp'){span(7,1.12,.35);items.push({type:'jump',z:z-1,x:0,half:.9,impulse:8});span(20);}
   else {span(27);if(type==='block'||type==='hammer'||type==='boulder')items.push({type,z:start+14,x:side*(easy?.73:.55),half:type==='boulder'?.22:.24,phase:i*.9,moving:type!=='boulder'||n>4});
     if(type==='boost'||type==='spring')items.push({type,z:start+9,x:0,half:.9,impulse:12});
     if(type==='checkpoint')items.push({type,z:start+12,x:0,half:.8});}
   // 金币串总在实体桥面内，缺口的金币仅在跳跃轨迹上，不产生不可达奖励。
   for(let k=0;k<5;k++){const cz=start+3+k*2.1;if(!gaps.some(g=>cz>=g.z&&cz<=g.end))items.push({type:'coin',z:cz,x:0,half:.1});}
 });
 span(22);items.sort((a,b)=>a.z-b.z);items.forEach((o,i)=>o.id=i);
 return {number:n,theme:(n-1)%5,speed:8+Math.min(2,(n-1)*.12),easy,spans,items,gaps,finish:z-5,totalCoins:items.filter(o=>o.type==='coin').length};
}
function roadAt(level,z){return level.spans.find(s=>z>=s.z&&z<s.end)||level.spans[level.spans.length-1];}
function groundAt(level,z){const s=roadAt(level,z);return s.rise?Math.sin(clamp((z-s.z)/(s.end-s.z),0,1)*Math.PI/2)*s.rise:0;}
function clampBall(level,z,x){const s=roadAt(level,z),half=Math.max(.27,s.half);return clamp(Number.isFinite(x)?x:0,s.center-half+RADIUS,s.center+half-RADIUS);}
function obstacleHalf(item,time){const angle=item.type==='hammer'?Math.sin(time*2+item.phase)*.35:0;return item.half*(Math.abs(Math.cos(angle))+(item.type==='hammer'?1.05:0)*Math.abs(Math.sin(angle)));}
function obstacleX(item,level,time){const s=roadAt(level,item.z),motion=item.moving?Math.sin(time*(item.type==='hammer'?1.7:1.1)+item.phase)*(level.easy?.10:.48):0;const half=obstacleHalf(item,time);return clamp(item.x+motion,-s.half+half,s.half-half);}
function project(x,z,height,view,camZ=0,speed=8){const fov=24+clamp(speed-8,0,6)*.45,scale=fov/(fov+Math.max(-5,z-camZ));return{x:view.w/2+x*view.w*.34*scale,y:view.h*.32+view.h*.47*scale-height*view.w*.34*scale,scale};}
// 从每个真实桥段的端点切片，不能用一条全局步长跨过宽窄交界，漏出假的断桥。
function roadSlices(level,from,to,step=1.5){const slices=[];for(const span of level.spans){if(span.half<=0)continue;const end=Math.min(to,span.end);for(let z=Math.max(from,span.z);z<end;){const next=Math.min(end,z+step,(Math.floor(z/8)+1)*8);slices.push({z,end:next,half:span.half});z=next;}}return slices;}
// 相机跟随高跳，让球、悬浮头像和全部桥面共用同一次高度平移。
function cameraHeight(y){return Math.max(0,y-1.5);}
// 素材本身已经是球面正视图；绕水平轴反投影，零角度保留原来的脸部比例。
function sphereSample(x,y,roll,cos=Math.cos(roll),sin=Math.sin(roll)){const z=Math.sqrt(Math.max(0,1-x*x-y*y));return{x,y:y*cos+z*sin,front:z*cos-y*sin>=0};}
function createRun(n){return {level:makeLevel(n),phase:'running',z:2,x:0,target:0,vx:0,y:0,vy:0,speed:8,time:0,boost:0,invincible:0,checkpoint:2,collected:[],triggered:[],coins:0,combo:0,feverCharge:0,fever:0,giftZ:null,nextGift:GIFT_FIRST,falls:0,roll:0,events:[],rewarded:false};}
function steer(r,x){r.target=clampBall(r.level,r.z,x);}
function lose(r,reason){if(r.phase!=='running')return;r.phase='lost';r.falls++;r.combo=0;r.events.push({type:'lost',reason});}
function respawn(r){r.z=r.checkpoint;r.x=r.target=0;r.vx=r.vy=0;r.y=groundAt(r.level,r.z);r.boost=0;r.invincible=2;r.speed=r.level.speed;r.phase='running';r.triggered=r.triggered.filter(id=>r.level.items[id].z<=r.z);r.events.push({type:'respawn'});}
function starsFor(coins,total){const ratio=coins/Math.max(1,total);return ratio>=.8?3:ratio>=.45?2:1;}
function buySkin(coins,owned,index){coins=integer(coins);if(!Number.isInteger(index)||index<0||index>=PRICES.length)return {ok:false,coins,owned};if(owned.includes(index))return {ok:true,coins,owned:[...owned],selected:index};if(coins<PRICES[index])return {ok:false,coins,owned};return {ok:true,coins:coins-PRICES[index],owned:[...owned,index],selected:index};}
function normalizeSave(raw){const p=raw&&typeof raw==='object'?raw:{},owned=[...new Set([0,...(Array.isArray(p.owned)?p.owned:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<9)])];return {level:levelNumber(p.level),coins:integer(p.coins),owned,skin:owned.includes(p.skin)?p.skin:0,muted:p.muted===true,stars:p.stars&&typeof p.stars==='object'?Object.fromEntries(Object.entries(p.stars).filter(([k,v])=>/^\d+$/.test(k)&&k<=1000000&&v>=1&&v<=3).map(([k,v])=>[k,integer(v,3)])):{}};}
// 礼物只放在前方平坦桥面，留出看清箭头的距离，并避开金币和障碍。
function updateGift(r,oldZ){
 if(r.giftZ!==null){
   if(oldZ<r.giftZ&&r.z>=r.giftZ){r.giftZ=null;r.nextGift=r.time+GIFT_INTERVAL;r.events.push({type:'gift',reward:GIFT_COINS});}
   return;
 }
 if(r.time<r.nextGift)return;
 r.nextGift=r.time+1;
 for(let z=Math.ceil(r.z+20);z<Math.min(r.z+48,r.level.finish-5);z++){

 if(shakeX||shakeY||scenery.style.transform){
   scenery.style.transform=shakeX||shakeY?'translate('+(shakeX*cssScale)+'px,'+(shakeY*cssScale)+'px)':'';
 }
}
const roadSections=[];
const roadEdges=['#daaa82','#b9b0e5','#95cdda','#cbaad7','#ba966f'];
// 保留相机近端切片和每 8 米的纹理边界，投影时复用桥面截面的坐标。
function drawRoad(){
 const level=run.level,first=Math.max(0,run.z-5),end=Math.min(level.finish+5,run.z+180);
 const img=images.road,step=quality==='high'?1.5:quality==='mid'?4:8;
 const camera=cameraHeight(run.y),fov=24+clamp(run.speed-8,0,6)*.45,edge=roadEdges[level.theme];
 let length=0;
 for(const span of level.spans){
   if(span.z>=end)break;
   if(span.half<=0||span.end<=first)continue;
   const endZ=Math.min(end,span.end);
   for(let z=Math.max(first,span.z);z<endZ;){
     const next=Math.min(endZ,z+step,(Math.floor(z/8)+1)*8);
     roadSections[length++]=z;roadSections[length++]=next;roadSections[length++]=span;
     z=next;
   }
 }
 roadSections.length=length;
 for(let i=length-3;i>=0;i-=3){
   const z=roadSections[i],z2=roadSections[i+1],span=roadSections[i+2];
   const near=fov/(fov+Math.max(-5,z-run.z)),far=fov/(fov+Math.max(-5,z2-run.z));
   const t=z2-1e-7;
   const h0=span.rise?Math.sin(clamp((z-span.z)/(span.end-span.z),0,1)*Math.PI/2)*span.rise:0;
   const h1=t<span.z?groundAt(level,t):span.rise?Math.sin(clamp((t-span.z)/(span.end-span.z),0,1)*Math.PI/2)*span.rise:0;
   const y=H*.32+H*.47*near-(h0-camera)*W*.34*near;
   const y2=H*.32+H*.47*far-(h1-camera)*W*.34*far;
   if(y<H*.32||y2>H+60)continue;
   const x=span.half*W*.34*near,x2=span.half*W*.34*far;
   const left=W/2-x,right=W/2+x,farLeft=W/2-x2,farRight=W/2+x2;
   const nearEdge=y+18*near,farEdge=y2+18*far;
   ctx.fillStyle=edge;
   quad(left,y,farLeft,y2,farLeft,farEdge,left,nearEdge);ctx.fill();
   quad(right,y,farRight,y2,farRight,farEdge,right,nearEdge);ctx.fill();
   quad(left,y,right,y,farRight,y2,farLeft,y2);
   ctx.fillStyle='#ffe3a3';ctx.fill();
   if(img){
     ctx.save();ctx.clip();
     const sy=(8-(z2%8||8))/8*img.height;
     ctx.drawImage(img,img.width*.18,sy,img.width*.64,(z2-z)/8*img.height,left,Math.min(y,y2),right-left,Math.abs(y-y2)+.6);
     ctx.restore();
   }
   // 护栏独立沿投影边线铺设，立柱保留原有遮挡次序。
   const post=Math.floor(z/6)!==Math.floor(z2/6);
   roadRail(left,farLeft,y,y2,near,far,'#7ad9d8',post);
   roadRail(right,farRight,y,y2,near,far,'#f7b4ca',post);
   if(z===0||(z-span.z<1e-5&&roadAt(level,z-1e-5).half===0)){
     ctx.fillStyle=edge;quad(left,y,right,y,right,nearEdge,left,nearEdge);ctx.fill();
   }
 }
}
function roadRail(x,x2,y,y2,near,far,color,post){
 ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,8*near);
 ctx.beginPath();ctx.moveTo(x,y-7*near);ctx.lineTo(x2,y2-7*far);ctx.stroke();
 if(post){
   ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,4*near);
   ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-18*near);ctx.stroke();
 }
}
function drawItem(o){let z=o.type==='boulder'?o.z+Math.sin(run.time*.8+o.phase)*1.5:o.z;if(z<run.z-1.4||z>run.z+160)return;if(o.type==='coin'&&run.collected.includes(o.id))return;const x=o.type==='coin'?o.x:obstacleX(o,run.level,run.time),ground=groundAt(run.level,z),p=proj(x,z,ground);if(p.y<H*.33)return;const s=p.scale;
 if(o.type==='coin'){sprite('coin',p.x,p.y-23*s,25*s*(.75+.25*Math.abs(Math.sin(clock*3+o.id))),28*s);}
 else if(o.type==='checkpoint'){const road=roadAt(run.level,z);for(const side of [-1,1]){const q=proj(side*(road.half-.12),z,ground);sprite('flag',q.x,q.y-38*s,36*s,76*s);}ctx.strokeStyle='#fff';ctx.lineWidth=5*s;ctx.setLineDash([10*s,8*s]);ctx.beginPath();ctx.moveTo(proj(-road.half,z,ground).x,p.y);ctx.lineTo(proj(road.half,z,ground).x,p.y);ctx.stroke();ctx.setLineDash([]);}
 else if(['boost','jump','spring'].includes(o.type)){const name=o.type==='spring'?'spring':'boost';if(o.type==='spring')sprite(name,p.x,p.y-14*s,78*s,44*s);else{sprite(name,p.x,p.y-6*s,130*s,36*s);if(z-run.z<30)text(o.type==='jump'?'起飞 ↑':'加速 ↑',p.x,p.y-35*s,Math.max(12,20*s),o.type==='jump'?'#b68ce3':'#dba327');}}
 else {const width=o.half*2*W*.34*s,height=o.type==='hammer'?width*1.05:o.type==='boulder'?width:width*.72;ctx.save();const surface=roadAt(run.level,z),l=proj(-surface.half,z),r=proj(surface.half,z);ctx.beginPath();ctx.rect(l.x,p.y-height*1.5,r.x-l.x,height*1.6);ctx.clip();sprite(o.type,p.x,p.y-height*.5,width,height,o.type==='hammer'?Math.sin(run.time*2+o.phase)*.35:o.type==='boulder'?run.time:0);ctx.restore();}
}
function drawFinish(){const z=run.level.finish;if(z>run.z+160)return;const road=roadAt(run.level,z),p=proj(0,z),left=proj(-road.half,z),right=proj(road.half,z);const w=right.x-left.x;for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#7c86ad':'white';ctx.fillRect(left.x+i*w/12,p.y,w/12+1,9*p.scale);}sprite('arch',p.x,p.y-w*.35,w*.98,w*.72);}
function playerPoint(){return proj(run.x,run.z,Math.max(-.5,run.y));}
function drawGift(){
 if(run.giftZ===null)return;
 const z=run.giftZ,p=proj(0,z,groundAt(run.level,z));
 const y=p.y-38*p.scale+Math.sin(run.time*7)*6;
 text('🎁',p.x,y,Math.max(40,67*p.scale));
 text('▼',p.x,y-45*p.scale,Math.max(23,34*p.scale),'#d14e90');
}
function drawPlayer(){const p=playerPoint(),ground=proj(run.x,run.z,groundAt(run.level,run.z)),r=RADIUS*W*.34;ctx.save();
 // 低于桥面的落球应被身后的近端桥沿遮住，不能盖在饼干桥面上。
 const gap=run.level.gaps.find(g=>run.z>=g.z&&run.z<g.end);if(gap&&run.y<0){const edge=proj(0,gap.z);ctx.beginPath();ctx.rect(0,0,W,Math.max(0,edge.y));ctx.clip();}
 if(roadAt(run.level,run.z).half>0){ctx.fillStyle='#46718c35';ctx.beginPath();ctx.ellipse(ground.x,ground.y+5,r*(1.05+Math.max(0,run.y)*.18),r*.3,0,0,Math.PI*2);ctx.fill();}if(run.invincible>0){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.shadowColor='#7de6ff';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(p.x,p.y-r,r+7,0,Math.PI*2);ctx.stroke();}ctx.translate(p.x,p.y-r);ctx.rotate(-run.vx*.08);ctx.drawImage(ballFrame(),-r,-r,r*2,r*2);ctx.restore();
 // 小头像固定朝向并悬浮在球上方；头像皮肤本身则随球面滚动。
 if(run.fever>0){
   ctx.lineWidth=7;
   const turn=run.time*3;
   RAINBOW.forEach((color,i)=>{
     ctx.strokeStyle=color;ctx.beginPath();
     ctx.arc(p.x,p.y-r,r+11,turn+i*Math.PI/3,turn+(i+1)*Math.PI/3+.04);ctx.stroke();
   });
 }
 const kidY=p.y-r*2-43;sprite('kid_avatar',p.x,kidY,avatarSize,avatarSize);if(run.boost>0){ctx.strokeStyle='#fff9';ctx.lineWidth=3;for(let i=0;i<8;i++){const a=i*.79,q=80+(clock*220+i*17)%180;ctx.beginPath();ctx.moveTo(p.x+Math.cos(a)*q,p.y+Math.sin(a)*q*.5);ctx.lineTo(p.x+Math.cos(a)*(q+25),p.y+Math.sin(a)*(q+25)*.5);ctx.stroke();}}}
function burst(x,y,n=16,confetti=false){for(let i=0;i<n&&particles.length<(quality==='low'?40:80);i++){const a=Math.random()*Math.PI*2,s=50+Math.random()*200;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:.6+Math.random()*.7,size:9+Math.random()*12,color:confetti?RAINBOW[i%RAINBOW.length]:null});}}
function float(s){const p=playerPoint();floats.push({s,x:p.x,y:p.y-RADIUS*W*.68-43-avatarSize/2-28,life:1});}
function events(){if(!run.events.length)return;for(const e of run.events){if(e.type==='coin'){save.coins=integer(save.coins+e.reward);persist();sound('coin');const p=playerPoint();burst(p.x,p.y-45,6);if(e.combo%5===0){float('连收 ×'+e.combo);sound('unlock');}}
 if(e.type==='giftAhead')notify('🎁 前面有礼物！');
 if(e.type==='fever'||e.type==='gift'||e.type==='milestone'){
   const p=playerPoint();
   burst(p.x,p.y-65,e.type==='gift'?42:28,true);
   if(e.type==='gift'){save.coins=integer(save.coins+e.reward);persist();notify('🎁 礼物打开啦！金币 +'+e.reward);}
   if(e.type==='milestone')notify('🎉 捡到 '+e.coins+' 枚金币啦！');
   if(e.type==='fever')notify('🌈 狂欢啦！金币吸过来，奖励翻倍！');
   sound(e.type==='gift'?'checkpoint':'unlock');
 }
 if(e.type==='checkpoint'){sound('checkpoint');notify('旗帜点亮啦！');float('检查点 ✓');}if(['jump','spring','boost'].includes(e.type)){sound(e.type==='boost'?'boost':'jump');float(e.type==='boost'?'加速啦！':'飞起来啦！');const p=playerPoint();burst(p.x,p.y,22);}if(e.type==='respawn'){notify('接着出发！');sound('checkpoint');}if(e.type==='lost'){shake=.4;finish(false);}if(e.type==='won')finish(true);}run.events.length=0;}
function drawEffects(dt){particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;ctx.save();ctx.globalAlpha=clamp(p.life/.3,0,1);if(p.color){
 ctx.translate(p.x,p.y);ctx.rotate(clock*4+p.vx);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-3,p.size,6);
 }else sprite('spark',p.x,p.y,p.size,p.size,clock*2);ctx.restore();}floats=floats.filter(p=>p.life>0);for(const p of floats){p.life-=dt;p.y-=45*dt;ctx.save();ctx.globalAlpha=clamp(p.life/.3,0,1);text(p.s,p.x,p.y,27,'#e1a036');ctx.restore();}}
const hudValues={};
function updateBar(id,pct){
 if(hudValues[id]===pct)return;
 hudValues[id]=pct;
 const bar=$(id);bar.style.width=pct+'%';bar.parentElement.setAttribute('aria-valuenow',pct);
}
function hudText(id,value){
 if(hudValues[id]===value)return;
 hudValues[id]=value;$(id).textContent=value;
}
function updateHud(){
 const active=run.fever>0;
 hudText('levelLabel','第 '+run.level.number+' 关');
 hudText('themeLabel',THEMES[run.level.theme]);
 hudText('coins',save.coins);
 hudText('feverLabel',active?'🌈 金币 ×2':'🌈 狂欢');
 hudText('status',run.boost>0?'加速中 ↑':run.y>.4?'飞起来啦':run.checkpoint>2?'已点亮旗帜':'收金币，向前滚');
 updateBar('progress',Math.floor(run.z/run.level.finish*100));
 updateBar('feverFill',active?Math.round(Math.ceil(run.fever*2)/(FEVER_DURATION*2)*100):run.feverCharge/FEVER_NEED*100);
}
let itemLevel,drawOrder;
function drawItems(){
 if(itemLevel!==run.level){itemLevel=run.level;drawOrder=itemLevel.items.slice().sort((a,b)=>b.z-a.z);}
 for(const item of drawOrder){
   if(item.z<=run.z-3)break;
   if(item.z<run.z+160)drawItem(item);
 }
}
function draw(dt=0){
 let shakeX=0,shakeY=0;
 if(shake>0){shakeX=Math.sin(clock*85)*shake*8;shakeY=Math.cos(clock*71)*shake*5;shake=Math.max(0,shake-dt);}
 drawSky(shakeX,shakeY);
 ctx.clearRect(0,0,W,H);
 ctx.save();if(shakeX||shakeY)ctx.translate(shakeX,shakeY);
 drawRoad();drawFinish();drawItems();drawGift();drawPlayer();drawEffects(dt);
 ctx.restore();
}

function frame(now){if(!(run.phase==='running')||document.hidden)return;if(now-last<33){scheduleFrame();return;}const perfStart=performance.now();const dt=Math.min(.06,Math.max(0,(now-(last||now))/1000));last=now;if(!document.hidden&&run.phase!=='paused'){clock+=dt;if(run.phase==='running'){accumulator+=dt;while(accumulator>=1/120){tick(run,1/120);accumulator-=1/120;events();}updateHud();}if(toastLife>0){toastLife-=dt;if(toastLife<=0)$('toast').classList.remove('show');}if(loaded&&run.phase!=='ready')draw(dt);}perfFrame(perfStart,particles.length+floats.length);if(run.phase==='running'&&!document.hidden)scheduleFrame();}
// 只有显式本地验收参数开放状态快进；正常入口没有选关和作弊按钮。
if(new URLSearchParams(location.search).has('qa'))globalThis.__ballQA={get state(){return run;},get save(){return save;},get assets(){return {loaded,missing:ASSETS.filter(n=>!images[n]),audio:SFX.filter(n=>!clips[n])};},get metrics(){const p=playerPoint(),road=roadAt(run.level,run.z);return {w:W,h:H,ballPixels:RADIUS*2*W*.34*stage.clientWidth/W,left:run.x-RADIUS,right:run.x+RADIUS,roadHalf:road.half,player:p,dpr:canvas.width/stage.clientWidth};},start,home,pause,resume,step(seconds){advance(run,seconds);events();updateHud();draw();},scene(level=1,z=2){start();run=createRun(level);run.z=z;run.y=groundAt(run.level,z);updateHud();draw();},freeze(){pause();$('paused').hidden=true;draw();},lose(){lose(run,'qa');events();draw();}};
document.querySelectorAll('img').forEach(img=>img.onerror=()=>{img.style.visibility='hidden';});resize();syncMute();renderSkins();preload();
})();
