-size:10px;color:#97849b;margin:5px 0 0}.toast{position:absolute;top:20%;left:0;right:0;text-align:center;font-size:1.4em;font-weight:1000;color:#eea02c;text-shadow:0 2px white,2px 0 white,-2px 0 white,0 -2px white;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@keyframes bob{to{transform:translateY(-9px)}}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media(max-width:430px){.round{width:42px;height:44px;border-radius:15px}.round img{width:32px;height:32px}.top-controls{gap:4px}.back{padding:11px 7px;font-size:11px}.hud{left:22%;right:26%}.hud strong{font-size:16px}.home-panel{padding:11px}.skins{grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0 5px}.skin img{height:34px}.skin small{font-size:9px}.skin{padding:2px}.title{top:12%}.title h1{-webkit-text-stroke-width:5px}.primary{min-height:54px}.note{margin-top:11px}.section-label{font-size:11px}.result-kid{height:130px}.panel{padding:20px}.stars img{width:42px;height:42px}.stars img:nth-child(2){width:52px;height:52px}}

<script>
(() => {
'use strict';
// 世界单位用米，所有碰撞、物体位置与透视绘制共用同一份桥面几何。
const RADIUS=.13, GRAVITY=16, PRICES=[0,30,50,70,90,110,140,180,220];
const NAMES=['彩虹糖','我的头像','星星球','西瓜球','月亮球','足球','橘子球','冰晶球','草莓球'];
const BALLS=['ball_rainbow','ball_kid','ball_star','ball_watermelon','ball_moon','ball_soccer','ball_orange','ball_ice','ball_berry'];
const THEMES=['糖果平原','彩虹云桥','冰淇淋山','棉花糖天空','饼干城堡'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const levelNumber=n=>clamp(Math.floor(Number(n)||1),1,1000000);
const integer=(n,max=9999999)=>clamp(Math.floor(Number(n)||0),0,max);
// 前十二关的安排手工固定，之后用有种子的模块拼接；每关始终有完整可达的终点。
const PLANS=[
 ['wide','coins','narrow','checkpoint','ramp','block'],
 ['coins','narrow','boost','gap','checkpoint','block','spring'],
 ['block','ramp','checkpoint','hammer','coins','narrow','gap'],
 ['narrow','spring','checkpoint','boulder','gap','boost','coins'],
 ['block','hammer','checkpoint','gap','narrow','spring','boulder'],
 ['boost','gap','checkpoint','hammer','spring','narrow','boulder','coins'],
 ['ramp','block','narrow','checkpoint','boulder','gap','hammer','spring'],
 ['spring','gap','checkpoint','block','hammer','narrow','boost','boulder'],
 ['narrow','boulder','checkpoint','gap','spring','hammer','block','boost'],
 ['boost','gap','narrow','checkpoint','hammer','spring','boulder','gap'],
 ['block','narrow','gap','checkpoint','hammer','boost','boulder','spring','gap'],
 ['hammer','gap','narrow','checkpoint','boulder','spring','block','gap','boost','hammer']
];
function makeLevel(number){
 const n=levelNumber(number), easy=n<=10, tier=Math.min(8,Math.floor((n-1)/12));let seed=(n*7919)>>>0;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const choices=['narrow','gap','hammer','boulder','block','boost','spring','ramp','coins'];
 const plan=n<=12?PLANS[n-1]:Array.from({length:10+tier},(_,i)=>i%4===3?'checkpoint':choices[Math.floor(rand()*choices.length)]);
 const spans=[],items=[],gaps=[];let z=0;
 const span=(length,half=1.12,rise=0)=>{spans.push({z,end:z+length,half,center:0,rise});z+=length;};
 span(16);
 plan.forEach((type,i)=>{
   const start=z,side=i%2===0?-1:1;
   if(type==='gap'){
     span(10);const startGap=z, length=easy?5.6:6.5+Math.min(1,tier*.1);
     items.push({type:'jump',z:startGap-1.8,x:0,half:.9,impulse:10});
     gaps.push({z:startGap,end:startGap+length});span(length,0);span(13);
   }else if(type==='narrow'){span(8,.92);span(15,easy?.64:.48);span(8,.92);}
   else if(type==='ramp'){span(7,1.12,.35);items.push({type:'jump',z:z-1,x:0,half:.9,impulse:8});span(20);}
   else {span(27);if(type==='block'||type==='hammer'||type==='boulder')items.push({type,z:start+14,x:side*(easy?.73:.55),half:type==='boulder'?.22:.24,phase:i*.9,moving:type!=='boulder'||n>4});
     if(type==='boost'||type==='spring')items.push({type,z:start+9,x:0,half:.9,impulse:12});
     if(type==='checkpoint')items.push({type,z:start+12,x:0,half:.8});}
   // 金币串总在实体桥面内，缺口的金币仅在跳跃轨迹上，不产生不可达奖励。
   for(let k=0;k<5;k++){const cz=start+3+k*2.1;if(!gaps.some(g=>cz>=g.z&&cz<=g.end))items.push({type:'coin',z:cz,x:0,half:.1});}
 });
 span(22);items.sort((a,b)=>a.z-b.z);items.forEach((o,i)=>o.id=i);
 return {number:n,theme:(n-1)%5,speed:8+Math.min(2,(n-1)*.12),easy,spans,items,gaps,finish:z-5,totalCoins:items.filter(o=>o.type==='coin').length};
}
function roadAt(level,z){return level.spans.find(s=>z>=s.z&&z<s.end)||level.spans[level.spans.length-1];}
function groundAt(level,z){const s=roadAt(level,z);return s.rise?Math.sin(clamp((z-s.z)/(s.end-s.z),0,1)*Math.PI/2)*s.rise:0;}
function clampBall(level,z,x){const s=roadAt(level,z),half=Math.max(.27,s.half);return clamp(Number.isFinite(x)?x:0,s.center-half+RADIUS,s.center+half-RADIUS);}
function obstacleHalf(item,time){const angle=item.type==='hammer'?Math.sin(time*2+item.phase)*.35:0;return item.half*(Math.abs(Math.cos(angle))+(item.type==='hammer'?1.05:0)*Math.abs(Math.sin(angle)));}
function obstacleX(item,level,time){const s=roadAt(level,item.z),motion=item.moving?Math.sin(time*(item.type==='hammer'?1.7:1.1)+item.phase)*(level.easy?.10:.48):0;const half=obstacleHalf(item,time);return clamp(item.x+motion,-s.half+half,s.half-half);}
function project(x,z,height,view,camZ=0,speed=8){const fov=24+clamp(speed-8,0,6)*.45,scale=fov/(fov+Math.max(-5,z-camZ));return{x:view.w/2+x*view.w*.34*scale,y:view.h*.32+view.h*.47*scale-height*view.w*.34*scale,scale};}
// 从每个真实桥段的端点切片，不能用一条全局步长跨过宽窄交界，漏出假的断桥。
function roadSlices(level,from,to){const slices=[];for(const span of level.spans){if(span.half<=0)continue;const end=Math.min(to,span.end);for(let z=Math.max(from,span.z);z<end;){const next=Math.min(end,z+1.5,(Math.floor(z/8)+1)*8);slices.push({z,end:next,half:span.half});z=next;}}return slices;}
// 相机跟随高跳，让球、悬浮头像和全部桥面共用同一次高度平移。
function cameraHeight(y){return Math.max(0,y-1.5);}
// 素材本身已经是球面正视图；绕水平轴反投影，零角度保留原来的脸部比例。
function sphereSample(x,y,roll,cos=Math.cos(roll),sin=Math.sin(roll)){const z=Math.sqrt(Math.max(0,1-x*x-y*y));return{x,y:y*cos+z*sin,front:z*cos-y*sin>=0};}
function createRun(n){return {level:makeLevel(n),phase:'running',z:2,x:0,target:0,vx:0,y:0,vy:0,speed:8,time:0,boost:0,invincible:0,checkpoint:2,collected:[],triggered:[],coins:0,combo:0,falls:0,roll:0,events:[],rewarded:false};}
function steer(r,x){r.target=clampBall(r.level,r.z,x);}
function lose(r,reason){if(r.phase!=='running')return;r.phase='lost';r.falls++;r.combo=0;r.events.push({type:'lost',reason});}
function respawn(r){r.z=r.checkpoint;r.x=r.target=0;r.vx=r.vy=0;r.y=groundAt(r.level,r.z);r.boost=0;r.invincible=2;r.speed=r.level.speed;r.phase='running';r.triggered=r.triggered.filter(id=>r.level.items[id].z<=r.z);r.events.push({type:'respawn'});}
function starsFor(coins,total){const ratio=coins/Math.max(1,total);return ratio>=.8?3:ratio>=.45?2:1;}
function buySkin(coins,owned,index){coins=integer(coins);if(!Number.isInteger(index)||index<0||index>=PRICES.length)return {ok:false,coins,owned};if(owned.includes(index))return {ok:true,coins,owned:[...owned],selected:index};if(coins<PRICES[index])return {ok:false,coins,owned};return {ok:true,coins:coins-PRICES[index],owned:[...owned,index],selected:index};}
function normalizeSave(raw){const p=raw&&typeof raw==='object'?raw:{},owned=[...new Set([0,...(Array.isArray(p.owned)?p.owned:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<9)])];return {level:levelNumber(p.level),coins:integer(p.coins),owned,skin:owned.includes(p.skin)?p.skin:0,muted:p.muted===true,stars:p.stars&&typeof p.stars==='object'?Object.fromEntries(Object.entries(p.stars).filter(([k,v])=>/^\d+$/.test(k)&&k<=1000000&&v>=1&&v<=3).map(([k,v])=>[k,integer(v,3)])):{}};}
// 固定小步积分避免低帧率穿透；暂停不推进、金币和事件各有独立的一次性记录。
function tick(r,dt){
 if(r.phase!=='running')return;dt=clamp(dt,0,.05);r.time+=dt;r.boost=Math.max(0,r.boost-dt);r.invincible=Math.max(0,r.invincible-dt);
 const desired=r.level.speed*(r.boost>0?1.48:1);r.speed+=(desired-r.speed)*Math.min(1,dt*4);
 r.vx+=((r.target-r.x)*35-r.vx*10)*dt;r.x=clampBall(r.level,r.z,r.x+r.vx*dt);r.target=clampBall(r.level,r.z,r.target);
 const oldZ=r.z;r.z=Math.min(r.level.finish,r.z+r.speed*dt);r.roll+=(r.z-oldZ)/RADIUS;
 // 前进可能恰好跨入更窄的桥段，必须在本帧碰撞和绘制之前再次约束整颗球。
 r.x=clampBall(r.level,r.z,r.x);r.target=clampBall(r.level,r.z,r.target);
 r.vy-=GRAVITY*dt;r.y+=r.vy*dt;
 const surface=roadAt(r.level,r.z),floor=groundAt(r.level,r.z);
 if(surface.half>0&&r.y<=floor){r.y=floor;r.vy=0;}
 if(surface.half===0&&r.y<-.35){lose(r,'gap');return;}
 for(const item of r.level.items){
   const iz=item.type==='boulder'?item.z+Math.sin(r.time*.8+item.phase)*1.5:item.z;
   const near=Math.abs(r.z-iz)<.55+r.speed*dt, x=item.type==='coin'?item.x:obstacleX(item,r.level,r.time),touch=Math.abs(r.x-x)<(['block','hammer','boulder'].includes(item.type)?obstacleHalf(item,r.time):item.half)+RADIUS;

 const kidY=p.y-r*2-43;const avatarSize=Math.max(48,28*W/stage.clientWidth);sprite('kid_avatar',p.x,kidY,avatarSize,avatarSize);if(run.boost>0){ctx.strokeStyle='#fff9';ctx.lineWidth=3;for(let i=0;i<8;i++){const a=i*.79,q=80+(clock*220+i*17)%180;ctx.beginPath();ctx.moveTo(p.x+Math.cos(a)*q,p.y+Math.sin(a)*q*.5);ctx.lineTo(p.x+Math.cos(a)*(q+25),p.y+Math.sin(a)*(q+25)*.5);ctx.stroke();}}}
function burst(x,y,n=16){for(let i=0;i<n&&particles.length<160;i++){const a=Math.random()*Math.PI*2,s=50+Math.random()*200;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:.6+Math.random()*.7,size:9+Math.random()*12});}}
function float(s){const p=playerPoint(),avatarSize=Math.max(48,28*W/stage.clientWidth);floats.push({s,x:p.x,y:p.y-RADIUS*W*.68-43-avatarSize/2-28,life:1});}
function events(){for(const e of run.events){if(e.type==='coin'){save.coins=integer(save.coins+1);persist();sound('coin');const p=playerPoint();burst(p.x,p.y-45,6);if(e.combo%5===0){float('连收 ×'+e.combo);sound('unlock');}}if(e.type==='checkpoint'){sound('checkpoint');notify('旗帜点亮啦！');float('检查点 ✓');}if(['jump','spring','boost'].includes(e.type)){sound(e.type==='boost'?'boost':'jump');float(e.type==='boost'?'加速啦！':'飞起来啦！');const p=playerPoint();burst(p.x,p.y,22);}if(e.type==='respawn'){notify('接着出发！');sound('checkpoint');}if(e.type==='lost'){shake=.4;finish(false);}if(e.type==='won')finish(true);}run.events=[];}
function drawEffects(dt){particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;ctx.save();ctx.globalAlpha=clamp(p.life/.3,0,1);sprite('spark',p.x,p.y,p.size,p.size,clock*2);ctx.restore();}floats=floats.filter(p=>p.life>0);for(const p of floats){p.life-=dt;p.y-=45*dt;ctx.save();ctx.globalAlpha=clamp(p.life/.3,0,1);text(p.s,p.x,p.y,27,'#e1a036');ctx.restore();}}
function updateHud(){$('levelLabel').textContent='第 '+run.level.number+' 关';$('themeLabel').textContent=THEMES[run.level.theme];$('coins').textContent=save.coins;const pc=Math.floor(run.z/run.level.finish*100);$('progress').style.width=pc+'%';$('progress').parentElement.setAttribute('aria-valuenow',pc);$('status').textContent=run.boost>0?'加速中 ↑':run.y>.4?'飞起来啦':run.checkpoint>2?'已点亮旗帜':'收金币，向前滚';}
function draw(dt=0){ctx.save();if(shake>0){ctx.translate(Math.sin(clock*85)*shake*8,Math.cos(clock*71)*shake*5);shake=Math.max(0,shake-dt);}drawSky();drawRoad();drawFinish();const objects=run.level.items.filter(o=>o.z>run.z-3&&o.z<run.z+160).sort((a,b)=>b.z-a.z);objects.forEach(drawItem);drawPlayer();drawEffects(dt);ctx.restore();}
function frame(now){const dt=Math.min(.06,Math.max(0,(now-(last||now))/1000));last=now;if(!document.hidden&&run.phase!=='paused'){clock+=dt;if(run.phase==='running'){accumulator+=dt;while(accumulator>=1/120){tick(run,1/120);accumulator-=1/120;events();}updateHud();}toastLife-=dt;if(toastLife<=0)$('toast').classList.remove('show');if(loaded&&run.phase!=='ready')draw(dt);}requestAnimationFrame(frame);}
// 只有显式本地验收参数开放状态快进；正常入口没有选关和作弊按钮。
if(new URLSearchParams(location.search).has('qa'))globalThis.__ballQA={get state(){return run;},get save(){return save;},get assets(){return {loaded,missing:ASSETS.filter(n=>!images[n]),audio:SFX.filter(n=>!clips[n])};},get metrics(){const p=playerPoint(),road=roadAt(run.level,run.z);return {w:W,h:H,ballPixels:RADIUS*2*W*.34*stage.clientWidth/W,left:run.x-RADIUS,right:run.x+RADIUS,roadHalf:road.half,player:p,dpr:canvas.width/stage.clientWidth};},start,home,pause,resume,step(seconds){advance(run,seconds);events();updateHud();draw();},scene(level=1,z=2){start();run=createRun(level);run.z=z;run.y=groundAt(run.level,z);updateHud();draw();},freeze(){pause();$('paused').hidden=true;draw();},lose(){lose(run,'qa');events();draw();}};
document.querySelectorAll('img').forEach(img=>img.onerror=()=>{img.style.visibility='hidden';});resize();syncMute();renderSkins();preload();requestAnimationFrame(frame);
})();
