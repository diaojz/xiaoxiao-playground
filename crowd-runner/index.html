<script>
(() => {
'use strict';
// 纯逻辑先定义，Node 可以不创建 DOM 而直接验收关卡与战斗规则。
const MAX_COUNT = 9999, MAX_DRAWN = 60;
const SKIN_PRICES = [0, 60, 120, 200, 300, 450];
const SKIN_NAMES = ['红盘扣衫', '蓝熊装', '小黄鸭装', '小恐龙装', '小狐狸装', '独角兽装'];
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const normalizeLevel = n => clamp(Math.floor(Number(n) || 1), 1, Number.MAX_SAFE_INTEGER);
function applyGate(count, gate) {
  const v = gate.value;
  return clamp(Math.floor(gate.op === '×' ? count * v : gate.op === '÷' ? count / Math.max(1, v) : gate.op === '-' ? count - v : count + v), 1, MAX_COUNT);
}
const applyDamage = (count, damage) => Math.max(0, count - damage);
const battleOutcome = (ours, theirs) => ours > theirs ? 'won' : 'lost';
function buySkin(coins, owned, index) {
  if (!Number.isInteger(index) || index < 0 || index >= SKIN_PRICES.length) return { ok: false, coins, owned };
  if (owned.includes(index)) return { ok: true, coins, owned: [...owned], selected: index };
  if (coins < SKIN_PRICES[index]) return { ok: false, coins, owned };
  return { ok: true, coins: coins - SKIN_PRICES[index], owned: [...owned, index], selected: index };
}
// 同一个种子重来得到同一跑道；前十关即使不换道也有充足的人数余量。
function generateLevel(number) {
  const n = normalizeLevel(number), tier = Math.min(24, Math.floor((n - 1) / 5));
  let seed = (n % 2147483647 + 31) >>> 0;
  const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const rows = [], gates = 5 + Math.min(1, Math.floor(n / 8));
  for (let i = 0; i < gates; i++) {
    const z = 380 + i * 570, add = 14 + i * 4 + tier * 2;
    let pair = i % 2 === 0 ? [{ op: '+', value: add }, { op: '×', value: 2 }] : [{ op: '+', value: add }, { op: '+', value: add + 8 }];
    if (n >= 3 && i === 3 && n % 3 === 0) pair = [{ op: '+', value: add + 14 }, { op: '-', value: 3 + Math.min(5, tier) }];
    if (n >= 4 && i === 4 && n % 4 === 0) pair = [{ op: '×', value: 2 }, { op: '÷', value: 2 }];
    if (random() > .5) pair.reverse();
    rows.push({ type: 'gate', z, gates: pair });
    rows.push({ type: 'coins', z: z + 105, x: random() > .5 ? 1 : -1, amount: 5 + Math.min(3, tier) });
    const side = random() > .5 ? 1 : -1;
    if (i === 0) rows.push({ type: 'rescue', z: z + 270, x: side, amount: 3 });
    else if (i === 1) rows.push({ type: 'saw', z: z + 270, x: side, damage: 2 + Math.min(6, tier), moving: n >= 2, phase: random() * 6 });
    else if (i === 2) rows.push({ type: 'chest', z: z + 270, x: side, power: ['shield', 'magnet', 'dash'][(n - 1) % 3] });
    else if (i === 3) rows.push({ type: 'enemy', z: z + 270, x: side, damage: 3 + Math.min(10, tier), kind: n % 3 + 1 });
    else rows.push({ type: 'spikes', z: z + 270, x: side, damage: 3 + Math.min(7, tier), moving: n >= 7, phase: random() * 6 });
  }
  // 每条跑道都含地刺和宝箱后的金币串，让三种道具都有用武之地。
  const last = rows[rows.length - 1].z;
  rows.push({ type: 'rescue', z: last + 130, x: 0, amount: 4 });
  const isBoss = n % 5 === 0;
  return { number: n, theme: Math.floor((n - 1) / 3) % 2, isBoss, startCount: 12, speed: 126 + Math.min(22, tier), boss: (isBoss ? 38 : 20) + tier * 6, rows, finish: last + 490 };
}
// 六角蜂窝逐圈扩张；每个人的编号和位置稳定，增减时其余人无需重新洗牌。
const HEX_DIRECTIONS = [[0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1], [1, 0]];
function formation(count, width = 46) {
  const length = Math.min(MAX_DRAWN, Math.max(0, Math.floor(count))), coords = [{ q: 0, r: 0 }];
  for (let ring = 1; coords.length < length; ring++) {
    let q = ring, r = -ring;
    for (const [dq, dr] of HEX_DIRECTIONS) for (let step = 0; step < ring; step++) {
      coords.push({ q, r }); q += dq; r += dr;
    }
  }
  const gap = width * .92;
  return coords.slice(0, length).map((p, i) => ({ x: (p.q + p.r / 2) * gap, y: p.r * gap * .8660254 * 1.38, i })).sort((a, b) => a.y - b.y || a.i - b.i);
}
const obstacleX = (row, time) => row.moving ? Math.sin(time * 1.4 + (row.phase || 0)) * .72 : (row.x || 0) * .65;
// 孩子是竖长构图，横向和纵向分别留空；中心向两侧排队，人数增加不挤动已有伙伴。
function kidFormation(count, width, columns, rows = MAX_DRAWN) {
  const length = Math.min(MAX_DRAWN, Math.max(0, Math.floor(count)), columns * rows);
  return Array.from({ length }, (_, i) => {
    const col = i % columns, offset = columns % 2 ? (col % 2 ? -(col + 1) / 2 : col / 2) : (col % 2 ? (col + 1) / 2 - .5 : -col / 2 - .5);
    return { x: offset * width * 1.4, y: -Math.floor(i / columns) * width * 2.45, i };
  }).sort((a, b) => a.y - b.y || a.i - b.i);
}
// 绘制、拖动和碰撞共用实际外框；摇摆与抬脚也计入边界，人数只改变代表人数和尺寸。
const roadHalfAt = (y, width, height) => width * .48 * (.57 + .37 * clamp(y / height, 0, 1));
function crowdLayout(count, lane, view = {width:480,height:800,scale:1}, gate = false) {
  const {width: w, height: h, scale} = view;

  if(outline){ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*.15);ctx.strokeStyle='#fff';ctx.strokeText(value,x,y+1);}
  ctx.fillStyle=color;ctx.fillText(value,x,y);
}
function image(name,x,y,w,h,alpha=1) {
  const img=assets[name];ctx.save();ctx.globalAlpha*=alpha;
  if(img)ctx.drawImage(img,x,y,w,h);else{box(x,y,w,h,Math.min(10,w/4),name.startsWith('enemy')||name==='boss'?'#ea91ac':'#7ac8f0','#fff');if(w>22)text(name.startsWith('kid_run')?'队员':name.startsWith('enemy')?'对手':'',x+w/2,y+h/2,Math.min(11,w/3),'#fff',false);}
  ctx.restore();
}
function shadow(x,y,w,alpha=.14){ctx.fillStyle='rgba(63,78,103,'+alpha+')';ctx.beginPath();ctx.ellipse(x,y,w*.42,w*.16,0,0,Math.PI*2);ctx.fill();}
function sprite(name,x,y,w,phase,alpha=1,angle=0) {
  const img=assets[name],kid=name.startsWith('kid_run_'),sheet=kid?assets['run/'+name+'_sheet']:null;
  const ratio=img?img.height/img.width:1.7,h=w*(kid?ratio:Math.min(1.9,ratio));
  const stride=kid?run.runClock+phase:phase,speed=kid?run.runSpeed:1;
  const hop=speed>0?Math.abs(Math.sin(kid?stride*Math.PI/4:phase))*(kid?.45:3):0;
  shadow(x,y+2,w,alpha*.15);ctx.save();ctx.translate(kid?x:x+Math.sin(phase)*1.2,y-hop);
  // 孩子的肢体由精灵帧摆动，锚点不再左右晃；旧图失败时仍能正常玩。
  ctx.rotate((kid?0:Math.sin(phase)*.035)+angle);
  if(sheet){const frame=runFrame(run.runClock,phase,run.runSpeed);ctx.globalAlpha*=alpha;ctx.drawImage(sheet,frame*256,0,256,512,-w/2,-h*500/512,w,h);}
  else image(name,-w/2,-h,w,h,alpha);
  ctx.restore();
}
function roadScale(y){return .57+.37*clamp(y/H,0,1);}
function roadHalf(y){return roadHalfAt(y,W,H);}
function project(z,lane=0){const d=z-run.z,s=clamp(1-d/1450,.12,1.18),y=playerY-d*.55;return{x:W/2+lane*roadHalf(y)*.69,y,s};}
function currentPlayerX(){return runFormation(run).centerX;}
function drawBoard() {
  ctx.fillStyle=run.level.theme?'#ead8fa':'#c1ecff';ctx.fillRect(0,0,W,H);
  const sky=assets.bg_sky;
  if(sky){const height=W*sky.height/sky.width,offset=(run.z*.035)%Math.max(1,height);ctx.save();if(run.level.theme)ctx.filter='hue-rotate(25deg)';ctx.drawImage(sky,-8+Math.sin(time*.15)*5,-offset,W+16,height);ctx.drawImage(sky,-8+Math.sin(time*.15)*5,height-offset,W+16,height);ctx.restore();}
  const top=roadHalf(0),bottom=roadHalf(H);
  ctx.save();ctx.beginPath();ctx.moveTo(W/2-top,0);ctx.lineTo(W/2+top,0);ctx.lineTo(W/2+bottom,H);ctx.lineTo(W/2-bottom,H);ctx.closePath();ctx.clip();
  ctx.fillStyle='#ffe4b7';ctx.fillRect(0,0,W,H);
  const tile=assets.track_tile,offset=(run.z*.55)%W;
  // 每条横带都使用同一张路面图，透视宽度连续变化，接缝处重叠一像素。
  if(tile)for(let y=-W+offset;y<H;y+=8){const half=roadHalf(y+4);const sourceY=((y-offset)%W+W)%W/W*tile.height;ctx.drawImage(tile,0,sourceY,tile.width,Math.min(tile.height-sourceY,8/W*tile.height+1),W/2-half,y,half*2,9);}
  const haze=ctx.createLinearGradient(0,0,0,H*.65);haze.addColorStop(0,'#fff5');haze.addColorStop(1,'#fff0');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle='#fff8';ctx.beginPath();ctx.moveTo(W/2-top+6,0);ctx.lineTo(W/2-bottom+6,H);ctx.moveTo(W/2+top-6,0);ctx.lineTo(W/2+bottom-6,H);ctx.stroke();
  ctx.save();ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.setLineDash([13,20]);ctx.lineDashOffset=-run.z*.55;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.restore();
}
function drawGate(row){
  const p=project(row.z);if(p.y<50||p.y>playerY+165)return;
  ctx.save();
  const half=roadHalf(p.y),w=half*.9,h=w*1.096;
  ctx.globalAlpha=(row.z<run.z?.23:1)*clamp((p.y-h-75)/65,0,1);
  row.gates.forEach((gate,i)=>{
    const x=W/2+(i?1:-1)*half*.49,name=gate.op==='×'?'gate_times':gate.op==='-'||gate.op==='÷'?'gate_minus':'gate_plus';
    shadow(x,p.y,w,.09);image(name,x-w/2,p.y-h,w,h);
    const nextGate=run.level.rows.slice(run.rowIndex).find(r=>r.type==='gate');
    if(row===nextGate&&i===(run.x<=0?0:1)){ctx.fillStyle='#ffcb52';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,p.y-h-17);ctx.lineTo(x+9,p.y-h-17);ctx.lineTo(x,p.y-h-5);ctx.closePath();ctx.fill();ctx.stroke();}
    const value=(gate.op==='+'?'＋':gate.op==='-'?'−':gate.op)+gate.value;
    // 素材门楣位于裁剪后高度的约27%，数字始终落在留白区域。
    ctx.save();ctx.shadowColor='#5d3c7f77';ctx.shadowBlur=2;ctx.shadowOffsetY=2;text(value,x,p.y-h*.733,Math.min(34,w*.185),'#fff',false);ctx.shadowBlur=0;ctx.lineWidth=3;ctx.strokeStyle=name==='gate_minus'?'#c34467':name==='gate_times'?'#a573d1':'#318fc9';ctx.strokeText(value,x,p.y-h*.733);ctx.fillStyle='#fff';ctx.fillText(value,x,p.y-h*.733);ctx.restore();
  });ctx.restore();
}
function badge(count,x,y,enemy=false,small=false){
  const value=(count>playerPoints(count).length?'×':'')+Math.max(0,Math.floor(count)).toLocaleString('en-US'),size=small?21:31;
  const width=Math.max(small?48:67,value.length*size*.65+22);x=clamp(x,width/2+5,W-width/2-5);y=Math.max(161,y);
  box(x-width/2,y-21,width,43,16,enemy?'#ec789d':'#44b6ef','#fff');text(value,x,y+1,size,'#fff',false);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x-5,y+23);ctx.lineTo(x+5,y+23);ctx.lineTo(x,y+30);ctx.fill();
}
function drawChest(x,y,w){
  shadow(x,y+6,w);box(x-w*.5,y-w*.62,w,w*.68,8,'#d68c34','#fff4');box(x-w*.52,y-w*.78,w*1.04,w*.33,8,'#ffd66d','#fff1b0');
  box(x-w*.08,y-w*.49,w*.16,w*.29,3,'#fff6b2');image('icon_star',x-w*.15,y-w*.45,w*.3,w*.29);text('宝箱',x,y-w-9,13,'#b77936');
}
function drawRow(row){
  const p=project(row.z,obstacleX(row,run.elapsed)/.65);if(p.y<75||p.y>playerY+100)return;if(row.type==='gate'){drawGate(row);return;}
  ctx.save();ctx.globalAlpha=row.z<run.z?.16:1;
  const w=(row.type==='saw'?67:row.type==='spikes'?82:47)*Math.max(.65,p.s);
  if(row.type==='saw'){
    shadow(p.x,p.y+7,w);ctx.save();ctx.translate(p.x,p.y-22*p.s);ctx.rotate(time*4);image('obstacle_saw',-w/2,-w/2,w,w);ctx.restore();text('−'+row.damage,p.x,p.y-w-8,18,'#c96e88');
  }else if(row.type==='spikes'){
    shadow(p.x,p.y+4,w);image('obstacle_spike',p.x-w/2,p.y-w*.43,w,w*.43);text('−'+row.damage,p.x,p.y-w*.65,18,'#c96e88');
  }else if(row.type==='coins'){
    const size=25*Math.max(.65,p.s);for(let i=0;i<row.amount;i++){const yy=p.y-i*22*p.s;const xx=p.x+Math.sin(i*.9)*9;shadow(xx,yy,size,.07);image('icon_coin',xx-size/2,yy-size,size,size*1.12);}
  }else if(row.type==='rescue'){
    const size=spriteW;for(let i=0;i<Math.min(4,row.amount);i++)sprite('kid_run_'+(skinIndex+1),p.x+(i-(row.amount-1)/2)*size*1.24,p.y+Math.abs(i-1)*10,size,runPhase(i+1000,run.level.number));
    text('救救我！ +'+row.amount,p.x,p.y-size*2.6,14,'#38a3cb');
  }else if(row.type==='chest')drawChest(p.x,p.y,w);
  else if(row.type==='enemy'){
    const size=30*p.s;formation(Math.min(row.damage,8),size).forEach(q=>sprite('enemy_'+(row.kind||1),p.x+q.x,p.y+q.y,size,time*10+q.i));
    text('对手 '+row.damage,p.x,p.y-size*3.2,15,'#d16d93');
  }ctx.restore();
}
// 小队始终占据底部30%；尺寸和代表人数使用与碰撞相同的纯逻辑计算。
function playerPoints(count){return runFormation({...run,count}).points;}
function updateSquad(count,dt){
  const layout=runFormation({...run,count});spriteW=layout.size;
  // 尺寸或列数变化时立即落在新网格；淡入保留，不让补间过程挤出护栏或重叠。
  const old=new Map(squad.map(p=>[p.i,p]));
  squad=layout.points.map(p=>({...p,alpha:Math.min(1,(old.get(p.i)?.alpha||0)+dt*3.5)}));
  formationCount=squad.length;formationWidth=spriteW;ghosts=[];
  return layout;
}
function drawPlayer(dt,y=playerY,x=currentPlayerX(),count=run.count,battle=false){
  const layout=updateSquad(count,dt);x=battle?W/2:layout.centerX;y=battle?y:layout.centerY;
  if(run.powers.shield||run.powers.dash>0||run.flash>0){
    ctx.save();ctx.strokeStyle=run.powers.dash>0?'#ffdd5466':'#88ddff66';ctx.lineWidth=4;
    const width=layout.right-layout.left,height=layout.bottom-layout.top;
    ctx.beginPath();ctx.ellipse(x,y-height/2,width/2,height/2,0,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  squad.forEach(p=>sprite('kid_run_'+(skinIndex+1),x+p.x,y+p.y,spriteW,runPhase(p.i,run.level.number),p.alpha));
  const top=layout.top-layout.centerY;
  if(!battle)$('hint').style.bottom=(H-layout.top)*cssScale+105+'px';
  if(battle){badge(count,70,H-58);text('小队',70,H-93,13,'#4c8ca9');}else badge(count,layout.badgeX,y+top-36);return{x,y,top};
}
function drawEnemyCrowd(count,x,y,width=29,limit=32){
  const points=formation(Math.min(count,limit),width);points.forEach(p=>sprite('enemy_'+(p.i%3+1),x+p.x,y+p.y,width,time*10+p.i*1.7));
}
function drawFinish(){
  const p=project(run.level.finish);if(p.y<90||p.y>H+100)return;const half=roadHalf(p.y);
  for(let i=0;i<16;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#8ba2ce':'#fff';ctx.fillRect(W/2-half+i*half/8,p.y+j*9,half/8+1,9);}
  drawEnemyCrowd(run.level.boss,W/2,p.y-80,24*Math.max(.6,p.s),25);
  const width=(run.level.isBoss?144:100)*Math.max(.6,p.s);image('boss',W/2-width/2,p.y-205*p.s,width,width*.764);
  badge(run.level.boss,W/2,p.y-235*p.s,true,true);
}
function drawBattleEnemies(count,x,y,width,dt){
  const points=formation(Math.min(count,run.level.isBoss?42:30),width),old=new Map(enemySprites.map(p=>[p.i,p]));
  for(const p of enemySprites)if(!points.some(q=>q.i===p.i))enemyGhosts.push({...p,life:.5,vx:(p.i%2?1:-1)*120,vy:-130});
  const step=1-Math.exp(-dt*15);
  enemySprites=points.map(p=>{const previous=old.get(p.i),tx=x+p.x,ty=y+p.y;return previous?{i:p.i,x:previous.x+(tx-previous.x)*step,y:previous.y+(ty-previous.y)*step}:{i:p.i,x:tx,y:ty};});
  enemyGhosts=enemyGhosts.filter(p=>p.life>0).slice(-32);enemyGhosts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*dt;});
  [...enemySprites,...enemyGhosts].sort((a,b)=>a.y-b.y).forEach(p=>sprite('enemy_'+(p.i%3+1),p.x,p.y,width,time*10+p.i*1.7,p.life===undefined?1:clamp(p.life*2,0,1),p.life===undefined?0:(1-p.life*2)*.8));
}
function drawBattle(dt){
  const t=run.battleTime,approach=clamp(t/.9,0,1),points=playerPoints(run.count);
  // 用双方的真实阵型边界安排碰撞线，大队伍也不会把对方的脸和计数盖住。
  const top=points.reduce((m,p)=>Math.min(m,p.y),0)-spriteW*2.23,bottom=points.reduce((m,p)=>Math.max(m,p.y),0);
  const clashY=Math.min(H*.5,H-(bottom-top)-35),finalY=clashY-top+8;
  const startY=runFormation(run).centerY,ourY=startY+(finalY-startY)*approach,enemyWidth=Math.min(spriteW*.8,24);
  const enemyPoints=formation(Math.min(run.enemyLeft,run.level.isBoss?42:30),enemyWidth);
  const enemyBottom=enemyPoints.reduce((m,p)=>Math.max(m,p.y),0),enemyY=clashY-enemyBottom-12-(1-approach)*65;
  drawBattleEnemies(run.enemyLeft,W/2,enemyY,enemyWidth,dt);
  const bossWidth=run.level.isBoss?150:112,bossY=Math.max(183,clashY-205),bossX=W/2+Math.sin(time*13)*run.hurt*14;
  ctx.save();if(run.enemyLeft===0)ctx.globalAlpha=clamp((3.95-t)/.4,0,1);
  image('boss',bossX-bossWidth/2,bossY,bossWidth,bossWidth*.764);ctx.restore();
  badge(run.enemyLeft,W/2,bossY-31,true);
  drawPlayer(dt,ourY,W/2,run.count,true);
  if(t>.85&&t<3.6){const size=34+Math.sin(time*22)*5;image('icon_star',W/2-size/2,clashY-size/2,size,size);}
  if(t>=3.6&&run.enemyLeft===0)text('小队真棒！',W/2,clashY-145,26,'#e9a737');
}
function burst(x,y,kind='spark',amount=18){
  for(let i=0;i<Math.min(amount,150-particles.length);i++){
    const angle=Math.random()*Math.PI*2,speed=45+Math.random()*160;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-(kind==='confetti'?120:45),life:kind==='confetti'?1.8+Math.random():.6+Math.random()*.4,kind,size:kind==='confetti'?20+Math.random()*14:6+Math.random()*9,frame:i%12});
  }
}
function float(value,color='#26a4d4',atY=playerY-170){floats.push({text:value,x:currentPlayerX(),y:atY,life:1.15,color});}
function drawEffects(dt){
  particles=particles.filter(p=>p.life>0);particles.forEach(p=>{
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;
    ctx.save();ctx.globalAlpha=clamp(p.life/.35,0,1);ctx.translate(p.x,p.y);ctx.rotate(time*3+p.frame);
    if(p.kind==='confetti'&&assets.confetti){const img=assets.confetti,cw=img.width/4,ch=img.height/3;ctx.drawImage(img,(p.frame%4)*cw,Math.floor(p.frame/4)*ch,cw,ch,-p.size/2,-p.size/2,p.size,p.size);}
    else if(p.kind==='star')image('icon_star',-p.size/2,-p.size/2,p.size,p.size);
    else box(-p.size/2,-p.size/2,p.size,p.size,3,p.frame%2?'#fff4b2':'#b4f1ff');ctx.restore();
  });
  floats=floats.filter(p=>p.life>0);floats.forEach(p=>{p.life-=dt;p.y-=35*dt;ctx.save();ctx.globalAlpha=clamp(p.life/.25,0,1);text(p.text,p.x,p.y,28,p.color);ctx.restore();});
}
function showResult(won){
  if(handled)return;handled=true;clearPointer();$('pauseButton').disabled=true;$('hint').hidden=true;
  const stats=resultStats(run);bank+=stats.reward;write('crowdRunnerCoins',bank);
  if(won){savedLevel=normalizeLevel(run.level.number+1);write('crowdRunnerLevel',savedLevel);burst(100,H*.35,'confetti',65);burst(W-100,H*.35,'confetti',65);}
  $('resultStars').setAttribute('aria-label',stats.stars+'颗星');[...$('resultStars').children].forEach((star,i)=>star.classList.toggle('earned',i<stats.stars));
  $('resultHero').style.visibility='';$('resultHero').src='assets/kid_'+(won?'cheer':'sad')+'.png';$('resultHero').alt=won?'开心庆祝的你':'给你加油的伙伴';$('resultTitle').textContent=won?'你赢啦！':'再来一次！';
  $('resultCopy').textContent=won?'第 '+run.level.number+' 关完成！伙伴越多，星星越亮。':'已经很棒啦！找加号和乘号门，我们一起再试试。';
  $('remainingScore').textContent=stats.remaining;$('peakScore').textContent=stats.best;$('rewardCoins').textContent=run.coins+stats.reward;
  $('resultButtonLabel').textContent=won?'下一关':'再来一次！';$('resultButtonIcon').src='assets/btn_'+(won?'play':'retry')+'.png';
  $('resultScreen').querySelectorAll('.celebrate').forEach(img=>img.hidden=!won);$('resultScreen').hidden=false;sound(won?'won':'lost');
}
function handleEvents(){
  for(const event of run.events){
    if(event.type==='gate'){
      float((event.delta>=0?'＋':'−')+Math.abs(event.delta),event.positive?'#26a4d4':'#db7b96');burst(currentPlayerX(),playerY-40,event.positive?'spark':'star',22);
      if(event.combo>=2){$('combo').textContent='Combo ×'+event.combo;comboLife=1.6;$('combo').classList.add('show');}else if(!event.positive)comboLife=0;
      sound(event.positive?'gate':'hit',event.combo);
    }
    if(event.type==='coin'||event.type==='chest'){bank+=event.amount;write('crowdRunnerCoins',bank);sound(event.type);if(event.type==='coin')float('金币 +'+event.amount,'#dd9e28',playerY-210);}
    if(event.type==='chest'){const names={shield:'护盾，挡一次伤害',magnet:'磁铁，吸走金币',dash:'冲刺，无敌加速'};float(names[event.power],'#a47de2');burst(currentPlayerX(),playerY-50,'star',24);}
    if(event.type==='rescue'){float('新伙伴 +'+event.delta);sound('rescue');burst(currentPlayerX(),playerY-30,'spark',22);}
    if(['hit','smash','shield'].includes(event.type)){float(event.type==='hit'?'−'+Math.abs(event.delta):event.type==='shield'?'护盾保护！':'冲过去！',event.type==='hit'?'#e07694':'#a08ddd');burst(currentPlayerX(),playerY-80,'star',22);sound(event.type);}
    if(event.type==='battle'){clearPointer();$('hint').hidden=true;sound('battle');}
    if(event.type==='clash'){
      // 总人数超过精灵上限时，借一名前排精灵表现损失，其空位由后备伙伴补上。
      if(run.count>=60&&squad.length){const front=[...squad].sort((a,b)=>a.y-b.y).slice(0,12),p=front[run.exchanged%front.length];if(!ghosts.some(g=>g.sourceId===p.i))ghosts.push({...p,sourceId:p.i,life:.48,vx:(p.i%2?1:-1)*150,vy:-180});}
      burst(W/2,H*.54,'star',Math.min(8,event.amount+2));sound('clash');
    }
    if(event.type==='won'||event.type==='lost')showResult(event.type==='won');
  }run.events.length=0;
  if(run.best>best){best=run.best;write('crowdRunnerBest',best);}
}
function updateHud(dt){
  const progress=Math.min(100,Math.floor(run.z/run.level.finish*100));if(progress!==hudProgress){hudProgress=progress;$('progressFill').style.width=progress+'%';$('progressFill').parentElement.setAttribute('aria-valuenow',progress);}
  if(displayedBank!==bank){displayedBank=bank;$('coinText').textContent=bank;}if(displayedBest!==best){displayedBest=best;$('bestText').textContent='最多 '+best.toLocaleString('en-US')+' 人';}
  const statuses=[];if(run.powers.shield)statuses.push('护盾 · 1次');if(run.powers.magnet>0)statuses.push('磁铁 · '+Math.ceil(run.powers.magnet)+'秒');if(run.powers.dash>0)statuses.push('冲刺 · '+Math.ceil(run.powers.dash)+'秒');
  const value=statuses.join('|');if(value!==powerText){powerText=value;$('powers').innerHTML=statuses.map(s=>'<span class="power">'+s+'</span>').join('');}
  comboLife-=dt;if(comboLife<=0)$('combo').classList.remove('show');
  if(run.elapsed>5||run.count>20)$('hint').style.opacity='0';
}
function draw(dt){
  ctx.save();if(run.hurt>0)ctx.translate(Math.sin(time*75)*run.hurt*7,Math.cos(time*63)*run.hurt*3);
  drawBoard();
  if(run.phase==='battle'||(run.phase==='paused'&&pausedPhase==='battle')||run.battleTime>0)drawBattle(dt);
  else{
    drawFinish();
    const rows=run.level.rows.filter(row=>{const p=project(row.z);return p.y>50&&p.y<playerY+170;}).sort((a,b)=>b.z-a.z);
    rows.forEach(drawRow);drawPlayer(dt);
  }
  if(run.flash>0){ctx.fillStyle='rgba(255,242,172,'+(run.flash*.09)+')';ctx.fillRect(0,0,W,H);}
  drawEffects(dt);ctx.restore();
}
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-(lastTime||now))/1000));lastTime=now;
  const active=!qaFrozen&&!document.hidden&&run.phase!=='paused'&&run.phase!=='ready';
  if(active){time+=dt;advance(run,dt);handleEvents();updateHud(dt);}
  if(loaded&&!document.hidden&&run.phase!=='ready')draw(active?dt:0);
  requestAnimationFrame(frame);
}
// 仅显式带 ?qa 的本地验收页面开放场景控制，正常游戏不启用捷径。
if(new URLSearchParams(location.search).has('qa'))globalThis.__crowdQA={
  get state(){return run;},get metrics(){const layout=runFormation(run),points=layout.points;return{...layout,points,cssScale,playerX:currentPlayerX(),playerY,skin:skinIndex+1,spritePixels:spriteW*cssScale,rendered:points.length,exits:ghosts.length+enemyGhosts.length,dpr:canvas.width/(W*cssScale),width:W,height:H,runClock:run.runClock,runFrames:squad.map(p=>runFrame(run.runClock,runPhase(p.i,run.level.number),run.runSpeed)),runSheets:ASSET_NAMES.filter(n=>n.startsWith('run/')).filter(n=>assets[n]).length};},
  scene(count=30,scene='running'){
    start();run.count=run.best=count;run.level.rows=generateLevel(savedLevel).rows;run.z=220;
    if(scene==='battle'||scene==='won'||scene==='lost'){run.level=generateLevel(5);run.phase='battle';run.battleOurs=count;run.battleEnemy=run.enemyLeft=run.level.boss;run.battleTime=1.1;run.z=run.level.finish;}
    $('hint').hidden=scene!=='running'||count>20;$('levelText').textContent='第 '+run.level.number+' 关';$('themeText').textContent=(run.level.theme?'棉花糖天空':'糖果平原')+(run.level.isBoss?' · Boss 来啦':'');handleEvents();updateHud(0);
    formationCount=-1;updateSquad(count,1);squad.forEach(p=>{p.x=p.tx;p.y=p.ty;p.alpha=1;});
    if(scene==='won'||scene==='lost'){run.phase=scene;run.count=scene==='won'?Math.max(1,count-run.level.boss):0;run.enemyLeft=scene==='won'?0:run.level.boss;showResult(scene==='won');}
    draw(0);return this.metrics;
  },freeze(value=true){qaFrozen=value;},setSkin(index){skinIndex=clamp(index,0,5);},pause, resume, home,advance(seconds){for(let t=0;t<seconds;t+=.05){advance(run,Math.min(.05,seconds-t));handleEvents();}draw(0);}
};
resize();renderSkins();syncMute();preload();requestAnimationFrame(frame);
})();
