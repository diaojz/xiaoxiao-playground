<style>

}

<script>
(() => {
'use strict';
// 数字、发音别名和每课素材共用同一份编号。
const words = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');
const aliases = [
  'zero', 'one won wan want', 'two to too tu do', 'three tree free sri', 'four for fore far',
  'five fife fly hive', 'six sex sick sicks', 'seven', 'eight ate eat hey', 'nine nein nice line',
  'ten tan then den', 'eleven', 'twelve twelf', 'thirteen thirty', 'fourteen forty', 'fifteen fifty',
  'sixteen sixty', 'seventeen seventy', 'eighteen eighty', 'nineteen ninety', 'twenty'

const animals = [...'🐶🐱🐥🐻🐼🐨🐵🐢🦁🦋🐰🐷🐮🐸🦉🐙🦊🐹🐧🦄'];
const range = (start, end) => Array.from({ length: end - start + 1 }, (_, i) => start + i);
function matchNumber(transcripts, n) {
  return Boolean(aliases[n]) && transcripts.some(text =>
    (String(text).toLowerCase().match(/[a-z0-9]+/g) || []).some(word => aliases[n].has(word)));
}
function normalizeSave(raw) {
  const learned = Array.isArray(raw?.learned)
    ? [...new Set(raw.learned.filter(n => typeof n === 'number' || typeof n === 'string')
      .map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 20))].sort((a, b) => a - b) : [];
  const unlockedLevel = range(1, 10).every(n => learned.includes(n)) ? 2 : 1;
  const valid = learned.filter(n => n <= unlockedLevel * 10);
  const stickers = Object.fromEntries(valid.map(n => {
    const sticker = raw?.stickers?.[n];
    return [n, typeof sticker === 'string' && /^\p{Extended_Pictographic}$/u.test(sticker) ? sticker : animals[n - 1]];
  }));
  const stars = Number(raw?.reviewStars);
  return { learned: valid, stickers, unlockedLevel, reviewStars: Number.isSafeInteger(stars) && stars > 0 ? stars : 0 };
}
function completeLesson(save, n) {
  if (!Number.isInteger(n) || n < 1 || n > save.unlockedLevel * 10) return save;
  return normalizeSave({ ...save, learned: [...save.learned, n] });
}
function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function choicesFor(n, unlockedMax) {
  const others = range(1, Math.max(5, unlockedMax)).filter(value => value !== n);
  return shuffle([n, ...shuffle(others).slice(0, 2)]);
}
function reviewDeck(learned) {
  if (learned.length < 3) return [];
  const deck = shuffle(learned);
  if (deck.length < 5) {
    const next = shuffle(learned);
    if (next[0] === deck.at(-1)) [next[0], next[1]] = [next[1], next[0]];
    deck.push(...next);
  }
  return deck.slice(0, 5);
}
if (typeof document === 'undefined') {
  globalThis.__test = { matchNumber, normalizeSave, completeLesson, choicesFor, reviewDeck };
  return;
}

const qa = new URLSearchParams(location.search).has('qa');
const saveKey = qa ? 'englishNumbersQASave' : 'englishNumbersSave';
let save = normalizeSave(null);
try { save = normalizeSave(JSON.parse(localStorage.getItem(saveKey))); } catch (_) {}
function persist() {
  try { localStorage.setItem(saveKey, JSON.stringify(save)); } catch (_) {}
}
const $ = selector => document.querySelector(selector);
const stage = $('#stage');
const book = $('#book');
const road = $('#road');
const replay = $('#replay');
const palette = [['#ffd2e5','#d689ad'],['#ffe09a','#d8a857'],['#bbebe1','#78bfb2'],['#e2d0fc','#af91da'],['#c6e7ff','#86b7df']];
const colors = i => '--face:' + palette[i % palette.length][0] + ';--shade:' + palette[i % palette.length][1];
const icon = (symbol, label) => '<span class="icon" aria-hidden="true">' + symbol + '</span><small>' + label + '</small>';
const clips = {
  en_count: "Let's count!", en_great: 'Great!', en_super: 'Super!', en_wow: 'Wow!', en_yay: 'Yay!',
  en_tryagain: 'Try again!', en_sayit: 'Say it with me!',
  zh_listen: '听一听，点一点', zh_follow: '轮到你啦，跟我读', zh_find: '找一找，是哪个数字？',
  zh_tap_mic: '点一下话筒，大声说', zh_good: '读得真棒', zh_again: '再听一次，我们再来',
  zh_hear_me: '听听你自己的声音', zh_sticker: '得到一张贴纸', zh_pick: '选一个好玩的',
  zh_not_this: '不是这个哦，再找找'
};
const en = n => 'en_' + n;
// 同一播放器用于本地语音和录音。换场景时立刻结束旧队列。
const audio = new Audio();
const synth = window.speechSynthesis;
let audioRun = 0;
let finishClip;
let unlocked = false;
function stopAudio() {
  audioRun++;
  const finish = finishClip;
  if (finish) finish();
  audio.pause();
  synth?.cancel();
}
function playClip(id, showWord) {
  return new Promise(resolve => {
    let speech;
    let timer;
    let failed = false;
    let closed = false;
    function done() {
      if (closed) return;
      closed = true;
      clearTimeout(timer);
      audio.onended = audio.onerror = null;
      audio.pause();
      if (speech) {
        speech.onend = speech.onerror = null;
        synth?.cancel();
      }
      showWord?.classList.remove('speaking');
      finishClip = null;
      resolve();
    }
    function fallback() {
      if (closed || failed) return;
      failed = true;
      clearTimeout(timer);
      audio.pause();
      const message = clips[id] || (id.startsWith('en_') && words[Number(id.slice(3))]);
      if (!message || !synth || !window.SpeechSynthesisUtterance) return done();
      speech = new SpeechSynthesisUtterance(message);
      speech.lang = id.startsWith('zh_') ? 'zh-CN' : 'en-US';
      speech.rate = .88;
      speech.onend = speech.onerror = done;
      timer = setTimeout(done, 5500);
      try { synth.speak(speech); } catch (_) { done(); }
    }
    finishClip = done;
    showWord?.classList.add('speaking');
    audio.onended = done;
    audio.onerror = fallback;
    audio.src = id.startsWith('blob:') ? id : 'assets/voice/' + id + '.m4a';
    timer = setTimeout(fallback, 6500);
    audio.play().catch(error => {
      if (error.name === 'NotAllowedError' && !unlocked) done();
      else fallback();
    });
  });
}
async function say(sequence, card) {
  stopAudio();
  const run = audioRun;
  for (const id of sequence) {
    if (run !== audioRun) return;
    await playClip(id, id === en(n) ? card : null);
  }
}
let screen = 'home';
let n = 1;
let step = 1;
let hits = 0;
let attempts = 0;
let round = 0;
let deck = [];
let options = [];
let mode = 'idle';
let epoch = 0;
let stopMic = null;
let followCue = 0;
let recordingUrl = null;
let section = 1;
let busy = false;
let countTail = Promise.resolve();
let countPending = 0;
let prompt = ['zh_pick'];
function playPrompt() {
  return say(prompt, $('.word-card'));
}
function effect(symbols = ['⭐','✨','🎉']) {
  const layer = $('.fx');
  const bits = range(1, 16).map(i => {
    const bit = document.createElement('i');
    const angle = i * Math.PI / 8;
    bit.textContent = symbols[i % symbols.length];
    bit.style.setProperty('--x', Math.round(Math.cos(angle) * (100 + i * 6)) + 'px');
    bit.style.setProperty('--y', Math.round(Math.sin(angle) * (80 + i * 6)) + 'px');
    return bit;
  });
  layer.replaceChildren(...bits);
  setTimeout(() => bits.forEach(bit => bit.remove()), 900);
}
function view(name, voice) {
  epoch++;
  stopMic?.();
  stopMic = null;
  stopAudio();
  if (recordingUrl) URL.revokeObjectURL(recordingUrl);
  recordingUrl = null;
  screen = name;
  mode = 'idle';
  busy = false;
  countPending = 0;
  countTail = Promise.resolve();
  prompt = voice;
  $('#lesson-action').replaceChildren();
  road.hidden = name === 'home';
  replay.disabled = false;
  window.scrollTo(0, 0);
  return epoch;
}
function maybeSpeak() {
  if (unlocked) void playPrompt();
}
function showHome() {
  view('home', ['zh_pick']);
  const next = range(1, save.unlockedLevel * 10).find(value => !save.learned.includes(value));
  if (next) section = next > 10 ? 2 : 1;
  renderHome(next);
  maybeSpeak();
}
const kidArt = {
  station: '<img class="kid station-kid" src="assets/kid/kid_front.png" alt="">',
  follow: '<img class="kid follow-kid" src="assets/kid/kid_front.png" alt="小老师">',
  cheer: '<img class="kid cheer-kid" src="assets/kid/kid_cheer.png" alt="小主角举手欢呼">',
  album: '<img class="kid album-kid" src="assets/kid/kid_avatar.png" alt="小主角">'

function renderHome(next) {
  const stations = range(section * 10 - 9, section * 10).map((value, i) =>
    '<button class="station ' + (value === next ? 'next' : '') + '" style="' + colors(i) + '" data-n="' + value + '" aria-label="学习 ' + value + '">' +
    (value === next ? kidArt.station : '') + '<span>' + (save.stickers[value] ? save.stickers[value] + '<small>' + value + '</small>' : value) + '</span></button>').join('');
  stage.innerHTML = '<section class="screen"><h1>数字小路</h1><p class="caption">🌈 ' + (section === 1 ? '1 – 10' : '11 – 20') + '</p>' +
    '<div class="path">' + stations + '</div><div class="home-tools">' +
    (save.learned.length >= 3 ? '<button id="review" class="review">' + icon('🎈', '气球复习') + '</button> ' : '') +
    (save.unlockedLevel === 2 ? '<button id="section">' + icon('🛤️', section === 1 ? '11 – 20' : '1 – 10') + '</button>' : '') +
    '</div></section>';

  $('#section')?.addEventListener('click', () => {
    section = 3 - section;
    renderHome(next);

  });

}
function showAlbum() {
  view('album', []);
  const slots = range(1, 20).map(value =>
    '<div class="slot">' + (save.stickers[value] || '·') + '<small>' + value + '</small></div>').join('');
  stage.innerHTML = '<section class="screen"><h1 class="album-heading">' + kidArt.album + '贴纸册</h1><p class="caption">' + save.learned.length + ' / 20 张贴纸 · ⭐ ' + save.reviewStars + '</p><div class="album">' + slots + '</div></section>';

}
function heading(label) {
  if (deck.length) return '<p class="caption">🎈 ' + (round + 1) + ' / 5</p><h2 class="lesson-title">' + label + '</h2>';
  return '<div class="dots" aria-label="第 ' + step + ' 步，共 3 步">' +
    range(1, 3).map(value => '<i class="' + (value === step ? 'active' : value < step ? 'past' : '') + '"></i>').join('') +
    '</div><h2 class="lesson-title">' + label + '</h2>';
}
function wordCard() {
  return '<button class="word-card" aria-label="听数字 ' + n + '"><span class="number">' + n + '</span><span class="word" lang="en">' + words[n] + '</span></button>';
}
function startLesson(value) {
  if (!Number.isInteger(value) || value < 1 || value > save.unlockedLevel * 10) return false;
  n = value;
  deck = [];
  step = 1;
  hits = 0;
  const current = view('listen', ['zh_listen', en(n)]);
  stage.innerHTML = '<section class="screen">' + heading('👂 听一听') + '<div class="listen-grid">' + wordCard() +
    '<div class="objects" style="--columns:' + Math.min(n, n > 12 ? 6 : 4) + '">' +
    range(1, n).map(i => '<button class="object" aria-label="点亮第 ' + i + ' 个">' + toys[n - 1] + '</button>').join('') +
    '</div></div></section>';

  $('.word-card').onclick = () => { if (!countPending) void say([en(n)], $('.word-card')); };

    btn.disabled = true;
    btn.classList.add('lit', 'spark');

    countPending++;

      if (epoch !== current) return;
      await say([en(count)], $('.word-card'));
      if (epoch !== current) return;
      if (count === n) {
        effect();
        await say(['en_count', en(n)], $('.word-card'));

  const current = view('follow', ['zh_follow', en(n), 'zh_tap_mic']);
  mode = 'teaching';
  stage.innerHTML = '<section class="screen">' + heading('🎤 跟我读') + wordCard() +
    '<div class="follow-space">' + kidArt.follow + '<button id="mic" class="mic" aria-label="开始跟读" aria-disabled="true" hidden>🎤</button>' +
    '<button id="read-done" class="next-btn" hidden>' + icon('⭐', '我读好了') + '</button></div>' +
    (deck.length ? '<button id="skip" aria-label="跳过跟读">' + icon('⏩', '跳过') + '</button>' : '') + '</section>';
  $('#mic').onclick = startMic;
  $('#read-done').onclick = () => passFollow();
  $('#skip')?.addEventListener('click', nextRound);
  $('.word-card').onclick = () => { if (mode === 'ready' || mode === 'manual') void repeatFollow(); };
  void teach(current);
}
async function teach(current) {
  // 话筒提示开始时亮起，提示播完后才开始收音。
  const cue = ++followCue;
  await say(prompt.slice(0, -1), $('.word-card'));
  if (epoch !== current || cue !== followCue) return;
  $('#mic').hidden = false;
  $('#mic').classList.add('ready');
  await say(['zh_tap_mic']);
  if (epoch === current && cue === followCue) {
    mode = 'ready';
    micVisual('ready');
  }
}
async function repeatFollow() {
  const current = epoch;
  const previous = mode;
  mode = 'prompt';
  await playPrompt();
  if (epoch === current) mode = previous;
}
function micVisual(state, seconds) {
  const btn = $('#mic');
  btn.className = 'mic ' + state;
  btn.setAttribute('aria-disabled', String(state !== 'ready'));
  btn.innerHTML = '🎤' + (seconds ? '<small>' + seconds + '</small>' : '');
}
function startMic() {
  if (mode !== 'ready') return;
  const current = epoch;
  stopAudio();
  attempts++;
  mode = 'live';
  micVisual('live');
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) return void recordVoice(current);
  let recognition;
  try { recognition = new Recognition(); }
  catch (_) { return void recordVoice(current); }
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 5;
  let closed = false;
  let timer;
  let endTimer;
  let heardSpeech = false;
  function cleanup() {
    if (closed) return false;
    closed = true;
    clearTimeout(timer);
    clearTimeout(endTimer);
    recognition.onresult = recognition.onend = recognition.onerror = recognition.onspeechstart = null;
    try { recognition.abort(); } catch (_) {}
    stopMic = null;
    return true;
  }
  stopMic = cleanup;
  function finish(result) {
    if (!cleanup() || epoch !== current) return;
    if (result === 'error' && attempts < 3) void recordVoice(current);
    else if (result === 'match' || attempts >= 3) void passFollow();
    else void retryFollow(current);
  }
  recognition.onspeechstart = () => { heardSpeech = true; };
  recognition.onresult = event => {
    const candidates = Array.from(event.results).flatMap(result =>
      Array.from(result, item => item.transcript));
    if (matchNumber(candidates, n)) finish('match');
    else if (Array.from(event.results).some(result => result.isFinal)) finish('miss');
  };
  const finishWithoutResult = () => finish(heardSpeech ? 'miss' : 'error');
  recognition.onend = finishWithoutResult;
  recognition.onerror = () => finish('error');
  timer = setTimeout(() => {
    try { recognition.stop(); } catch (_) { finishWithoutResult(); }
    if (!closed) endTimer = setTimeout(finishWithoutResult, 500);
  }, 4000);
  try { recognition.start(); } catch (_) { finish('error'); }
}
async function retryFollow(current) {
  mode = 'teaching';
  micVisual('');
  prompt = ['en_tryagain', en(n), 'zh_tap_mic'];
  await teach(current);
}
async function recordVoice(current) {
  if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) return offerDone(current);
  let stream;
  let recorder;
  let interval;
  let timer;
  let permissionTimer;
  let cancelled = false;
  const chunks = [];
  // 切页或超时即清理设备；迟到的权限结果也会关闭麦克风。
  function release() {
    clearTimeout(permissionTimer);
    clearTimeout(timer);
    clearInterval(interval);
    if (recorder) {
      recorder.ondataavailable = recorder.onstop = recorder.onerror = null;
      if (recorder.state !== 'inactive') recorder.stop();
    }
    stream?.getTracks().forEach(track => track.stop());
    stopMic = null;
    cancelled = true;
  }
  stopMic = release;
  permissionTimer = setTimeout(() => { release(); offerDone(current); }, 7000);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (cancelled || epoch !== current) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    clearTimeout(permissionTimer);
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    recorder.onerror = () => { release(); offerDone(current); };
    recorder.onstop = async () => {
      release();
      if (epoch !== current) return;
      if (!chunks.length) return offerDone(current);
      recordingUrl = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType }));
      mode = 'playback';
      micVisual('');
      prompt = [en(n), 'zh_hear_me', recordingUrl];
      await replayRecording(current);
    };
    recorder.start();
    const ends = performance.now() + 2500;
    micVisual('live', 3);
    interval = setInterval(() => micVisual('live', Math.max(1, Math.ceil((ends - performance.now()) / 1000))), 100);
    timer = setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 2500);
  } catch (_) {
    if (cancelled) return;
    release();
    offerDone(current);
  }
}
async function replayRecording(current) {
  const cue = ++followCue;
  await playPrompt();
  if (cue === followCue) offerDone(current);
}
function offerDone(current) {
  if (epoch !== current) return;
  if (attempts >= 3) return void passFollow();
  mode = 'manual';
  $('#mic').hidden = true;
  $('#read-done').hidden = false;
  if (!recordingUrl) prompt = [en(n), 'zh_follow'];
}
async function passFollow() {
  if (screen !== 'follow' || busy) return;
  busy = true;
  followCue++;
  stopMic?.();
  const current = epoch;
  mode = 'passed';
  $('.follow-space').innerHTML = kidArt.cheer + '<span class="reward" role="img" aria-label="读得真棒">🌟</span>';
  $('#skip')?.remove();
  effect();
  prompt = [shuffle(['en_great', 'en_super', 'en_wow'])[0], 'zh_good'];
  if (unlocked) await playPrompt();
  if (epoch !== current) return;
  if (deck.length) nextRound();
  else showFind();
}
function showFind() {
  step = 3;
  view('find', ['zh_find', en(n)]);
  options = choicesFor(n, save.unlockedLevel * 10);
  stage.innerHTML = '<section class="screen">' + heading('🎈 找一找') +
    '<div class="balloons">' + options.map((value, i) =>
      '<button class="balloon" data-choice="' + value + '" style="' + colors(i + 1) + '">' + value + '</button>').join('') +
    '</div></section>';
  stage.querySelectorAll('.balloon').forEach(btn => btn.onclick = () => chooseBalloon(btn));
  maybeSpeak();
}
function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
async function chooseBalloon(button) {
  if (busy) return;
  if (Number(button.dataset.choice) !== n) {
    button.classList.remove('shake');
    void button.offsetWidth;
    button.classList.add('shake');
    void say(['zh_not_this', en(n)]);
    return;
  }
  busy = true;
  const current = epoch;
  stage.querySelectorAll('.balloon').forEach(btn => { btn.disabled = true; });
  button.classList.add('pop');
  effect(['🎉', '✨', '🎊']);
  prompt = ['en_yay'];
  await Promise.all([playPrompt(), wait(420)]);
  if (current !== epoch) return;
  if (deck.length) showFollow();
  else void giveSticker();
}
async function giveSticker() {
  const current = view('sticker', ['zh_sticker']);
  save = completeLesson(save, n);
  persist();
  stage.innerHTML = '<section class="screen"><h2>得到一张贴纸</h2><div class="celebration">' + kidArt.cheer + '<span class="reward" role="img" aria-label="新贴纸">' + save.stickers[n] + '</span></div></section>';
  const reward = $('.reward');
  const from = reward.getBoundingClientRect();
  const to = book.getBoundingClientRect();
  reward.style.setProperty('--fly-x', to.x + to.width / 2 - from.x - from.width / 2 + 'px');
  reward.style.setProperty('--fly-y', to.y + to.height / 2 - from.y - from.height / 2 + 'px');
  effect();
  if (unlocked) await Promise.all([playPrompt(), wait(450)]);
  if (current !== epoch) return;
  reward.classList.add('fly');
  if (unlocked) await wait(700);
  if (current === epoch) showHome();
}
function startReview() {
  deck = reviewDeck(save.learned);
  if (!deck.length) return;
  round = 0;
  n = deck[round];
  showFind();
}
function nextRound() {
  round++;
  if (round < deck.length) {
    n = deck[round];
    showFind();
    return;
  }
  view('star', ['en_yay']);
  save.reviewStars = Math.min(Number.MAX_SAFE_INTEGER, save.reviewStars + 1);
  persist();
  stage.innerHTML = '<section class="screen"><h2>复习完成</h2><span class="reward" role="img" aria-label="大星星">🌟</span>' +
    '<button class="next-btn" id="star-home">' + icon('🏡', '数字小路') + '</button></section>';
  $('#star-home').onclick = showHome;
  effect();
  maybeSpeak();
}
document.addEventListener('click', () => {
  // 首次可信点击在事件内播放，给 iOS 的复用播放器开启声音。
  unlocked = true;
  void playPrompt();
}, { once: true, capture: true });
replay.onclick = () => {
  if (busy || mode === 'prompt') return;
  if (mode === 'playback') return void replayRecording(epoch);
  if (mode === 'live') {
    stopMic?.();
    attempts--;
    mode = 'teaching';
    micVisual('');
  }
  if (mode === 'teaching') return void teach(epoch);
  if (countPending) {
    const current = epoch;
    void countTail.then(() => { if (epoch === current && !countPending) return playPrompt(); });
    return;
  }
  if (screen === 'follow') void repeatFollow();
  else void playPrompt();
};
book.onclick = showAlbum;
road.onclick = showHome;
window.addEventListener('pagehide', () => { stopMic?.(); stopAudio(); });
// App 切后台（iPad 回桌面、锁屏）时也立刻停掉话筒和语音，免得后台还在录音或出声
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopMic?.(); stopAudio(); } });
showHome();
void playPrompt();
if (qa) window.__englishNumbersQA = {
  startLesson,
  forcePass() {
    if (screen === 'listen') return showFollow();
    if (screen === 'follow') return passFollow();
    if (screen === 'find') return deck.length ? showFollow() : giveSticker();
  },
  get state() {
    return { screen, n, step, hits, attempts, round, mode, options: [...options], save: normalizeSave(save) };
  }
};
})();
</script>
