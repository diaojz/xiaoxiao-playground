const plurals = 'cat dogs ducks fish bees frogs birds pigs bears lions'.split(' ');

  ['feed', 'bubble', 'train'][reviewing ? Math.floor(random() * 3) : (n - 1) % 3];

  return save;
}
const range = (start, end) => Array.from({ length: end - start + 1 }, (_, i) => start + i);
function matchNumber(transcripts, n) {
  return Boolean(aliases[n]) && transcripts.some(text =>
    (String(text).toLowerCase().match(/[a-z0-9]+/g) || []).some(word => aliases[n].has(word)));
}
function normalizeSave(raw) {
  const learned = Array.isArray(raw?.learned)
    ? [...new Set(raw.learned.filter(n => typeof n === 'number' || typeof n === 'string')
      .map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 20))].sort((a, b) => a - b) : [];
  const unlockedLevel = range(1, 10).every(n => learned.includes(n)) ? 2 : 1;
  const valid = learned.filter(n => n <= unlockedLevel * 10);
  const stickers = Object.fromEntries(valid.map(n => {
    const sticker = raw?.stickers?.[n];
    return [n, typeof sticker === 'string' && /^\p{Extended_Pictographic}$/u.test(sticker) ? sticker : animals[n - 1]];
  }));
  const stars = Number(raw?.reviewStars);
  return { version: 2, readCount: Number.isSafeInteger(raw?.readCount) && raw.readCount > 0 ? raw.readCount : 0, learned: valid, stickers, unlockedLevel, reviewStars: Number.isSafeInteger(stars) && stars > 0 ? stars : 0 };

function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i--) {

}

    if (next[0] === deck.at(-1)) [next[0], next[1]] = [next[1], next[0]];

function playClip(id, showWord) {
  return new Promise(resolve => {
    let speech;
    let timer;
    let failed = false;
    let closed = false;
    function done() {
      if (closed) return;
      closed = true;
      clearTimeout(timer);
      audio.onended = audio.onerror = null;
      audio.pause();
      if (speech) {
        speech.onend = speech.onerror = null;
        synth?.cancel();
      }
      showWord?.classList.remove('speaking');
      finishClip = null;
      resolve();
    }
    function fallback() {
      if (closed || failed) return;
      failed = true;
      clearTimeout(timer);
      audio.pause();
      const message = clips[id] || (id.startsWith('en_') && words[Number(id.slice(3))]);
      if (!message || !synth || !window.SpeechSynthesisUtterance) return done();
      speech = new SpeechSynthesisUtterance(message);
      speech.lang = id.startsWith('zh_') ? 'zh-CN' : 'en-US';
      speech.rate = .88;
      speech.onend = speech.onerror = done;
      timer = setTimeout(done, 5500);
      try { synth.speak(speech); } catch (_) { done(); }
    }

    showWord?.classList.add('speaking');
    // 先播所选音色，再试默认音色，最后交给系统朗读。录音直接使用 blob 地址。
    const defaultUrl = id.startsWith('blob:') ? id :
      'assets/voice/' + (id.startsWith('zh_') ? 'zh-xiaoxiao/' : 'en-ana/') + id + '.mp3';

      clearTimeout(timer);

        if (!closed && current === attempt) tryNext();

      audio.onended = done;
      audio.onerror = retry;
      audio.src = src;

        if (closed || current !== attempt) return;
        if (error.name === 'NotAllowedError' && !unlocked) return done();
        retry();

    }
    tryNext();
  });
}

function startMic() {
  if (mode !== 'ready' || document.hidden) return;
  if (recordingUrl) URL.revokeObjectURL(recordingUrl);
  recordingUrl = null;

  stopAudio();
  attempts++;
  mode = 'live';
  micVisual('live');
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) return void recordVoice(current);
  let recognition;
  try { recognition = new Recognition(); }
  catch (_) { return void recordVoice(current); }
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 5;
  let closed = false;
  let timer;
  let endTimer;
  let heardSpeech = false;
  function cleanup() {
    if (closed) return false;
    closed = true;
    clearTimeout(timer);
    clearTimeout(endTimer);
    recognition.onresult = recognition.onend = recognition.onerror = recognition.onspeechstart = null;
    try { recognition.abort(); } catch (_) {}
    stopMic = null;
    return true;
  }
  stopMic = cleanup;
  function finish(result) {
    if (!cleanup() || epoch !== current) return;
    if (result === 'error' && attempts < 3) void recordVoice(current);
    else if (result === 'match' || attempts >= 3) void passFollow(result === 'match');
    else void retryFollow(current);

  recognition.onspeechstart = () => { heardSpeech = true; };

      Array.from(result, item => item.transcript));
    if (matchNumber(candidates, n)) finish('match');
    else if (Array.from(event.results).some(result => result.isFinal)) finish('miss');
  };
  const finishWithoutResult = () => finish(heardSpeech ? 'miss' : 'error');
  recognition.onend = finishWithoutResult;
  recognition.onerror = () => finish('error');
  timer = setTimeout(() => {
    try { recognition.stop(); } catch (_) { finishWithoutResult(); }

async function recordVoice(current) {
  if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) return offerDone(current);
  let stream;
  let recorder;
  let interval;
  let timer;
  let permissionTimer;
  let cancelled = false;
  const chunks = [];
  // 切页或超时即清理设备；迟到的权限结果也会关闭麦克风。
  function release() {
    clearTimeout(permissionTimer);
    clearTimeout(timer);
    clearInterval(interval);
    if (recorder) {
      recorder.ondataavailable = recorder.onstop = recorder.onerror = null;
      if (recorder.state !== 'inactive') {
        try { recorder.stop(); } catch (_) {}
      }
    }
    stream?.getTracks().forEach(track => track.stop());
    stopMic = null;
    cancelled = true;
  }
  stopMic = release;
  permissionTimer = setTimeout(() => { release(); offerDone(current); }, 7000);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (cancelled || epoch !== current) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    clearTimeout(permissionTimer);
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    recorder.onerror = () => { release(); offerDone(current); };
    recorder.onstop = async () => {
      release();
      if (epoch !== current) return;
      if (!chunks.length) return offerDone(current);
      recordingUrl = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType }));
      mode = 'playback';
      micVisual('');
      prompt = [phrase(n), 'zh_hear_me', recordingUrl];
      await replayRecording(current);
    };
    recorder.start();
    const ends = performance.now() + 2500;
    micVisual('live', 3);
    interval = setInterval(() => micVisual('live', Math.max(1, Math.ceil((ends - performance.now()) / 1000))), 100);
    timer = setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 2500);
  } catch (_) {
    if (cancelled) return;
    release();
    offerDone(current);
  }
}

// 拖放与两次点按共用校验，手指拖动时用命中位置找目标。
function wirePieces(accept) {
  let selected;
  const targets = [...stage.querySelectorAll('[data-target]')];
  function select(piece) {
    selected?.classList.remove('selected');
    selected?.setAttribute('aria-pressed', 'false');
    selected = piece;
    piece?.classList.add('selected');
    piece?.setAttribute('aria-pressed', 'true');
  }
  function place(piece, target) {
    if (!piece || piece.disabled || busy) return;
    if (accept(piece, target)) {
      piece.disabled = true;
      select(null);
    } else wrong(piece);
  }
  targets.forEach(target => target.onclick = () => place(selected, target));
  stage.querySelectorAll('.piece').forEach(piece => {
    let pointer;
    let moved = false;
    piece.setAttribute('aria-pressed', 'false');
    piece.onclick = event => { if (event.detail === 0) select(piece); };
    piece.onpointerdown = event => {
      if (!event.isPrimary || event.button !== 0 || busy) return;
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
      moved = false;
      piece.setPointerCapture(event.pointerId);
      cancelPieceDrag = () => end(event, true);
    };
    piece.onpointermove = event => {
      if (pointer?.id !== event.pointerId) return;
      const x = event.clientX - pointer.x;
      const y = event.clientY - pointer.y;
      if (!moved && Math.hypot(x, y) < 8) return;
      moved = true;
      Object.assign(piece.style, { position: 'relative', zIndex: 3, pointerEvents: 'none', transform: 'translate(' + x + 'px,' + y + 'px)' });
      const hovered = document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-target]');
      targets.forEach(target => target.classList.toggle('drop-ready', target === hovered));
    };
    function end(event, cancelled = false) {
      if (pointer?.id !== event.pointerId) return;
      const target = moved && !cancelled && document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-target]');
      piece.style.cssText = '';
      targets.forEach(item => item.classList.remove('drop-ready'));
      pointer = null;
      cancelPieceDrag = null;
      if (target) place(piece, target);
      else if (!cancelled && !moved) select(piece);
      else if (!cancelled) wrong(piece);
    }
    piece.onpointerup = end;
    piece.onpointercancel = event => end(event, true);
    piece.onlostpointercapture = event => end(event, true);
  });
}

  draw('<section class="screen lesson">' + heading('🚀 火箭倒数') + '<div class="rocket-stage">' +
    art('rocket.png', '🚀', 'item-hero') + '<div class="countdown">' + range(1, 10).reverse().map(value =>
      '<button data-count="' + value + '">' + value + '</button>').join('') + '</div></div></section>');
  stage.querySelectorAll('[data-count]').forEach(button => button.onclick = () => {
    if (busy) return;
    const value = Number(button.dataset.count);
    if (value !== rocketExpected) return wrong(button, [en(rocketExpected)]);
    button.disabled = true;
    button.textContent = '✓ ' + value;
    rocketExpected--;
    countPending++;
    const queue = countTail;
    countTail = queue.then(async () => {
      if (epoch !== current) return;
      countPending--;
      if (value === 1) {
        $('.rocket-stage .item-hero').classList.add('launch');
        grantMedal('rocket');
        await completeFinal(button, [en(1), 'en_blastoff'], false, standalone);
      } else {
        prompt = [en(rocketExpected || 1)];
        await say([en(value)]);
      }
    });
  });
  maybeSpeak();
}
async function completeFinal(from, sequence = [], automatic = false, standalone = false) {
  if (busy) return;
  busy = true;
  const current = epoch;
  const isNew = !standalone && !deck.length && !save.learned.includes(n);
  const lessonTask = isNew || (!standalone && !deck.length && save.learned.length === 20);
  const flower = awardStep(from, 0, lessonTask ? 'learn' : undefined);
  if (isNew) {
    save = completeLesson(save, n);
    persist();
    checkMedals(automatic);
  }
  effect(['🎉', '✨', '🎊']);
  if (!automatic) await Promise.all([say([...sequence, flower]), wait(mini === 'rocket' ? 1080 : 420)]);
  if (rotationWait) await rotationWait;
  if (current !== epoch) return;
  if (standalone) {
    showHome(true);
    nextReveal();
  } else if (deck.length) {
    nextRound();
    nextReveal();
  } else {
    giveFriend(isNew, automatic);
  }
}
function giveFriend(isNew, automatic) {
  const current = view('sticker', isNew ? ['en_friend', phrase(n)] : ['en_great']);
  draw('<section class="screen"><div class="lesson-heading"><h2 class="lesson-title">' +
    (isNew ? '认识新朋友！' : '做得真棒！') + '</h2></div><div class="celebration">' +
    kid('cheer') + (n <= 10 ? art('card_' + n + '.jpg', animals[n - 1] + ' × ' + n, 'card-art') :
      '<span class="reward">' + save.stickers[n] + '</span>') + '</div></section>');
  const home = () => { if (epoch === current) { showHome(true); nextReveal(); } };
  if (automatic) {
    void wait(450).then(home);
    return;
  }
  $('#lesson-action').innerHTML = '<button id="friend-home" class="next-btn">' + icon('🏝️', '继续玩') + '</button>';
  $('#friend-home').onclick = home;
  if (isNew && n <= 10 && save.unlockedLevel === 2 && save.learned.length === 10) {
    reveals.unshift(() => {
      openModal('十位动物朋友集齐啦！', '<div class="celebration">' + kid('cheer') +
        '<span class="reward">🌈</span></div>');
      effect(['🌟','💖','🎊','✨']);
      void say(['en_friend', 'en_yay']);
    });
  }
  void Promise.all([playPrompt(), wait(800)]).then(() => { if (epoch === current) nextReveal(); });
}
function startReview() {
  deck = reviewDeck(save.learned);
  if (!deck.length) return;
  round = 0;
  n = deck[round];
  showCount();
}
function nextRound() {
  round++;
  if (round < deck.length) {
    n = deck[round];
    showCount();
    return;
  }
  deck = [];
  view('star', ['en_yay']);
  save.reviewStars = Math.min(Number.MAX_SAFE_INTEGER, save.reviewStars + 1);
  persist();
  const dailyReward = rewards.advanceDaily('review');
  draw('<section class="screen"><div class="lesson-heading"><h2 class="lesson-title">复习完成</h2></div><div class="celebration">' + kid('cheer') +
    '<span class="reward" aria-label="大星星">🌟</span></div></section>');
  $('#lesson-action').innerHTML = '<button id="star-home" class="next-btn">' + '<span class="icon park-icon" data-park-art="icon_map.png" aria-hidden="true">🏝️</span><small>数字岛</small>' + '</button>';
  $('#star-home').onclick = () => showHome();
  if (dailyReward) {
    updateBank(true);
    rewards.flyFlower($('.reward'));
    prompt.push('zh_flower');
  }
  effect();
  maybeSpeak();
}
function suspendAudio() {
  if (screen === 'follow' && mode === 'live') {
    stopMic?.();
    attempts = Math.max(0, attempts - 1);
    mode = 'ready';
    micVisual('ready');
  } else stopMic?.();
  stopAudio();
}

$('#flower-icon').innerHTML = art('flower.png', '🌺');
$('#chest').innerHTML = art('chest_closed.png', '🎁') + '<small>宝箱</small>';
hydrate(document.body);
updateBank();
rewards.touchStreak();
checkMedals();
function unlockAudio(event) {
  if (event.target.closest('#voice-settings, .kidvoice-panel')) return;
  // 首次游戏点击在事件内给 iOS 的复用播放器开启声音。
  document.removeEventListener('click', unlockAudio, true);
  unlocked = true;
  void playPrompt();
  if (reveals.length) setTimeout(nextReveal, 150);
}
document.addEventListener('click', unlockAudio, true);
replay.onclick = () => {
  if (busy || mode === 'prompt') return;
  if (mode === 'playback') return void replayRecording(epoch);
  if (mode === 'live') {
    suspendAudio();
    mode = 'teaching';
  }
  if (mode === 'teaching') return void teach(epoch);
  if (countPending) {
    const current = epoch;
    void countTail.then(() => { if (epoch === current && !countPending) return playPrompt(); });
    return;
  }
  if (screen === 'follow') void repeatFollow();
  else void playPrompt();
};
book.onclick = () => { showAlbum(); nextReveal(); };
$('#trophy').onclick = () => { showTrophies(); nextReveal(); };
$('#chest').onclick = openChest;
road.onclick = () => { showHome(); nextReveal(); };
window.addEventListener('pagehide', suspendAudio);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) suspendAudio();
  else {
    rewards.touchStreak();
    checkMedals();
    if (screen === 'home') renderHome();
    if (unlocked) nextReveal();
  }
});
window.addEventListener('storage', event => {
  if (event.key !== (qa ? 'kidRewardsQA' : 'kidRewards')) return;
  updateBank();
  redrawRewards();
});

// 转屏时保留本轮 DOM 和状态，等待孩子点继续再提交异步步骤。
const rotationPause = $('#rotation-pause');
let landscape, resumeRotation;
function fitViewport() {
  const vv = window.visualViewport;
  const width = Math.round(vv?.width || innerWidth);
  const height = Math.round(vv?.height || innerHeight);
  const next = width > height;
  document.documentElement.style.setProperty('--view-height',height + 'px');
  if (landscape !== undefined && next !== landscape && (screen !== 'home' || !$('#reveal').hidden) && !rotationPause.open) {
    rotationWait = new Promise(resolve => { resumeRotation = resolve; });
    cancelPieceDrag?.();
    if (screen === 'follow' && mode === 'teaching') followCue++;
    suspendAudio();
    rotationPause.showModal();
  }
  landscape = next;
}
rotationPause.oncancel = event => event.preventDefault();
$('#rotation-resume').onclick = () => {
  rotationPause.close();
  rotationWait = null;
  resumeRotation();
  if (screen === 'follow' && mode === 'teaching') void teach(epoch);
};
window.addEventListener('resize',fitViewport);
window.visualViewport?.addEventListener('resize',fitViewport);
fitViewport();

showHome(true);
if (qa) $('header a').search = '?qa';
if (qa) window.__englishNumbersQA = {
  startLesson,
  forcePass() {
    if (screen === 'listen') {
      if ($('#next').hidden) awardStep($('.object'));
      showFollow();
    } else if (screen === 'follow') return passFollow(true, true);
    else if (screen === 'find') {
      if (step === 3) return finishMini(stage, [], true);
      return completeFinal(stage, [], true);
    }
  },
  get state() {
    return { screen, mini, n, step, hits, attempts, round, mode, options: [...options], save: normalizeSave(save) };
  }
};
})();
</script>
</body>
