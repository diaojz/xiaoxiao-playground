<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>小猎人大冒险</title>
    <style>
      * {
        box-sizing: border-box;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      body {
        margin: 0;
        overflow: hidden;
        color: #264e44;
        background: #c5e8a5;
        font:
          800 22px system-ui,
          sans-serif;
      }
      /* 横屏侧栏底色：糖果渐变，不留白边（html 单独铺色，body 透明） */
      html {
        min-height: 100%;
        background-color: #bfe8b0;
        background-image: linear-gradient(
          160deg,
          #bfe8b0,
          #a9dfd6 55%,
          #d7c6f0
        );
      }
      body {
        background: transparent !important;
      }
      canvas {
        position: absolute;
        inset: 0;
      }
      button,
      a {
        font: inherit;
        color: inherit;
        cursor: pointer;
        text-decoration: none;
        border: 2px solid #486b58;
        border-radius: 24px;
        background: #fff8dc;
        box-shadow: 0 4px #486b58;
        min-height: 64px;
        min-width: 64px;
        padding: 10px 17px;
        display: inline-grid;
        place-items: center;
      }
      button:active {
        transform: translateY(3px);
      }
      #bar,
      #actions,
      #stats {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 1;
      }
      #bar {
        top: max(14px, env(safe-area-inset-top));
        left: 16px;
      }
      #actions {
        right: 16px;
        top: max(14px, env(safe-area-inset-top));
      }
      #stats {
        bottom: 20px;
        right: 18px;
        background: #fff8dfed;
        border: 2px solid #68876c;
        border-radius: 30px;
        padding: 10px 18px;
      }
      .meters {
        padding: 6px 12px;
        border-radius: 18px;
        background: #fff8dfed;
      }
      .meters div {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      meter {
        width: clamp(68px, 11vw, 155px);
        height: 20px;
        accent-color: #eb7291;
      }
      #shade {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #13463333;
        z-index: 2;
      }
      #shade[hidden] {
        display: none;
      }
      .panel {
        text-align: center;
        width: min(88vw, 540px);
        padding: 28px;
        border: 4px solid #547954;
        border-radius: 38px;
        background: #fff8db;
        box-shadow:
          0 9px #426b5280,
          inset 0 0 0 5px #fffdf0;
      }
      .panel h1 {
        font-size: clamp(32px, 5vmin, 58px);
        margin: 5px 0 20px;
        letter-spacing: -2px;
      }
      .panel img {
        width: 145px;
        height: 145px;
        object-fit: contain;
      }
      .choices {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .primary {
        background: #ffd25d;
      }
      .panel p {
        margin: 8px 0 18px;
      }
      #hint {
        position: absolute;
        bottom: 22px;
        left: 20px;
        background: #fff8dfdd;
        border-radius: 22px;
        padding: 10px 15px;
        pointer-events: none;
      }
      #joy {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: #fff7;
        border: 4px solid #fff9;
        pointer-events: none;
        translate: -50% -50%;
      }
      #joy i {
        position: absolute;
        left: 45px;
        top: 45px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #588f72cc;
      }
      @media (max-width: 600px) {
        #stats {
          bottom: 75px;
        }
        .panel {
          padding: 16px;
        }
        #actions {
          gap: 4px;
        }
        button,
        a {
          padding: 8px;
        }
        #hint {
          font-size: 20px;
        }
      }
      body[data-scene="home"] :is(#bar, #actions, #stats, #hint),
      body[data-scene="settings"] :is(#bar, #actions, #stats, #hint) {
        visibility: hidden;
      }
      body[data-scene="end"] #shade::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(ellipse at 18% 28%, #ffca50 0 4px, transparent 5px),
          radial-gradient(ellipse at 67% 62%, #ff8c9d 0 4px, transparent 5px),
          radial-gradient(ellipse at 85% 9%, #6bd4cf 0 3px, transparent 4px);
        background-size:
          134px 161px,
          173px 143px,
          157px 193px;
        animation: celebrate 4s linear infinite;
      }
      .panel {
        position: relative;
      }
      .panel img {
        filter: drop-shadow(0 5px 1px #9d926444);
      }
      .panel h1 {
        color: #365948;
      }
      .choices button:hover {
        background: #ffebb1;
      }
      @keyframes celebrate {
        to {
          background-position:
            40px 161px,
            -28px 143px,
            23px 193px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #shade::before {
          animation: none !important;
        }
      }
      #mini {
        position: absolute;
        right: 16px;
        top: 94px;
        width: clamp(140px, 16vmin, 180px);
        aspect-ratio: 1;
        padding: 0;
        overflow: hidden;
        background: #fff8df70;
        border: 5px solid var(--zone, #ffbe97);
        box-shadow: 0 3px #795b64;
      }
      #mini canvas,
      #atlas canvas {
        position: static;
        width: 100%;
        height: auto;
        display: block;
      }
      #badge {
        position: absolute;
        bottom: 2px;
        right: 4px;
        font-size: 21px;
      }
      #region {
        position: absolute;
        left: 50%;
        top: 90px;
        transform: translateX(-50%);
        border-radius: 22px;
        background: #fff6da;
        padding: 8px 16px;
        pointer-events: none;
      }
      body:not([data-scene="play"]) :is(#mini, #region) {
        display: none;
      }
      #atlas {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: #23443cbd;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
      }
      #atlas[hidden] {
        display: none;
      }
      #atlasMap {
        padding: 0;
        overflow: hidden;
        width: min(88vw, 72vh, 800px);
        background: #f7eed5;
      }
      @media (orientation: landscape) {
        body[data-scene="play"] {
          background: linear-gradient(145deg, #e1efce, #fff0cf);
        }
        #mini {
          width: 150px;
          right: 16px;
        }
        #stats {
          width: 158px;
          justify-content: center;
          text-align: center;
        }
      }
    </style>
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="小小游乐园"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="stylesheet" href="../app-compat.css"><script defer src="../app-compat.js"></script></head>
  <body>
    <canvas id="world"></canvas>
    <div id="bar">
      <a href="../index.html">‹ 合集</a>
      <div class="meters">
        <div>❤️ <meter id="health"></meter></div>
        <div>⭐ <meter id="experience"></meter></div>
      </div>
    </div>
    <div id="actions">
      <button id="mute" aria-label="静音">🔊</button
      ><button id="pause" aria-label="暂停">Ⅱ</button>
    </div>
    <button id="mini" aria-label="打开大地图">
      <canvas width="180" height="180" id="miniCanvas"></canvas
      ><span id="badge"></span>
    </button>
    <div id="region" hidden role="status"></div>
    <div
      id="atlas"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="探险地图"
    >
      <button id="atlasMap" aria-label="返回冒险">
        <canvas id="atlasCanvas" width="800" height="800"></canvas>
      </button>
      <div id="mapLegend" style="text-align: center; color: white"></div>
      <button id="closeAtlas">✕ 关闭地图</button>
    </div>
    <div id="stats"></div>
    <div id="hint"></div>
    <div id="joy" hidden><i></i></div>
    <div id="shade">
      <section class="panel">
        <div id="portrait"></div>
        <h1 id="title"></h1>
        <p id="detail"></p>
        <div class="choices" id="choices"></div>
      </section>
    </div>
    <script src="motion.js"></script>
    <script src="paint.js"></script>
    <script src="../shared/juice.js"></script>
    <script src="../shared/rewards.js"></script>
    <script src="../shared/voice.js"></script>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        canvas = $("world"),
        c = canvas.getContext("2d"),
        J = KidJuice;
      const qa = new URLSearchParams(location.search).has("qa"),
        key = qa ? "hunterSaveQA" : "hunterSave";
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(key)) || {};
      } catch {}
      const persist = () => {
        try {
          localStorage.setItem(key, JSON.stringify(saved));
        } catch {}
      };
      const kinds = [
        "slime",
        "ghost",
        "cookie",
        "gummy",
        "donut",
        "bee",
        "pudding",
        "snail",
        "armorbear",
        "boss_pudding",
      ];
      const icons = [
        "🟣",
        "👻",
        "🍪",
        "🧸",
        "🍩",
        "🐝",
        "🍮",
        "🐌",
        "🐻",
        "🍮",
      ];
      const A = Hunter.HERO_ANIM,
        heroLayers = {},
        makeCanvas = () => document.createElement("canvas");
      let hero = Hunter.createHero(),
        lastZone = -1,
        regionUntil = 0,
        nextMap = 0;
      const sprites = {},
        names = [
          "hero_idle",
          "hero_attack",
          "hero_dizzy",
          ...kinds.map((k) => "m_" + k),
        ];
      const sheets = {};
      for (const name of ["run", "idle", "attack", "hurt", "cheer", "faint"]) {
        const img = new Image();
        img.onload = () => {
          sheets[name] = img;
        };
        img.src = "assets/frames/" + name + ".png";
      }
      function loadSprite(name, path, size) {
        const img = new Image();
        img.onload = () => {
          const tile = document.createElement("canvas");
          tile.width = tile.height = size;
          const layered = name.startsWith("hero") || name === "kid";
          const k = size / Math.max(img.width, img.height);
          const w = layered ? img.width * k : size,
            h = layered ? img.height * k : size;
          tile.getContext("2d").drawImage(img, (size - w) / 2, size - h, w, h);
          if (layered) heroLayers[name] = sliceHero(tile, makeCanvas);
          sprites[name] = tile;
          const white = document.createElement("canvas");
          white.width = white.height = size;
          const mask = white.getContext("2d");
          mask.drawImage(tile, 0, 0);
          mask.globalCompositeOperation = "source-in";
          mask.fillStyle = "white";
          mask.fillRect(0, 0, size, size);
          sprites[name + "_flash"] = white;
          if (name === "hero_idle")
            heroLayers.hero_idle_flash = sliceHero(white, makeCanvas);
        };
        img.src = path;
      }
      for (const n of names)
        loadSprite(
          n,
          "assets/" + n + ".png",
          n.startsWith("hero") ? A.size : n.includes("boss") ? 220 : 72,
        );
      loadSprite("kid", "../assets/kid/kid_front.png", 116);
      const mobs = new J.Pool(80),
        effects = new J.Pool(96),
        shots = new J.Pool(32),
        drops = new J.Pool(180),
        particles = new J.Pool(300),
        labels = new J.Pool(24),
        grid = new J.Grid();
      const clamp = (n, a, b) => Math.max(a, Math.min(b, n)),
        rand = (a, b) => a + Math.random() * (b - a),
        dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      let W,
        H,
        cam = { x: 1600, y: 1600 },
        p = {},
        state = "home",
        free = false,
        t = 0,
        dizzy = 0,
        spawnClock = 0,
        eliteAt = 90,
        hitClock = 0,
        wandClock = 0,
        swing = 0,
        guard = 0,
        shake = 0,
        freeze = 0,
        glow = 0,
        boss = null,
        warning = null,
        stress = false,
        frames = [],
        slow = 0,
        limit = 300;
      let stick = null,
        goal = null,
        keys = new Set(),
        audio,
        music = new Audio(),
        chain = 0,
        lastPickup = 0;
      function sound(type) {
        if (saved.muted || !audio) return;
        const notes = {
          hit: [180],
          crit: [330, 660],
          pickup: [440 * 1.122 ** (chain % 8)],
          level: [392, 494, 587, 784],
          bowHit: [920, 710],
          bubbleHit: [540, 270, 190],
          shieldHit: [610, 820],
          boltHit: [420, 160],
          combo: [330 * 1.122 ** (p.combo % 9)],
          bow: [720, 960],
          bubble: [360, 510],
          shield: [460, 620],
          bolt: [890, 290],
          chest: [523, 659, 784],
          boss: [160, 120, 95],
        };
        (notes[type] || notes.hit).forEach((freq, i) => {
          const osc = audio.createOscillator(),
            g = audio.createGain(),
            at = audio.currentTime + i * 0.075;
          osc.type = type === "boss" ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, at);
          g.gain.setValueAtTime(0.0001, at);
          g.gain.exponentialRampToValueAtTime(0.08, at + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
          osc.connect(g);
          g.connect(audio.destination);
          osc.start(at);
          osc.stop(at + 0.16);
        });
      }
      function unlock() {
        try {
          audio ||= new AudioContext();
          audio.resume().catch(() => {});
        } catch {}
      }
      function voice(id) {
        if (saved.muted) return;
        music.pause();
        music.src = KidVoice.url(id);
        music.play().catch(() => {
          if (id === "zh_good" && !saved.muted) {
            music.src = KidVoice.url(id, "../color-splash/assets/voice/");
            music.play().catch(() => {});
          }
        });
      }
      function clearInput() {
        stick = null;
        goal = null;
        keys.clear();
        $("joy").hidden = true;
      }
      function panel(mode, title, detail, buttons, face = false) {
        state = mode;
        document.body.dataset.scene = mode;
        clearInput();
        $("shade").hidden = false;
        $("title").textContent = title;
        $("detail").textContent = detail;
        $("choices").replaceChildren();
        $("portrait").replaceChildren();
        if (face) {
          const img = new Image();
          img.onerror = () => {
            img.onerror = null;
            img.src = "../assets/kid/kid_front.png";
          };
          img.src = "assets/hero_idle.png";
          $("portrait").append(img);
        }
        for (const [label, fn, cls] of buttons) {
          const b = document.createElement("button");
          b.className = cls || "";
          b.innerHTML = label;
          b.onclick = () => {
            unlock();
            fn();
          };
          $("choices").append(b);
        }
      }
      function home() {
        panel(
          "home",
          "小猎人大冒险",
          "拖动小猎人，去糖果森林找星星！",
          [
            ["🍭 出发", () => start(false), "primary"],
            ["🌿 自由探索", () => start(true)],
            ["⚙ 设置", () => settings(home)],
            ["‹ 合集", () => location.assign("../index.html")],
          ],
          true,
        );
      }
      function settings(back) {
        panel("settings", "探险设置", "", [
          [
            saved.tap ? "👆 点哪走哪" : "🕹 浮动摇杆",
            () => {
              saved.tap = !saved.tap;
              persist();
              settings(back);
            },
          ],
          [
            saved.soft ? "✨ 柔和特效" : "🌟 完整特效",
            () => {
              saved.soft = !saved.soft;
              persist();
              settings(back);
            },
          ],
          [
            saved.noShake ? "屏幕震动：关" : "屏幕震动：开",
            () => {
              saved.noShake = !saved.noShake;
              persist();
              settings(back);
            },
          ],
          [
            saved.lowContrast ? "高对比拾取物：关" : "高对比拾取物：开",
            () => {
              saved.lowContrast = !saved.lowContrast;
              persist();
              settings(back);
            },
          ],
          ["完成", back, "primary"],
        ]);
      }
      function play() {
        state = "play";
        document.body.dataset.scene = "play";
        $("shade").hidden = true;
      }
      function pause() {
        if (state === "play")
          panel("pause", "营地休息", "", [
            ["▶ 继续", play, "primary"],
            [
              "⚙ 设置",
              () =>
                settings(() => {
                  play();
                  pause();
                }),
            ],
            [
              free && p.count ? "🏕 回营结算" : "🏕 回营地",
              () => (free && p.count ? finish(false) : home()),
            ],
          ]);
      }
      $("pause").onclick = pause;
      $("mute").onclick = () => {
        saved.muted = !saved.muted;
        music.pause();
        persist();
        syncMute();
      };
      function syncMute() {
        $("mute").textContent = saved.muted ? "🔇" : "🔊";
      }
      syncMute();
      let landscape;
      function resize() {
        const w = Math.round(visualViewport?.width || innerWidth),
          h = Math.round(visualViewport?.height || innerHeight);
        if (landscape !== undefined && landscape !== w > h) pause();
        landscape = w > h;
        W = w > h ? w - 184 : w;
        H = h;
        canvas.width = W;
        canvas.height = h;
      }
      resize();
      window.addEventListener("resize", resize);
      window.visualViewport?.addEventListener("resize", resize);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          pause();
          music.pause();
        }
      });
      window.onblur = pause;
      function loot(x, y, type) {
        return drops.take({ x, y, type, age: 0, fly: 0, ox: x, oy: y });
      }
      function start(explore) {
        free = explore;
        eliteAt = 90;
        hero = Hunter.createHero();
        lastZone = -1;
        nextMap = 0;
        t =
          dizzy =
          spawnClock =
          hitClock =
          wandClock =
          swing =
          guard =
          shake =
          freeze =
          glow =
            0;
        boss = warning = null;
        stress = false;
        for (const pool of [mobs, effects, shots, drops, particles, labels])
          pool.clear();
        p = {
          x: 1600,
          y: 1600,
          px: 1600,
          py: 1600,
          hp: 110,
          max: 110,
          level: 1,
          xp: 0,
          count: 0,
          kills: 0,
          choices: 0,
          balls: [],
          choiceAt: 0,
          powers: [0, 0, 0, 0],
          cooldown: [0, 0, 0, 0],
          combo: 0,
          lastHit: -10,
          hammer: 1,
          wand: 0,
          atk: 0,
          speed: A.speed,
          magnet: 120,
        };
        cam = { x: p.x, y: p.y };
        for (let i = 0; i < 65; i++) {
          const a = i * 2.4,
            r = 65 + i * 18;
          loot(
            p.x + r * Math.cos(a),
            p.y + r * Math.sin(a),
            i % 17 === 12 ? "chest" : "star",
          );
        }
        play();
        voice("zh_start");
        hud();
      }
      function spawn(kind, x, y) {
        const angle = rand(0, Math.PI * 2);
        if (x == null) {
          // 从相机可见矩形以外、地图以内的边中选一条。
          const edges = [];
          if (cam.x - W / 2 > 60)
            edges.push([cam.x - W / 2 - 45, cam.y + rand(-H / 2, H / 2)]);
          if (cam.x + W / 2 < 3140)
            edges.push([cam.x + W / 2 + 45, cam.y + rand(-H / 2, H / 2)]);
          if (cam.y - H / 2 > 60)
            edges.push([cam.x + rand(-W / 2, W / 2), cam.y - H / 2 - 45]);
          if (cam.y + H / 2 < 3140)
            edges.push([cam.x + rand(-W / 2, W / 2), cam.y + H / 2 + 45]);
          [x, y] = edges[Math.floor(Math.random() * edges.length)] || [50, 50];
        }
        x = clamp(x, 25, 3175);
        y = clamp(y, 25, 3175);
        const strength = J.m4ae(t, kind === 9 ? 12 : 18, kind === 9 ? 40 : 1),
          a = Math.atan2(p.y - y, p.x - x);
        return mobs.take({
          kind,
          born: null,
          weakUntil: 0,
          x,
          y,
          px: x,
          py: y,
          hp: strength.hp,
          max: strength.hp,
          angle: a,
          phase: angle,
          speed: A.speed * (0.35 + (kind % 6) * 0.045),
          flash: 0,
          kx: 0,
          ky: 0,
          split: 3,
          next: t + 2,
        });
      }
      function enterBoss() {
        if (boss || free) return;
        if (mobs.count() === 80) mobs.items.find((e) => e.on).on = false;
        boss = spawn(
          9,
          clamp(p.x + 180, 130, 3070),
          clamp(p.y - 180, 130, 3070),
        );
        sound("boss");
        shake = 5;
      }
      function burst(x, y, n) {
        J.burst(particles, x, y, n, limit);
      }
      function label(x, y, msg, crit = false) {
        labels.take({ x, y, msg, crit, life: crit ? 0.8 : 0.55 });
      }
      const weaponKeys = ["bow", "bubble", "shield", "bolt"];
      function hit(e, weapon) {
        if (!e.on) return;
        const weak =
          e.kind === 9 &&
          (t < e.weakUntil || weapon === "wand" || p.y < e.y - 25);
        const rank =

      function upgrade() {

        p.level++;
        p.max += 10;
        p.hp = Math.min(p.max, p.hp + 10);

      function finish(win) {

      function hurt(n, source = p) {
        if (guard || dizzy || stress) return;
        p.hp = Math.max(0, p.hp - n);
        guard = 1;
        shake = 3;
        glow = 0.32;
        hero.hurt = A.hurt;

      function movePlayer(dt) {
        let dx =
            Number(keys.has("ArrowRight") || keys.has("d")) -
            Number(keys.has("ArrowLeft") || keys.has("a")),
          dy =
            Number(keys.has("ArrowDown") || keys.has("s")) -
            Number(keys.has("ArrowUp") || keys.has("w"));
        if (stick) {
          dx = stick.dx / 48;
          dy = stick.dy / 48;

        let speed = p.speed;
        if (goal) {
          dx = goal.x - p.x;
          dy = goal.y - p.y;
          speed = Math.min(
            speed,
            Math.sqrt(2 * A.braking * Math.hypot(dx, dy)),
          );
          if (Math.hypot(dx, dy) < 5) {
            goal = null;
            dx = dy = 0;
          }
        }

        if (Math.hypot(hero.vx, hero.vy) > 65 && t >= (p.nextFoot || 0)) {
          p.nextFoot = t + 0.17;
          p.footSign = -(p.footSign || 1);
          effects.take({
            kind: "foot",
            x: p.x + p.footSign * 8,
            y: p.y + 42,
            life: 0.55,
            total: 0.55,
          });
        }
        hero.target = (Math.min(1, Math.hypot(dx, dy)) * speed) / p.speed;
        hero.moving = hero.target > 0.005;
        [hero.vx, hero.vy] = Hunter.velocity(
          hero.vx,
          hero.vy,
          dx,
          dy,
          speed,
          dt,
        );

        p.x = clamp(p.x + hero.vx * dt, 42, 3158);
        p.y = clamp(p.y + hero.vy * dt, 42, 3158);

      function updateMobs(dt) {
        for (const e of mobs.items)
          if (e.on) {
            if (
              e.born === null &&
              Math.abs(e.x - cam.x) < W / 2 + 22 &&
              Math.abs(e.y - cam.y) < H / 2 + 22
            )
              e.born = t;
            e.px = e.x;
            e.py = e.y;
            e.flash = Math.max(0, e.flash - dt);
            if (e.flash > 0.045) continue;
            let a = Math.atan2(p.y - e.y, p.x - e.x),
              speed = e.speed;
            if (e.kind === 0) speed *= 0.7 + 0.5 * Math.sin(t * 7 + e.phase);
            if (e.kind === 1) a += 0.55 * Math.sin(t * 2 + e.phase);
            if (e.kind === 4) {
              a = e.angle;
              if (e.x < 30 || e.x > 3170 || e.y < 30 || e.y > 3170)
                e.angle = Math.atan2(p.y - e.y, p.x - e.x);
            }
            if (e.kind === 5)
              a += Math.min(1.65, 160 / Math.max(1, dist(e, p)));
            if (e === boss) {
              speed = t < e.weakUntil ? 0 : 42;
              if (!warning && t >= e.next)
                warning = { x: p.x, y: p.y, ox: e.x, oy: e.y, left: 1.3 };
              if (warning) {
                speed = 0;
                warning.left -= dt;
                if (warning.left < Hunter.enemyAnim.leap) {
                  const u = Hunter.blend(
                    1 - warning.left / Hunter.enemyAnim.leap,
                    1,
                  );
                  e.x = warning.ox + (warning.x - warning.ox) * u;
                  e.y = warning.oy + (warning.y - warning.oy) * u;
                  e.kx = e.ky = 0;
                }
                if (warning.left <= 0) {
                  e.x = warning.x;
                  e.y = warning.y;
                  if (dist(e, p) < 110) hurt(16, e);
                  warning = null;
                  e.weakUntil = t + 0.8;
                  e.next = t + 3.4;
                  shake = 6;
                  burst(e.x, e.y, 18);
                }
              }
            }
            e.x = clamp(e.x + (Math.cos(a) * speed + e.kx) * dt, 24, 3176);
            e.y = clamp(e.y + (Math.sin(a) * speed + e.ky) * dt, 24, 3176);

      function weapons(dt) {
        hitClock -= dt;

        if (hitClock <= 0) {
          const targets = grid.near(p.x, p.y, 110 + 6 * p.hammer);
          if (targets.length) {
            const first = targets[0];
            p.swingAngle = Math.atan2(first.y - p.y, first.x - p.x);
            p.hammerPending = true;
            swing = A.attack;
            hitClock = 0.73;
          }
        }
        if (p.hammerPending && swing <= A.attack * 0.52) {
          p.hammerPending = false;
          const targets = grid.near(p.x, p.y, 110 + 6 * p.hammer);
          if (targets.length) {
            effects.take({
              kind: "impact",

            wandClock = 0.65;

          if (!p.powers[i] || (p.cooldown[i] -= dt) > 0) continue;
          const center =
            i === 2
              ? { x: p.x + Math.cos(t * 4) * 87, y: p.y + Math.sin(t * 4) * 57 }
              : p;
          const targets = grid
            .near(center.x, center.y, i === 2 ? 52 : 460)
            .filter((e) => e.on)
            .sort((a, b) => dist(p, a) - dist(p, b));
          if (!targets.length) continue;
          const target = targets[0],
            angle = Math.atan2(target.y - p.y, target.x - p.x);
          p.cooldown[i] = Math.max(
            0.36,
            [1.1, 1.4, 0.8, 1.7][i] - 0.08 * p.powers[i],
          );
          sound(["bow", "bubble", "shield", "bolt"][i]);
          if (i < 2)
            shots.take({
              kind: i,
              x: p.x,
              y: p.y,
              vx: Math.cos(angle) * 460,
              vy: Math.sin(angle) * 460,
              life: 1.15,
              seen: new Set(),
            });
          else if (i === 2) {
            for (const enemy of targets) hit(enemy, "shield");
            burst(target.x, target.y, 6);
          } else {
            let from = p,
              to = target;
            const visited = new Set();
            for (let j = 0; to && j < 3; j++) {
              effects.take({
                kind: "bolt",
                x: from.x,
                y: from.y,
                tx: to.x,
                ty: to.y,
                life: 0.18,
                total: 0.18,

              visited.add(to);
              hit(to, "bolt");
              burst(to.x, to.y, 5);
              from = to;
              to = grid
                .near(from.x, from.y, 145)
                .find((e) => e.on && !visited.has(e));

        for (const s of shots.items)
          if (s.on) {
            if (s.kind >= 0) {
              s.x += s.vx * dt;
              s.y += s.vy * dt;
              s.life -= dt;
              for (const target of grid.near(s.x, s.y, 32)) {
                if (!target.on || s.seen.has(target)) continue;
                if (s.kind === 0) {
                  s.seen.add(target);
                  hit(target, "bow");
                  burst(target.x, target.y, 4);
                } else {
                  effects.take({
                    kind: "pop",
                    x: target.x,
                    y: target.y,
                    life: 0.32,
                    total: 0.32,
                  });
                  for (const e of grid.near(target.x, target.y, 90))
                    hit(e, "bubble");
                  burst(target.x, target.y, 16);
                  s.on = false;
                  break;
                }
              }
              if (s.life <= 0) s.on = false;
              continue;
            }
            const e = grid
              .near(s.x, s.y, 500)
              .sort((a, b) => dist(a, s) - dist(b, s))[0];
            s.life -= dt;
            if (state !== "play") return;
            if (!e || s.life < 0) {
              s.on = false;
              continue;
            }
            const target = { x: e.x, y: e.y - (e === boss ? 65 : 0) },
              d = dist(s, target);
            if (d < 16) {

              s.dx = (target.x - s.x) / d;
              s.dy = (target.y - s.y) / d;
              s.x += ((target.x - s.x) / d) * 390 * dt;
              s.y += ((target.y - s.y) / d) * 390 * dt;

      function pickups(dt) {
        for (const d of drops.items)

      function step(dt) {

                  16 + 5 * u,
                );
              c.restore();
            }
            if (fx.kind === "foot") {
              ellipse(
                c,
                fx.x,
                fx.y,
                4,
                2,
                "rgba(109,113,108," + 0.28 * (1 - u) + ")",
              );
              ellipse(
                c,
                fx.x + 5 * u,
                fx.y - 11 * u,
                3 - 2 * u,
                2 - u,
                "rgba(240,221,181," + (1 - u) + ")",
              );
            }
            if (fx.kind === "impact" || fx.kind === "pop") {
              c.save();
              c.globalAlpha = 1 - u;
              c.beginPath();
              c.ellipse(fx.x, fx.y, 8 + u * 58, 6 + u * 27, 0, 0, Math.PI * 2);
              c.lineWidth = 4 * (1 - u) + 1;
              c.strokeStyle = fx.kind === "pop" ? "#85dfff" : "#ffcb77";
              c.stroke();
              for (let i = 0; i < 4; i++) {
                const a = i * 1.57 + 0.5;
                if (fx.kind === "impact")
                  line(
                    c,
                    [
                      [fx.x + Math.cos(a) * 10, fx.y + Math.sin(a) * 5],
                      [
                        fx.x + Math.cos(a + 0.25) * 28,
                        fx.y + Math.sin(a + 0.25) * 13,
                      ],
                      [fx.x + Math.cos(a) * 40, fx.y + Math.sin(a) * 20],
                    ],
                    "#bd9a81",
                    2,
                  );
                star(
                  c,
                  fx.x + Math.cos(a) * u * 48,
                  fx.y + Math.sin(a) * u * 22,
                  5 * (1 - u),
                  "white",
                );
              }
              c.restore();
            }
            if (fx.kind === "bolt")
              line(
                c,
                [
                  [fx.x, fx.y],
                  [(fx.x + fx.tx) / 2 + 8, (fx.y + fx.ty) / 2 - 12],
                  [fx.tx, fx.ty],
                ],
                "#8969ff",
                5,
              );
            if (fx.kind === "merge")
              star(
                c,
                fx.x + (fx.tx - fx.x) * u,
                fx.y + (fx.ty - fx.y) * u,
                10,
                "#fff3a1",
              );
            if (fx.kind === "death") {
              c.save();
              c.translate(fx.x, fx.y - 18 * Math.sin(u * Math.PI));
              c.rotate(u * u * 3);
              c.scale(1 - u * 0.8, 1 - u * 0.8);
              actor(
                "m_" + kinds[fx.mob],
                0,
                0,
                fx.mob === 9 ? 220 : 65,
                icons[fx.mob],
              );
              symbol(c, "🌟🌟", 0, -6, 18);
              c.restore();
            }
          }
        const [action, frame] = Hunter.frame(hero.state, hero.age, hero.phase);
        const sheet = sheets[action];
        if (sheet) {
          const cols = sheet.width / 160;
          ellipse(c, px, py + 42, 31, 7, "#52675d44");
          c.save();
          c.translate(px, py + 48 - hero.pose[1]);
          c.scale(hero.flip, 1);
          c.rotate(hero.lean);
          c.drawImage(
            sheet,
            (frame % cols) * 160,
            Math.floor(frame / cols) * 160,
            160,
            160,
            -A.size / 2,
            -A.size,
            A.size,
            A.size,
          );
          c.restore();
        } else if (heroLayers.hero_idle || heroLayers.kid)
          paintHero(c, hero, heroLayers, px, py, saved.soft);
        else actor("hero_idle", px, py, A.size, "🧢");
        if (swing) {
          const u = 1 - swing / A.attack;
          const a = (p.swingAngle || 0) - 1.5 + Hunter.blend(u, 1) * 2.6;
          c.beginPath();
          c.moveTo(px, py);
          c.arc(px, py, 94, a - 1.2, a);
          c.closePath();
          c.fillStyle = "#ffd79339";
          c.fill();
          c.beginPath();
          c.arc(px, py, 94, a - 2, a);
          c.strokeStyle = "#fff8cbcc";
          c.lineWidth = 12;
          c.stroke();
          symbol(c, "🍭", px + 92 * Math.cos(a), py + 92 * Math.sin(a), 48);
        }
        if (glow > 0.01) {
          c.globalAlpha = glow;
          for (let i = 0; i < 4; i++) {
            ellipse(c, px, py + 38, 50 + i * 8, 12 + i * 3, J.colors[i] + "55");
          }
          const g = c.createLinearGradient(0, py - 160, 0, py + 30);
          g.addColorStop(0, "#fffbe000");
          g.addColorStop(1, "#fff9b8bb");
          c.fillStyle = g;
          c.fillRect(px - 42, py - 160, 84, 190);
          c.globalAlpha = 1;
        }
        if (dizzy) {
          for (let i = 0; i < 3; i++) {
            const a = t * 5 + i * 2.1;
            star(
              c,
              px + 32 * Math.cos(a),
              py - 48 + 8 * Math.sin(a),
              8,
              "#ffe775",
            );
          }
        }
        for (const v of particles.items)
          if (v.on) {
            v.life -= dt;
            if (v.life <= 0 && !stress) {
              v.on = false;
              continue;
            }
            v.x += v.vx * dt;
            v.y += v.vy * dt;
            v.vy += 130 * dt;
            c.drawImage(
              flakes[v.color],
              v.x - v.r,
              v.y - v.r,
              v.r * 2,
              v.r * 2,
            );
          }
        for (const v of labels.items)
          if (v.on) {
            v.life -= dt;
            if (v.life <= 0) {
              v.on = false;
              continue;
            }
            c.save();
            c.globalAlpha = Math.min(1, v.life * 5);
            v.y -= 55 * dt;
            const age = (v.crit ? 0.8 : 0.55) - v.life;
            const bounce = 1 + 0.28 * Math.sin(age * 18) * Math.exp(-age * 7);
            c.font =
              "1000 " +
              Math.round((v.crit ? 45 : 30) * bounce) +
              "px system-ui";
            c.textAlign = "center";
            c.lineWidth = 5;
            c.strokeStyle = "#765347";
            c.strokeText(v.msg, v.x, v.y);
            c.fillStyle = v.crit ? "#ffdf54" : "white";
            c.fillText(v.msg, v.x, v.y);
            if (v.crit)
              for (let i = 0; i < 5; i++)
                star(
                  c,
                  v.x + 38 * Math.cos(i * 1.26),
                  v.y + 27 * Math.sin(i * 1.26),
                  4,
                  "#ffe479",
                );
            c.restore();
          }
        c.restore();
        if (dizzy) {
          c.fillStyle = "#34315330";
          c.fillRect(0, 0, W, H);
        }
      }
      function stressFill() {
        for (const v of particles.items) if (v.on && v.life <= 0) v.on = false;
        // 压测时滚出视口的甜甜圈也要补回，否则实体数会高于实际绘制数。
        for (const e of mobs.items) {
          if (
            e.on &&
            (Math.abs(e.x - cam.x) > W / 2 - 40 ||
              Math.abs(e.y - cam.y) > H / 2 - 40)
          )
            e.on = false;
        }
        while (mobs.count() < J.maxEnemies)
          spawn(
            Math.floor(rand(0, 6)),
            cam.x + rand(-W * 0.39, W * 0.39),
            cam.y + rand(-H * 0.37, H * 0.37),
          );
        J.burst(particles, p.x, p.y, 300 - particles.count(), 300);
      }
      let qaHold = false;
      let last = 0,
        acc = 0;
      function loop(now) {
        const ms = last ? now - last : 16.67;
        last = now;
        if (qaHold) {
          requestAnimationFrame(loop);
          return;
        }
        const dt = Math.min(ms / 1000, 0.08);
        if (state === "play") {
          frames.push(ms);
          if (frames.length > 600) frames.shift();
          slow = ms > 20 ? slow + 1 : Math.max(0, slow - 1);
          limit = slow >= 30 ? 110 : 300;
        }
        if (freeze > 0) {
          freeze--;
          acc = 0;
        } else {
          acc += dt;
          while (acc >= 1 / 60) {
            step(1 / 60);
            acc -= 1 / 60;
          }
        }
        if (stress && state === "play") stressFill();
        render(
          state === "play" ? acc * 60 : 1,
          state === "map" || state === "pause" ? 0 : dt,
        );
        if (state === "play" && now >= nextMap) {
          drawMap(false);
          nextMap = now + 1000 / Hunter.MAP.hz;
        }
        shake = Math.max(0, shake - dt * 16);
        glow = Math.max(0, glow - dt * 1.5);
        requestAnimationFrame(loop);
      }
      if (qa)
        window.__hunterQA = {
          hold(name) {
            if (state !== "play" || hero.state !== name || hero.age < 0.05)
              return false;
            qaHold = true;
            return true;
          },
          release() {
            qaHold = false;
          },
          attack() {
            spawn(0, p.x + 76, p.y);
            hitClock = 0;
          },
          boss() {
            t = 210;
            enterBoss();
          },
          xp(n = Hunter.xp(p.level)) {
            p.xp += n;
            upgrade();
          },
          stress() {
            start(false);
            stress = true;
            p.powers.fill(1);
            p.wand = 1;
            drops.clear();
            stressFill();
            frames = [];
          },
          dizzy() {
            guard = 0;
            hurt(999);
          },
          setTime(seconds) {
            t = seconds;
          },
          stats() {
            return {
              state,
              animation: hero.state,
              t,
              x: p.x,
              y: p.y,
              hp: p.hp,
              dizzy,
              kills: p.kills,
              count: p.count,
              level: p.level,
              balls: p.balls.length,
              free,
              mobs: mobs.count(),
              particles: particles.count(),
              frames: frames.length,
              averageMs:
                frames.reduce((a, b) => a + b, 0) / Math.max(1, frames.length),
              sprites: Object.keys(sprites),
            };
          },
        };
      home();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
