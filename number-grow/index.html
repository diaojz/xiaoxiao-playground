function ranking(){return [{n:player.n,name:'你',face:'🌟'},...ais.map(a=>({n:a.n,name:a.name,face:a.face}))].sort((a,b)=>b.n-a.n)}function finish(win){if(phase!=='running')return;phase='result';boosting=false;if(win){let elapsed=180-time;save.fastest=save.fastest==null?elapsed:Math.min(save.fastest,elapsed);persist()}$('resultKid').src=win?'assets/kid/kid_cheer.png':'assets/kid/kid_sad.png';$('resultKid').alt=win?'小主角举手欢呼':'小主角有点难过';$('resultTitle').textContent=win?'膨胀大王！':'时间到啦！';$('resultText').textContent='你的数字 '+format(player.n)+' · 排名第 '+(ranking().findIndex(a=>a.name==='你')+1)+' 名';$('resultRank').innerHTML=ranking().map((a,i)=>`${i+1}. ${a.face} ${a.name}　${format(a.n)}`).join('<br>');$('result').hidden=false}
function applyItem(item){switch(item.type){case'magnet':player.magnet=5;break;case'shield':player.shield=5;break;case'sprint':player.sprint=5;break;default:grow(effect(player.n,item.type,item.value))}sound('item');showToast({magnet:'🧲 磁铁吸吸吸！',shield:'🛡 护盾保护你！',sprint:'⚡ 冲刺更快啦！',double:'×2 数字翻倍！',plus:'数字增加啦！',half:'数字减半啦',minus:'数字减少啦'}[item.type])}
function update(dt){time-=dt;if(time<=0){time=0;finish(false);return}feverLeft=Math.max(0,feverLeft-dt);player.inv=Math.max(0,player.inv-dt);player.shield=Math.max(0,player.shield-dt);player.magnet=Math.max(0,player.magnet-dt);player.sprint=Math.max(0,(player.sprint||0)-dt);player.pop=Math.max(0,player.pop-dt);let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(pointer){dx=pointer.dx;dy=pointer.dy}let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}let fast=boosting||keys.shift;if(fast&&player.n>16)player.n=Math.max(16,player.n*Math.pow(.95,dt));let v=speed(player.n)*(fast?1.65:1)*(player.sprint>0?1.25:1);player.x=clamp(player.x+dx*v*dt+player.vx*dt,30,world-30);player.y=clamp(player.y+dy*v*dt+player.vy*dt,30,world-30);player.vx*=Math.exp(-5*dt);player.vy*=Math.exp(-5*dt);
for(let a of ais){a.pop=Math.max(0,a.pop-dt);a.turn-=dt;if(a.turn<=0){a.angle+=rand(-1.6,1.6);a.turn=rand(.5,2)}a.think=(a.think||0)-dt;if(a.think<=0){a.think=.25;let nearest=null,best=90000;for(const b of ais){if(b===a)continue;const dx=b.x-a.x,dy=b.y-a.y,d=dx*dx+dy*dy;if(d<best){best=d;nearest=b}}const dx=player.x-a.x,dy=player.y-a.y;if(dx*dx+dy*dy<best)nearest=player;a.near=nearest}let near=a.near;if(near&&near!==player&&!ais.includes(near))near=null;let ax=Math.cos(a.angle),ay=Math.sin(a.angle);if(near){let dist=Math.hypot(near.x-a.x,near.y-a.y)||1,sign=near.n>a.n?-1:(a.kind===1&&canEat(a.n,near.n)?1:0);if(a.kind===0&&near.n>a.n)sign=-1;if(sign){ax=(near.x-a.x)/dist*sign;ay=(near.y-a.y)/dist*sign}}a.x=clamp(a.x+ax*speed(a.n)*.58*dt,25,world-25);a.y=clamp(a.y+ay*speed(a.n)*.58*dt,25,world-25);if(player.magnet>0&&a.n<player.n){let dist=Math.hypot(player.x-a.x,player.y-a.y);if(dist<240&&dist>1){a.x+=(player.x-a.x)/dist*130*dt;a.y+=(player.y-a.y)/dist*130*dt}}}
for(let i=ais.length-1;i>=0;i--){let a=ais[i],dist=Math.hypot(a.x-player.x,a.y-player.y);if(dist<(radius(a.n)+radius(player.n))*.72&&player.inv<=0){if(canEat(player.n,a.n)){eatSnack(a.n,2);respawns.push({id:a.id,t:1});ais.splice(i,1);if(phase!=='running')return}else if(!player.shield){player.n=eaten(player.n);player.inv=2;let d=dist||1;player.vx=(player.x-a.x)/d*280;player.vy=(player.y-a.y)/d*280;showToast('数字变小啦，继续吃回来！');burst(player.x,player.y,'#ff9da7');sound('bad')}else{player.inv=.5;player.vx=(player.x-a.x)/(dist||1)*180;player.vy=(player.y-a.y)/(dist||1)*180}}}
for(let i=ais.length-1;i>=0;i--){let a=ais[i];for(let j=i-1;j>=0;j--){let b=ais[j];if(Math.hypot(a.x-b.x,a.y-b.y)<(radius(a.n)+radius(b.n))*.65){let winner=a.n>=b.n?a:b,loser=winner===a?i:j;winner.n+=ais[loser].n;winner.pop=.3;respawns.push({id:ais[loser].id,t:1});ais.splice(loser,1);break}}}for(let i=respawns.length-1;i>=0;i--)if((respawns[i].t-=dt)<=0){ais.push(spawn(respawns[i].id));respawns.splice(i,1)}
for(let i=dots.length-1;i>=0;i--){let d=dots[i],dist=Math.hypot(d.x-player.x,d.y-player.y);if((player.magnet>0||feverLeft>0)&&dist<230&&dist>1){d.x+=(player.x-d.x)/dist*200*dt;d.y+=(player.y-d.y)/dist*200*dt}if(dist<radius(player.n)+5){dots.splice(i,1);eatSnack(1);if(phase!=='running')return}}for(let i=items.length-1;i>=0;i--)if(Math.hypot(items[i].x-player.x,items[i].y-player.y)<radius(player.n)+15){applyItem(items[i]);items.splice(i,1);if(phase!=='running')return}updateGift(dt);fill();for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let f of floats){f.y-=45*dt;f.life-=dt}floats=floats.filter(f=>f.life>0);if(toastTime>0&&(toastTime-=dt)<=0)$('toast').hidden=true;zoom+=(clamp(1.1-radius(player.n)/150,.52,.9)-zoom)*Math.min(1,dt*2);updateFeverHud();updateHud()}
let hudKey='';function updateHud(){const key=Math.floor(player.n)+'/'+Math.floor(time)+'/'+ais.map(a=>a.id+':'+Math.floor(a.n)).join(',');if(key===hudKey)return;hudKey=key;$('number').textContent=format(player.n);$('timer').textContent=Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0');let goal=marks.find(x=>x>player.n)||2048,prev=goal/2;$('goal').textContent='目标 '+goal;$('progress').style.width=clamp((player.n-prev)/(goal-prev)*100,0,100)+'%';$('rank').innerHTML='<b>🏆 排行榜</b><br>'+ranking().slice(0,4).map((a,i)=>`${i+1} ${a.face} ${a.name} ${format(a.n)}`).join('<br>')}
function render(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#c7eee5';ctx.fillRect(0,0,w,h);if(!player)return;ctx.save();ctx.translate(w/2,h/2);const displayZoom=zoom*clamp(h/680,1,1.35);ctx.scale(displayZoom,displayZoom);ctx.translate(-player.x,-player.y);ctx.fillStyle='#dff6eb';ctx.fillRect(0,0,world,world);ctx.strokeStyle='#bde8dc';ctx.lineWidth=2;for(let i=0;i<=world;i+=100){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,world);ctx.moveTo(0,i);ctx.lineTo(world,i);ctx.stroke()}ctx.strokeStyle='#94d7c6';ctx.lineWidth=12;ctx.strokeRect(0,0,world,world);for(let d of dots){ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(d.x,d.y,5,0,7);ctx.fill()}const icons={magnet:'🧲',shield:'🛡',sprint:'⚡',double:'×2',plus:'+',half:'÷2',minus:'−'};for(let it of items){ctx.fillStyle=it.type==='half'||it.type==='minus'?'#ff9da2':'#fff4a7';ctx.beginPath();ctx.roundRect(it.x-17,it.y-17,34,34,10);ctx.fill();ctx.fillStyle='#945461';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icons[it.type],it.x,it.y)}
function ball(b,isPlayer){let r=radius(b.n)*(1+(b.pop||0)*.35),danger=!isPlayer&&b.n>player.n,color=isPlayer?'#75b8f2':danger?'#fa8d96':b.n===Math.floor(player.n)?'#ffdc73':'#87d8a5';let shake=danger&&Math.hypot(b.x-player.x,b.y-player.y)<230?Math.sin(performance.now()/40)*2:0;ctx.save();ctx.translate(b.x+shake,b.y);if(isPlayer&&b.inv>0&&Math.floor(b.inv*8)%2)ctx.globalAlpha=.45;ctx.shadowColor=color;ctx.shadowBlur=0;ctx.fillStyle=color;ctx.strokeStyle=isPlayer?'#fff':danger?'#ed6675':b.n===Math.floor(player.n)?'#e8b744':'#52bc7c';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ffffff80';ctx.beginPath();ctx.ellipse(-r*.28,-r*.4,r*.28,r*.13,-.4,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${Math.max(16,Math.min(30,r*.7))}px sans-serif`;ctx.fillText(format(b.n),0,1);ctx.font='14px sans-serif';if(isPlayer&&kidAvatar.naturalWidth)drawKidAvatar(r);else ctx.fillText(isPlayer?'🌟':b.face,0,-r-13);if(isPlayer&&b.shield>0){ctx.strokeStyle='#fff9';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,r+8,0,7);ctx.stroke()}ctx.restore()}for(let a of ais)ball(a,false);ball(player,true);drawRewards();for(let p of particles){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillStyle='#f48f66';for(let f of floats)ctx.fillText(f.text,f.x,f.y);ctx.restore()}
function loop(now){if(!(phase==='running')||document.hidden)return;if(now-last<33){scheduleFrame();return}const perfStart=performance.now();let dt=Math.min(.05,(now-(last||now))/1000);last=now;if(phase==='running')update(dt);render();perfFrame(perfStart,particles.length+floats.length);if(phase==='running'&&!document.hidden)scheduleFrame()}
canvas.addEventListener('pointerdown',e=>{if(phase!=='running'||pointer)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};canvas.setPointerCapture(e.pointerId);$('joy').hidden=false;$('joy').style.left=(e.clientX-45)+'px';$('joy').style.top=(e.clientY-45)+'px'});canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;let x=e.clientX-pointer.x,y=e.clientY-pointer.y,dist=Math.hypot(x,y),scale=Math.min(1,dist/45)/(dist||1);pointer.dx=x*scale;pointer.dy=y*scale;$('joy').firstElementChild.style.transform=`translate(${pointer.dx*28}px,${pointer.dy*28}px)`});function endPointer(e){if(pointer&&e.pointerId===pointer.id){pointer=null;$('joy').hidden=true}}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);$('boost').addEventListener('pointerdown',e=>{e.preventDefault();boosting=true;$('boost').setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])$('boost').addEventListener(ev,()=>boosting=false);addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','shift','w','a','s','d'].includes(k)){e.preventDefault();keys[k]=true}if(k==='m'&&!e.repeat)$('mute').click();if(k==='escape')phase==='running'?pause():resume()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('record').textContent='最高数字 '+format(save.best)+' · 玩过 '+save.plays+' 局';

if(qa)window.__numberGrowQA={start,get player(){return player},get ais(){return ais},get phase(){return phase},step:update,spawnAt(n,x=0,y=0){ais.push({...spawn(99),x:player.x+x,y:player.y+y,n})},clear(){ais=[];dots=[];items=[]},grow,finish};
