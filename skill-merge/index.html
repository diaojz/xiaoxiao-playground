<script>
(() => {
'use strict';
// 合成、关卡、碰撞和存档均为无 DOM 的纯逻辑，Node 与浏览器共用同一份规则。
const KINDS=['fire','ice','thunder','wind','heal'];
const META={fire:{name:'火球',color:'#ffad51'},ice:{name:'冰晶',color:'#6ad9ee'},thunder:{name:'闪电',color:'#f5ce52'},wind:{name:'旋风',color:'#b198e4'},heal:{name:'治愈',color:'#68cc9a'}};
const MAX_LEVEL=4,MAX_SLOTS=7;
const SKIN_PRICES=[0,50,100,160,240,340],SKIN_NAMES=['红盘扣衫','蓝熊装','小黄鸭','小恐龙','小狐狸','独角兽'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Number.isFinite(v)?v:a));
const levelNumber=n=>Math.floor(clamp(Number(n)||1,1,1000000));
const mass=g=>2**(g.level-1);
const gem=g=>g&&KINDS.includes(g.kind)?{kind:g.kind,level:Math.floor(clamp(Number(g.level)||1,1,MAX_LEVEL))}:null;
function addGem(current,incoming,capacity=5){
  capacity=Math.floor(clamp(capacity,5,MAX_SLOTS));
  const slots=current.map(gem).filter(Boolean),item=gem(incoming),merged=[],recycled=[];
  if(item)slots.push(item);
  // 先把所有可合成的对子合完，即使满栏也先允许新宝石参与合成。
  let changed=true;
  while(changed){changed=false;
    outer:for(let i=0;i<slots.length;i++)for(let j=i+1;j<slots.length;j++){
      if(slots[i].kind===slots[j].kind&&slots[i].level===slots[j].level&&slots[i].level<MAX_LEVEL){
        slots[i]={kind:slots[i].kind,level:slots[i].level+1};slots.splice(j,1);merged.push({...slots[i],index:i});changed=true;break outer;
      }
    }
  }
  // 满栏只回收最低级；全部同级时回收最早的一颗。回收能量逐颗折成金币。
  while(slots.length>capacity){let index=0;slots.forEach((g,i)=>{if(g.level<slots[index].level)index=i;});recycled.push(slots.splice(index,1)[0]);}
  return{slots,merged,recycled,coins:recycled.reduce((n,g)=>n+mass(g),0)};
}
function combinations(slots){
  const found=[];
  for(let i=0;i<slots.length-1;i++){
    const a=slots[i],b=slots[i+1],pair=[a.kind,b.kind].sort().join('+');
    const kind=pair==='fire+ice'?'steam':pair==='thunder+wind'?'storm':null;
    if(kind)found.push({kind,level:Math.max(a.level,b.level),index:i});
  }return found;
}
function buySkin(coins,owned,index){
  coins=Math.floor(clamp(coins,0,99999999));
  if(!Number.isInteger(index)||index<0||index>=SKIN_PRICES.length)return{ok:false,coins,owned:[...owned]};
  if(owned.includes(index))return{ok:true,coins,owned:[...owned],selected:index};
  if(coins<SKIN_PRICES[index])return{ok:false,coins,owned:[...owned]};
  return{ok:true,coins:coins-SKIN_PRICES[index],owned:[...owned,index],selected:index};
}
function readSave(raw){
  let v={};try{v=JSON.parse(raw)||{};}catch(_){}
  const owned=[...new Set([0,...(Array.isArray(v.owned)?v.owned:[]).filter(x=>Number.isInteger(x)&&x>=0&&x<6)])];
  const selected=owned.includes(v.selected)?v.selected:0,stars={};
  if(v.stars&&typeof v.stars==='object')for(const [k,s]of Object.entries(v.stars).slice(-2000)){if(/^\d+$/.test(k)&&Number(k)>0)stars[k]=Math.floor(clamp(Number(s),0,3));}
  return{level:levelNumber(v.level),coins:Math.floor(clamp(Number(v.coins)||0,0,99999999)),owned,selected,stars};
}
// 十二关分别编排技能路线、门、泉水和怪物；十二关后复用章节并缓慢加难，有封顶。
const CHAPTERS=[
  {name:'宝石初见',theme:0,skills:['fire','fire','ice','fire','fire','heal'],lanes:[0,0,0,0,0,0],monsters:['slime','devil'],gates:['speed','heart']},
  {name:'冰火好朋友',theme:0,skills:['ice','ice','fire','ice','fire','heal'],lanes:[0,-.55,0,.55,0,0],monsters:['devil','slime','pirate'],gates:['heart','speed']},
  {name:'风暴来啦',theme:0,skills:['thunder','wind','thunder','wind','fire','heal'],lanes:[0,0,-.55,.55,0,0],monsters:['robot','pirate','slime'],gates:['slot','speed']},
  {name:'泉水花园',theme:1,skills:['heal','fire','fire','ice','ice','wind'],lanes:[0,0,.55,0,-.55,0],monsters:['devil','robot','pirate'],gates:['speed','heart']},
  {name:'史莱姆国王',theme:1,skills:['fire','fire','ice','fire','thunder','wind'],lanes:[0,0,0,.55,-.55,0],monsters:['slime','slime','devil'],gates:['heart','slot']},
  {name:'海盗的宝箱',theme:1,skills:['ice','fire','ice','fire','heal','thunder'],lanes:[0,-.55,0,.55,0,0],monsters:['pirate','pirate','robot'],gates:['speed','slot']},
  {name:'闪电游乐场',theme:2,skills:['thunder','thunder','wind','thunder','wind','heal'],lanes:[0,0,.55,0,-.55,0],monsters:['robot','devil','robot'],gates:['slot','heart']},
  {name:'彩虹魔法桥',theme:2,skills:['fire','ice','wind','thunder','fire','ice'],lanes:[0,0,-.55,.55,0,0],monsters:['slime','pirate','devil'],gates:['heart','speed']},
  {name:'旋风小旅行',theme:2,skills:['wind','wind','thunder','fire','ice','heal'],lanes:[0,.55,0,-.55,0,0],monsters:['devil','robot','pirate'],gates:['speed','slot']},

function containPicture(name,x,y,w,h,alpha=1){const im=assets[name],ratio=im?im.width/im.height:1;let dw=w,dh=w/ratio;if(dh>h){dh=h;dw=h*ratio;}picture(name,x+(w-dw)/2,y+(h-dh)/2,dw,dh,alpha);}
function drawRoad(){

}

function drawPlayer(){
  const p=playerBox(run.x,view),moving=run.phase==='running'||run.phase==='paused'&&pausedPhase==='running';

function drawShots(){

function ageEffects(dt){
  particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=85*dt;}
  bursts=bursts.filter(b=>b.life>0).slice(-20);for(const b of bursts)b.life-=dt;
  floats=floats.filter(f=>f.life>0);for(const f of floats){f.life-=dt;f.y-=24*dt;}
  links=links.filter(l=>l.life>0);for(const l of links)l.life-=dt;
}

  for(const b of bursts){const size=b.size*(1.25-b.life/b.total*.4);containPicture(b.name,b.x-size/2,b.y-size/2,size,size,clamp(b.life/.15,0,1)*.8);}
  for(const f of floats){ctx.globalAlpha=clamp(f.life/.2,0,1);label(f.value,f.x,f.y,18,f.color);}ctx.globalAlpha=1;
  for(const l of links){if(!l.points.length)continue;ctx.save();ctx.strokeStyle='#fff7b4';ctx.shadowColor='#aa96ee';ctx.shadowBlur=7;ctx.lineWidth=4;ctx.beginPath();const from=playerBox(run.x,view);ctx.moveTo(from.x,from.top);for(const p of l.points){ctx.lineTo(p.x-10,p.y-p.height/2+8);ctx.lineTo(p.x+7,p.y-p.height/2-6);ctx.lineTo(p.x,p.y-p.height/2);}ctx.stroke();ctx.restore();}
}
function draw(dt){
  if(!ctx)return;ctx.save();if(run.hurt>1.05){ctx.translate(Math.sin(time*80)*2,Math.cos(time*60));}
  drawRoad();drawWarning();if(run.phase!=='ready'){if(run.phase==='running'||run.phase==='paused'&&pausedPhase==='running')drawRows();[...run.enemies].sort((a,b)=>b.z-a.z).forEach(drawEnemy);drawShots();drawPlayer();drawEffects(dt);}ctx.restore();
}
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-(last||now))/1000));last=now;
  const active=!document.hidden&&!frozen&&['running','battle'].includes(run.phase);
  if(active){time+=dt;advance(run,dt);handleEvents();updateHUD();announcementLife-=dt;if(announcementLife<=0)$('announcement').classList.remove('show');
    if(bgmFailed&&!muted){fallbackBeat+=dt;const beat=Math.floor(fallbackBeat*2);if(beat!==lastBeat){lastBeat=beat;tone([523,659,784,659,587,659,880,784][beat%8],0,.24,.012);}}
  }
  if(loaded&&!document.hidden&&run.phase!=='ready')draw(active?dt:['won','lost'].includes(run.phase)?dt:0);requestAnimationFrame(frame);
}
// 截图入口仅在显式 ?qa 时暴露，使用独立存档，不影响孩子真实进度。
if(qa)globalThis.__skillMergeQA={api:API,
  get state(){return run;},get save(){return save;},get metrics(){return{view,player:playerBox(run.x,view),dpr:canvas.width/(480*view.scale),images:Object.keys(assets).length,failed:IMAGE_NAMES.filter(n=>!assets[n]),audio:Object.keys(audioFiles).length,audioFallback:bgmFailed,audioState:audioContext?audioContext.state:'none',toneCount,runFrame:runFrame(run.runClock,runPhase(0,run.level.number),run.runSpeed),runSheets:IMAGE_NAMES.filter(n=>n.startsWith('run/')).filter(n=>assets[n]).length};},
  start,pause,resume,home,setSkin(index){save.selected=clamp(index,0,5);},freeze(value=true){frozen=value;},
  step(seconds){for(let t=0;t<seconds&&['running','battle'].includes(run.phase);t+=.05){advance(run,Math.min(.05,seconds-t));time+=.05;handleEvents();ageEffects(.05);announcementLife-=.05;if(announcementLife<=0)$('announcement').classList.remove('show');}updateHUD();draw(0);},
  scene(name){start(name==='boss'||name==='warning'?5:1);frozen=true;run.z=560;run.slots=[{kind:'fire',level:3},{kind:'ice',level:2},{kind:'thunder',level:2},{kind:'wind',level:2},{kind:'heal',level:1}];run.merges=5;run.coins=24;slotSignature='';run.level.rows=run.level.rows.filter(r=>r.z>run.z);
    if(name==='gate')run.z=590;
    if(name==='combat'||name==='seven'){run.z=1400;run.enemies=[];run.level.rows=run.level.rows.filter(r=>r.z>run.z);run.cooldowns=[0,.08,.16,.24,0];if(name==='seven')run.capacity=7;spawnEnemy(run,{kind:'robot',x:-.45,z:1650,hp:45});spawnEnemy(run,{kind:'pirate',x:.5,z:1880,hp:45});for(let i=0;i<3;i++)advance(run,.05);}
    if(name==='boss'||name==='warning'||name==='won'||name==='lost'){run.phase='battle';run.z=run.level.finish;run.enemies=[];spawnEnemy(run,{kind:run.level.bossKind,x:0,z:run.z+420,hp:195},true);if(name==='warning'){run.warning={lane:0,time:1.4,total:1.9};$('hint').querySelector('span').textContent='左右拖，离开红色区域！';}}
    if(name==='merge'){collect(run,{kind:'heal',level:1});run.slow=.38;}
    if(name==='steam'||name==='storm'){run.phase='battle';run.z=run.level.finish;run.enemies=[];run.slots=(name==='steam'?['fire','ice']:['thunder','wind']).map(kind=>({kind,level:3}));run.cooldowns=[1,1];run.comboCooldown=0;spawnEnemy(run,{kind:'slime',x:0,z:run.z+420,hp:220},true);spawnEnemy(run,{kind:'robot',x:-.6,z:run.z+380,hp:200});spawnEnemy(run,{kind:'pirate',x:.6,z:run.z+435,hp:200});for(let i=0;i<9;i++)advance(run,.05);$('hint').querySelector('span').textContent='组合技自动释放，左右拖动躲攻击！';}
    if(name==='won'){run.phase='won';run.hp=5;showResult(true);}if(name==='lost'){run.hp=1;run.hurt=0;hurt(run);}
    handleEvents();updateHUD();draw(0);return this.metrics;
  },
  grantCoins(n){save.coins=Math.floor(clamp(n,0,99999999));persist();renderSkins();},
  fail(){run.hp=1;run.hurt=0;hurt(run);handleEvents();updateHUD();draw(0);}
};
if(missing)document.querySelectorAll('img').forEach(img=>{img.src='assets/missing/'+img.src.split('/').pop();});
resize();renderSkins();syncMute();preload().then(()=>{
  // 验收场景可直接通过本地 URL 打开，浏览器工具无需执行写操作脚本。
  if(qa&&qaParams.has('scene')){const scene=qaParams.get('scene');if(scene==='natural'){start(Number(qaParams.get('level'))||1);globalThis.__skillMergeQA.freeze();globalThis.__skillMergeQA.step(clamp(Number(qaParams.get('seconds'))||5,0,150));}else if(scene!=='start')globalThis.__skillMergeQA.scene(scene);}
  if(!assets.hero_poster){$('home').style.backgroundImage="linear-gradient(#c5eff4aa,#c5eff4aa),url('assets/kid_front.png')";$('home').style.backgroundSize='cover,auto 50%';}});requestAnimationFrame(frame);
})();
</script>
