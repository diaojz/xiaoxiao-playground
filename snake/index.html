  function foodTarget() { return 10 + snakes.length * 4; }
  // 场上食物硬顶：撞死长蛇会一次性掉一整排牛油果，若不设顶会越堆越多，
  // 把正常刷新的水果/动物/甜品/硬核大餐都挤没了，画面变成清一色牛油果
  function foodCap() { return foodTarget() + 10; }

  function spawnOneFood() {
    let pos, tries = 0;
    do {
      pos = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
      tries++;
    } while (occupied(pos.x, pos.y) && tries < 200);
    const kind = pickWeightedKind();
    foods.push({ ...pos, ...kind });
  }

  function refillFoods() {
    while (foods.length < foodTarget()) spawnOneFood();
  }

  // 找一块没蛇没食物、且离边界留出安全余量的格子，给新出生的蛇用
  function findSafeSpawnCell() {
    let pos, tries = 0;
    const mx = Math.max(1, COLS - 4), my = Math.max(1, ROWS - 4);
    do {
      pos = { x: 2 + ((Math.random() * mx) | 0), y: 2 + ((Math.random() * my) | 0) };
      tries++;
    } while (occupied(pos.x, pos.y) && tries < 200);
    return pos;
  }

  // 从整个 AI_POOL 里随机抽一个新对手，出生即是长度 3 的小蛇
  function spawnOpponent() {
    const profile = AI_POOL[(Math.random() * AI_POOL.length) | 0];
    const pos = findSafeSpawnCell();
    const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
    const dir = dirs[(Math.random() * dirs.length) | 0];
    const body = [
      { x: pos.x, y: pos.y },
      { x: pos.x - dir.x, y: pos.y - dir.y },
      { x: pos.x - 2 * dir.x, y: pos.y - 2 * dir.y },
    ];
    snakes.push({
      isPlayer: false,
      name: profile.name,
      color: profile.color,
      headColor: profile.headColor,
      strategy: profile.strategy,
      auto: true,
      body,
      prevBody: body.map(s => ({ ...s })),
      contents: body.map(() => null),
      ammo: [],
      lastShotAt: -Infinity,
      dir: { ...dir },
      nextDir: { ...dir },
      score: 0,
      grow: 0,
      targetFood: null,
      wigSeed: Math.random() * 10,
    });
  }

  // 死掉的蛇原地按自身长度变成一排牛油果，供其他蛇捡漏；
  // 但要遵守场上食物硬顶，超出的部分不掉，等牛油果被吃掉腾出空间后，
  // 正常的加权随机刷新才会把水果/动物/甜品等其他品类重新补回来
  function dropAvocados(snake) {
    let room = foodCap() - foods.length;
    for (let i = 0; i < snake.body.length && room > 0; i++, room--) {
      const seg = snake.body[i];
      foods.push({ x: seg.x, y: seg.y, ...AVOCADO_KIND });
    }
  }

  // 把撞死/爆头的对手从场上移除后排到这里，稍等一会儿就补一条，始终保持 2 位对手在场。
  function killOpponent(index) {
    const foe=snakes[index];
    if(foe && !foe.isPlayer){ gainExp(8,'打败小伙伴'); showKillFeedback(foe.body[0]); }
    dropAvocados(foe);
    snakes.splice(index, 1);
    pendingRespawns.push(performance.now() + RESPAWN_MIN_MS + Math.random() * (RESPAWN_MAX_MS - RESPAWN_MIN_MS));
  }

  function processRespawns(now) {
    for (let i = pendingRespawns.length - 1; i >= 0; i--) {
      if (now >= pendingRespawns[i]) {
        pendingRespawns.splice(i, 1);
        spawnOpponent();
      }
    }
  }

  function reset(carry=null) {
    foods = [];
    bullets = [];
    pendingRespawns = [];
    if(!carry){ skillEnds = {}; skillCooldowns = {}; } combo = 0; killTexts.length = 0; killParticles.length = 0; skillTrailParticles.length = 0;
    const starts = [
      { x: Math.floor(COLS * 0.5),  y: Math.floor(ROWS * 0.5),  dir: { x: 1, y: 0 } },
      { x: Math.floor(COLS * 0.15), y: Math.floor(ROWS * 0.15), dir: { x: 1, y: 0 } },
      { x: Math.floor(COLS * 0.85), y: Math.floor(ROWS * 0.85), dir: { x: -1, y: 0 } },
    ];
    // 无尽模式永远不放障碍，保留空数组只让旧的碰撞和寻路分支自然跳过。
    obstacles = [];
    const defs = [
      { isPlayer: true, name: '你', color: '#2e8b57', headColor: '#1f6b41', strategy: 'nearest', auto: false },
      ...AI_POOL.slice(0, 2).map(p => ({ isPlayer: false, name: p.name, color: p.color, headColor: p.headColor, strategy: p.strategy, auto: true })),
    ];
    snakes = defs.map((def, i) => {
      const pos = starts[i];
      const dx = pos.dir.x, dy = pos.dir.y;
      // 玩家开局 5 节（比 AI 多 2 节），AI 保持 3 节
      const savedRun = def.isPlayer && carry && Array.isArray(carry.body) && carry.body.length;
      const len = savedRun ? Math.min(MAX_BODY_LEN, Math.max(5, carry.body.length)) : (def.isPlayer ? 5 : 3);
      const body = savedRun ? Array.from({length:len},(_,k)=>({x:Math.max(1,Math.min(COLS-2,pos.x-k*dx)),y:Math.max(1,Math.min(ROWS-2,pos.y-k*dy))})) : Array.from({ length: len }, (_, k) => ({ x: pos.x - k * dx, y: pos.y - k * dy }));
      return {
        ...def,
        body,
        prevBody: body.map(s => ({ ...s })),
        contents: body.map(() => null), // 保留身体对齐数据，不再存食物或参与渲染
        ammo: savedRun ? [...(carry.ammo||[])] : [],
        lastShotAt: -Infinity,
        dir: savedRun && carry.dir ? {...carry.dir} : { x: dx, y: dy },
        nextDir: savedRun && carry.nextDir ? {...carry.nextDir} : { x: dx, y: dy },
        score: savedRun ? carry.score||0 : 0,
        grow: savedRun ? carry.grow||0 : 0,
        targetFood: null,
        wigSeed: Math.random() * 10,
      };
    });
    refillFoods();
    if(carry && Array.isArray(carry.body) && carry.body.length) {
      const now=performance.now();skillEnds={};skillCooldowns={};
      for(const skill of SKILL_DEFS){skillEnds[skill.id]=restoreDeadline(carry.skillEnds?.[skill.id],carry.clockAt,now,skill.duration);skillCooldowns[skill.id]=restoreDeadline(carry.skillCooldowns?.[skill.id],carry.clockAt,now,skill.cooldown);}
      snakes[0].invincibleUntil=now+1800;
    }
    updateHud();
    renderSkills(true);
    lastStepTime = performance.now();
  }
  function updateHud() {
    const player = snakes[0];
    scoreEl.textContent = player.score;
    lengthEl.textContent = player.body.length;
    document.getElementById('levelText').textContent='Lv'+save.level;
    lbRows.innerHTML = snakes.slice().sort((a, b) => b.score - a.score).map(s =>
      `<div class="row${s.isPlayer ? ' me' : ''}">${s.isPlayer ? playerAvatarMarkup(28, spriteMarkup('snake', 'player', 28, `<span class="dot" style="background:${s.color}"></span>`)) : spriteMarkup('snake', friendKey(s), 28, `<span class="dot" style="background:${s.color}"></span>`)}<span class="name">${s.name}</span><span class="val">${s.score}</span></div>`
    ).join('');
    renderAmmo();
    const next = save.level >= 20 ? LEVEL_EXP[19] : LEVEL_EXP[save.level];
    const prev = LEVEL_EXP[save.level-1] || 0, within = Math.max(0, save.exp-prev), need=Math.max(1,next-prev);
    expText.textContent = `${within}/${need}`; expBar.style.width = `${Math.min(100,within/need*100)}%`;
  }

  // 固定糖果弹药槽：第一颗就是下一发，刚装入的一格会弹一下亮一下。
  function renderAmmo() {
    const player = snakes && snakes[0];
    const ammo = player ? player.ammo : [];
    const groups = player ? playerAmmoGroups(player) : {};
    const categories = Object.keys(groups);
    if (!groups[selectedAmmoCategory]) selectedAmmoCategory = categories[0] || null;
    const shown = categories.slice(0, 6);
    ammoSlotsEl.innerHTML = shown.map((category, i) => {
      const emojis = groups[category], level = ammoLevel(category), emoji = emojis[0];
      const cls = 'ammo-slot' + (category === selectedAmmoCategory ? ' selected' : '') + (category === ammoPopCategory ? ' pop' : '');
      return `<button type="button" class="${cls}" data-ammo-category="${category}" aria-label="${CATEGORY_META[category].label}弹 ${emojis.length}颗，Lv${level.lv}">${spriteMarkup('food', emoji, 38, emoji) || emoji}<b class="ammo-num">x${emojis.length}</b><b class="ammo-lv">Lv${level.lv}</b></button>`;
    }).join('') + (categories.length > 6 ? `<button type="button" class="ammo-more" title="还有${categories.length - 6}种弹药">+${categories.length - 6}</button>` : '');
    ammoCountEl.textContent = `${ammo.length}/${AMMO_MAX}`;
    document.getElementById('fireCount').textContent=ammo.length;
    fireBtn.setAttribute('aria-label',`发射糖果弹，剩余${ammo.length}颗`);
    fireBtn.setAttribute('aria-disabled', String(!running || paused || !ammo.length));
    ammoPopCategory = null;
  }

  // ===== 按每条蛇的性格选目标水果 =====
  function pickTarget(snake, head) {
    if (!foods.length) return null;
    if (snake.strategy === 'biggest') {
      let best = null, bestVal = -Infinity;
      for (const f of foods) {
        const val = f.score * 1000 - manhattan(f, head);
        if (val > bestVal) { bestVal = val; best = f; }
      }
      return best;
    }
    if (snake.strategy === 'coward') {
      const ph = snakes[0].body[0];
      let best = null, bestVal = -Infinity;
      for (const f of foods) {
        const val = manhattan(f, ph) - manhattan(f, head) * 0.4;
        if (val > bestVal) { bestVal = val; best = f; }
      }
      return best;
    }
    if (snake.strategy === 'efficient') {
      let best = null, bestVal = -Infinity;
      for (const f of foods) {
        const val = f.score / (manhattan(f, head) + 1);
        if (val > bestVal) { bestVal = val; best = f; }
      }
      return best;
    }
    // 'nearest'：谁近吃谁
    let best = null, bestVal = Infinity;
    for (const f of foods) {
      const val = manhattan(f, head);
      if (val < bestVal) { bestVal = val; best = f; }
    }
    return best;
  }

  // BFS 走格子找路，找不到食物时 flood fill 选空间最大的一步；目标会固定到吃完，避免自动模式左右抖动。
  function findPath(snake, target) {
    const head=snake.body[0], key=(x,y)=>x+','+y, blocked=new Set();
    if(!snake.isPlayer || !skillActive('ghost')) for(const o of obstacles) blocked.add(key(o.x,o.y));
    for(const s of snakes) for(let i=0;i<s.body.length-(s===snake?1:0);i++) blocked.add(key(s.body[i].x,s.body[i].y));
    blocked.delete(key(head.x,head.y)); const q=[head], prev=new Map([[key(head.x,head.y),null]]), dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    for(let qi=0;qi<q.length&&qi<COLS*ROWS;qi++){const p=q[qi];if(p.x===target.x&&p.y===target.y){const path=[];let cursor={x:p.x,y:p.y}, k=key(cursor.x,cursor.y);while(prev.get(k)){path.unshift({...cursor});cursor=prev.get(k);k=key(cursor.x,cursor.y);}return path;}for(const d of dirs){const x=p.x+d.x,y=p.y+d.y,k=key(x,y);if(x>=0&&x<COLS&&y>=0&&y<ROWS&&!blocked.has(k)&&!prev.has(k)){prev.set(k,{x:p.x,y:p.y});q.push({x,y});}}}return null;
  }
  function openSpace(snake, d){const h=snake.body[0], seen=new Set(), q=[{x:h.x+d.x,y:h.y+d.y}],key=(x,y)=>x+','+y;while(q.length&&seen.size<80){const p=q.shift(),k=key(p.x,p.y);if(seen.has(k)||p.x<0||p.x>=COLS||p.y<0||p.y>=ROWS||obstacles.some(o=>o.x===p.x&&o.y===p.y)||snakes.some(s=>s.body.some(b=>b.x===p.x&&b.y===p.y)))continue;seen.add(k);for(const n of [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}])q.push({x:p.x+n.x,y:p.y+n.y});}return seen.size;}
  // ===== 朝目标水果规划下一步方向，玩家和 AI 都会绕墙，也会躲开对手头部 =====
  function chooseDir(snake) {
    const head = snake.body[0];
    let target = null;
    if (snake.targetFood && foods.includes(snake.targetFood)) {
      target = snake.targetFood;
    } else {
      target = pickTarget(snake, head);
      snake.targetFood = target;
    }
    if (!target) return;

    const cand = [
      { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 },
    ].filter(d => !(d.x === -snake.dir.x && d.y === -snake.dir.y));

    const path=findPath(snake,target); if(path&&path.length){const n=path[0],d={x:n.x-head.x,y:n.y-head.y};if(!(d.x===-snake.dir.x&&d.y===-snake.dir.y)){snake.nextDir=d;return;}}
    function scoreDir(d) {
      let nx = head.x + d.x, ny = head.y + d.y;
      let s = 0;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) s += 1000;
      if (obstacles.some(o=>o.x===nx&&o.y===ny)) s += 1000;
      for (let i = 0; i < snake.body.length - 1; i++) {
        if (snake.body[i].x === nx && snake.body[i].y === ny) { s += 500; break; }
      }
      for (const other of snakes) {
        if (other === snake) continue;
        for (const seg of other.body) {
          if (seg.x === nx && seg.y === ny) { s += 60; break; }
        }
      }
      s += Math.abs(target.x - nx) + Math.abs(target.y - ny) - openSpace(snake,d)*.8;
      for(const other of snakes) if(other!==snake && Math.abs(other.body[0].x-nx)+Math.abs(other.body[0].y-ny)<=1) s+=180;
      return s;
    }

    let bestDir = null, bestScore = Infinity;
    for (const d of cand) {
      const sc = scoreDir(d);
      if (sc < bestScore) { bestScore = sc; bestDir = d; }
    }
    if (bestDir) snake.nextDir = bestDir;
  }

  function step() {
    for (const snake of snakes) {
      if (snake.auto) chooseDir(snake);
      snake.dir = snake.nextDir;
    }
    for (const snake of snakes) {
      const now = performance.now();
      // 糖果冻结时原地不动；减速则每两拍挪一次，玩家永远不会受这些效果影响。
      if (!snake.isPlayer && snake.frozenUntil > now) continue;
      if (!snake.isPlayer && snake.slowedUntil > now && now - (snake.lastSlowStep || 0) < BASE_SPEED * 1.7) continue;
      snake.lastSlowStep = now;
      snake.prevBody = snake.body.map(s => ({ ...s }));

      let nx = snake.body[0].x + snake.dir.x;
      let ny = snake.body[0].y + snake.dir.y;

      // 撞糖果墙时优先沿着能走的方向拐弯，绝不在墙前反复顶住。
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || obstacles.some(o=>o.x===nx&&o.y===ny)) {
        const turn=[{x:-snake.dir.y,y:snake.dir.x},{x:snake.dir.y,y:-snake.dir.x},{x:-snake.dir.x,y:-snake.dir.y}].find(d=>{const x=snake.body[0].x+d.x,y=snake.body[0].y+d.y;return x>=0&&x<COLS&&y>=0&&y<ROWS&&(!obstacles.some(o=>o.x===x&&o.y===y)||skillActive('ghost'));})||snake.dir;
        snake.dir = turn; snake.nextDir = {...turn}; screenShakeUntil=Math.max(screenShakeUntil,performance.now()+80);
        nx = snake.body[0].x + snake.dir.x;
        ny = snake.body[0].y + snake.dir.y;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || obstacles.some(o=>o.x===nx&&o.y===ny)) { nx = snake.body[0].x; ny = snake.body[0].y; }
      }

      const head = { x: nx, y: ny };
      snake.body.unshift(head);

      const idx = foods.findIndex(f => f.x === head.x && f.y === head.y);
      if (idx >= 0) {
        const eaten = foods[idx];
        snake.score += foods[idx].score;
        snake.grow += foods[idx].grow;
        if (snake.ammo.length < AMMO_MAX) {
          if(!snake.isPlayer || isUnlocked('ammo',eaten.category)) snake.ammo.push(eaten.emoji);
          if (snake.isPlayer) ammoPopCategory = eaten.category;
        }
        if (foods[idx] === snake.targetFood) snake.targetFood = null;
        foods.splice(idx, 1);
        if(snake.isPlayer){ playSound(foodSoundKind(eaten.category)); gainExp(2,'吃糖果'); if(performance.now()-lastFoodSave>2000){lastFoodSave=performance.now();saveGame();} }
      }
      snake.contents.unshift(null);

      if (snake.body.length >= MAX_BODY_LEN) {
        snake.grow = 0;
        snake.body.pop();
        snake.contents.pop();
      } else if (snake.grow > 0) {
        snake.grow--;
      } else {
        snake.body.pop();
        snake.contents.pop();
      }
      while (snake.prevBody.length < snake.body.length) {
        snake.prevBody.push({ ...snake.prevBody[snake.prevBody.length - 1] });
      }
      while (snake.contents.length < snake.body.length) snake.contents.push(null);
    }

    // 撞击判定：玩家的头只要碰到别的蛇（哪怕是对方的头），对方直接死亡；
    // 玩家自己永远不会因为撞击而死，所以只需要单向检测玩家头 -> 别人身体
    const player = snakes[0];
    if (player) {
      // 磁铁只拉近附近糖果，避免一口气全盘吸光，也不会改变食物的正常刷新节奏。
      if(skillActive('magnet')) for(const f of foods){const dx=player.body[0].x-f.x,dy=player.body[0].y-f.y;if(Math.hypot(dx,dy)<=5){f.x+=Math.sign(dx);f.y+=Math.sign(dy);}}
      const ph = player.body[0];
      if(!skillActive('ghost')) for (let i = snakes.length - 1; i >= 1; i--) if (snakes[i].body.some(s => s.x === ph.x && s.y === ph.y)) killOpponent(i);
      if(skillActive('rainbow')||skillActive('giant')) for(let i=snakes.length-1;i>=1;i--) if(Math.abs(snakes[i].body[0].x-ph.x)+Math.abs(snakes[i].body[0].y-ph.y)<=1) killOpponent(i);
    }

    refillFoods();
    updateHud();
  }

  // ===== 武器：玩家从选中种类发射，AI 仍按原来的队列顺序发射 =====
  function fireWeapon(snake) {
    if (!snake || !snake.ammo.length) return false;
    const now = performance.now();
    let ammoIndex = 0, kind = kindForEmoji(snake.ammo[0]), level = { lv: 1 };
    if (snake.isPlayer) {
      const groups = playerAmmoGroups(snake); if (!groups[selectedAmmoCategory]) selectedAmmoCategory = Object.keys(groups)[0];
      ammoIndex = snake.ammo.findIndex(emoji => kindForEmoji(emoji).category === selectedAmmoCategory);
      kind = kindForEmoji(snake.ammo[ammoIndex]); level = ammoLevel(kind.category);
    }
    const cooldown = snake.isPlayer ? (level.lv >= 5 ? 120 : level.lv >= 3 ? 230 : 360) : 180;
    if (now - snake.lastShotAt < cooldown) return false;
    snake.lastShotAt = now;
    const emoji = snake.ammo.splice(ammoIndex, 1)[0];
    const head = snake.body[0];
    const fx = AMMO_FX[kind.category];
    bullets.push({
      // 半格在头前方出生，既像从嘴里飞出，也不会马上碰到自己的身体。
      x: head.x + 0.5 + snake.dir.x * 0.55,
      y: head.y + 0.5 + snake.dir.y * 0.55,
      dir: { x: snake.dir.x, y: snake.dir.y },
      emoji,
      owner: snake,
      kind, fx, level: level.lv, hitsLeft: fx.pierce || 1, hitCells: new Set(),
    });
    // 复用糖果星星粒子，给每一发一个夸张可爱的「噗」。
    candyBursts.push({ x: head.x, y: head.y, born: now });
    if(snake.isPlayer) playSound('shoot');
    updateHud();
    return true;
  }

  function addAmmoParticles(pos, fx, level, count) {
    for (let n = 0; n < count && ammoFxParticles.length < MAX_FX_PARTICLES; n++) ammoFxParticles.push({ x:pos.x+.5, y:pos.y+.5, vx:(Math.random()-.5)*(2+level), vy:(Math.random()-.5)*(2+level), born:performance.now(), life:450+Math.random()*500, color:fx.color });
  }
  function hurtTarget(target, hitIdx, b, gx, gy) {
    const now = performance.now(), rare = b.kind.weight <= 1 || b.kind.score >= 6;
    playSound('hit');
    const damage = (b.fx.damage + 1 + (b.level >= 3 ? 1 : 0) + (b.level >= 5 ? 1 : 0) + (rare ? 1 : 0))*2;
    target.hitFlashUntil=now+220; if (hitIdx === 0 || target.body.length<=damage+2) { const index = snakes.indexOf(target); if (index >= 1) killOpponent(index); }
    else { target.body.splice(hitIdx, damage); target.contents.splice(hitIdx, damage); }
    addAmmoHit(b.kind.category); addAmmoParticles({x:gx,y:gy}, b.fx, b.level, 8 + b.level * 3);
    ammoDamageTexts.push({ x:gx+.5, y:gy+.4, text:`-${damage}`, born:now, color:b.fx.color });
    if (b.fx.special === 'slow') target.slowedUntil = now + 3000;
    if (b.fx.special === 'freeze') target.frozenUntil = now + 2000;
    if (b.fx.special === 'reward' && foods.length < foodCap()) foods.push({ x:gx, y:gy, ...kindForEmoji(b.emoji) });
    if (b.fx.special === 'heavy') screenShakeUntil = now + 280;
    if (b.fx.special === 'splash') for (const other of snakes.slice(1)) for (let j = other.body.length - 1; j >= 1; j--) if (Math.hypot(other.body[j].x-gx, other.body[j].y-gy) <= 1.5) hurtTarget(other, j, {...b, fx:{...b.fx, special:'none'}}, other.body[j].x, other.body[j].y);
    if (b.fx.special === 'chain') { let best, dist=Infinity; for (const other of snakes.slice(1)) for (let j=0;j<other.body.length;j++) { const d=Math.hypot(other.body[j].x-gx,other.body[j].y-gy); if(d>.2&&d<dist){best={other,j};dist=d;} } if(best){const to=best.other.body[best.j];ammoArcs.push({from:{x:gx+.5,y:gy+.5},to:{x:to.x+.5,y:to.y+.5},born:now,color:b.fx.color});hurtTarget(best.other,best.j,{...b,fx:{...b.fx,special:'none'}},to.x,to.y);} }
  }
  // 子弹连续飞行；只有玩家子弹能伤害对手，保持单向规则。
  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.dir.x * BULLET_SPEED * (b.fx.speed || 1) * dt;
      b.y += b.dir.y * BULLET_SPEED * (b.fx.speed || 1) * dt;
      if (b.x < -1 || b.x > COLS + 1 || b.y < -1 || b.y > ROWS + 1) {
        bullets.splice(i, 1);
        continue;
      }
      const gx = Math.floor(b.x), gy = Math.floor(b.y);
      const block = obstacles.find(o=>o.x===gx&&o.y===gy);
      if(block){ const damage=b.fx.damage+(b.level>=3?1:0); if(damage>=2){obstacles.splice(obstacles.indexOf(block),1);addAmmoParticles(block,b.fx,b.level,16);} bullets.splice(i,1); continue; }
      let hit = false;
      for (let s = snakes.length - 1; s >= 0; s--) {
        const target = snakes[s];
        if (target === b.owner || !b.owner.isPlayer) continue;
        const hitIdx = target.body.findIndex(seg => seg.x === gx && seg.y === gy);
        if (hitIdx < 0 || b.hitCells.has(`${s}:${hitIdx}`)) continue;
        hit = true;
        b.hitCells.add(`${s}:${hitIdx}`); hurtTarget(target, hitIdx, b, gx, gy); b.hitsLeft--;
        if (b.hitsLeft <= 0) break;
      }
      if (hit && b.hitsLeft <= 0) bullets.splice(i, 1);
    }
  }

  function cellCenter(c) {
    return { x: OFFX + c.x * CELL + CELL / 2, y: OFFY + c.y * CELL + CELL / 2 };
  }

  function lerpSeg(prev, cur, t) {
    const gx = prev.x + (cur.x - prev.x) * t;
    const gy = prev.y + (cur.y - prev.y) * t;
    return { x: OFFX + gx * CELL + CELL / 2, y: OFFY + gy * CELL + CELL / 2 };
  }

  // 棋盘底图（格子 + 背景图 + 边框）很重且不变：缓存到离屏画布，每帧只贴一次
  let boardCache = null, boardCacheKey = '';
  function drawBoard() {
    ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
    const key = [COLS,ROWS,OFFX,OFFY,CELL,DPR,canvas.width,canvas.height,boardImage.complete && boardImage.naturalWidth ? 1 : 0].join();
    if (key !== boardCacheKey) {
      boardCacheKey = key;
      boardCache = document.createElement('canvas');
      boardCache.width = canvas.width; boardCache.height = canvas.height;
      const c = boardCache.getContext('2d');
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      c.save();c.beginPath();c.rect(OFFX,OFFY,COLS*CELL,ROWS*CELL);c.clip();
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          c.fillStyle = (x + y) % 2 === 0 ? '#c7e8bd' : '#d2eec9';
          c.fillRect(OFFX + x * CELL, OFFY + y * CELL, CELL, CELL);
        }
      }
      // 用 cover 裁切铺满画布；逻辑格坐标与碰撞边界保持不变。
      if (boardImage.complete && boardImage.naturalWidth) {
        const w = COLS*CELL, h = ROWS*CELL;
        const scale = Math.max(w / boardImage.naturalWidth, h / boardImage.naturalHeight);
        const sw = w / scale, sh = h / scale;
        c.drawImage(boardImage, (boardImage.naturalWidth - sw) / 2,
          (boardImage.naturalHeight - sh) / 2, sw, sh, OFFX, OFFY, w, h);
      }
      c.strokeStyle = 'rgba(70,174,151,.35)';
      c.lineWidth = 6;
      c.strokeRect(OFFX + 3, OFFY + 3, COLS * CELL - 6, ROWS * CELL - 6);
      c.restore();
    }
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(boardCache, 0, 0);
    ctx.restore();
  }

  // 纯视觉观察食物与对手的消失，不接触碰撞、计分或游戏随机数。
  let lastVisualFoods = new Set(), lastVisualSnakes = new Map();
  let candyBursts = [];
  function drawCandyBursts() {
    const now = performance.now();
    const currentFoods = new Set(foods), currentSnakes = new Map(snakes.map(s => [s, s.body[0]]));
    const add = pos => { if (candyBursts.length < 16) candyBursts.push({ ...pos, born: now }); };
    for (const food of lastVisualFoods) if (!currentFoods.has(food)) add(food);
    for (const [snake, pos] of lastVisualSnakes) if (!currentSnakes.has(snake)) add(pos);
    lastVisualFoods = currentFoods;
    lastVisualSnakes = currentSnakes;
    candyBursts = candyBursts.filter(p => now-p.born < 420);
    for (const p of candyBursts) {
      const t = (now-p.born)/420, center = cellCenter(p);
      ctx.save();
      ctx.globalAlpha = 1-t;
      for (let i = 0; i < 6; i++) {
        const angle = i*Math.PI/3, radius = t*CELL*.85;
        drawSprite('fx', i%2 ? 'sprinkle'+(i%4) : 'star'+(i%4),
          center.x+Math.cos(angle)*radius, center.y+Math.sin(angle)*radius, CELL*.22*(1-t*.4));
      }
      ctx.restore();
    }
  }
  function drawFoods() {
    drawCandyBursts();
    ctx.font = FOOD_FONT_SIZE + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const pulse = 1 + Math.sin(performance.now() / 320) * 0.07;
    const targeted = new Set(snakes.map(s => s.targetFood).filter(Boolean));
    for (const f of foods) {
      const c = cellCenter(f);

      // 图标本体先画
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(pulse, pulse);
      if (!drawSprite('food', f.emoji, 0, 0, FOOD_FONT_SIZE)) ctx.fillText(f.emoji, 0, 4);
      ctx.restore();

      // 稀有光圈：画在图标上面，半径按放大后的图标尺寸扩大
      if (f.category !== 'fruit') {
        const meta = CATEGORY_META[f.category] || { color: '255,196,64' };
        ctx.save();
        const glow = 0.55 + Math.sin(performance.now() / 220) * 0.25;
        ctx.shadowColor = `rgba(${meta.color},.6)`;
        ctx.shadowBlur = 12 * glow;
        ctx.beginPath();
        ctx.arc(c.x, c.y, CELL * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${meta.color},${glow * .35})`;
        ctx.lineWidth = 9;
        ctx.stroke();
        ctx.restore();
      }

      // 选中圈：同样画在图标最上面，半径够大才能整个套住放大后的图标
      if (targeted.has(f)) {
        ctx.save();
        ctx.strokeStyle = '#e67e22';
        ctx.lineWidth = 5;
        ctx.setLineDash([14, 10]);
        ctx.lineDashOffset = -(performance.now() / 30) % 24;
        ctx.beginPath();
        ctx.arc(c.x, c.y, CELL * 0.8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawBullets() {
    if (!bullets.length) return;
    ctx.font = (CELL * 0.5) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const b of bullets) {
      const px = OFFX + b.x * CELL, py = OFFY + b.y * CELL;
      ctx.save();
      const size = CELL * (.62 + b.level * .055);
      ctx.shadowColor = b.fx.trail; ctx.shadowBlur = 18 + b.level * 4;
      ctx.strokeStyle = b.fx.trail; ctx.lineWidth = 6 + b.level;
      ctx.beginPath(); ctx.moveTo(px-b.dir.x*CELL*1.05,py-b.dir.y*CELL*1.05); ctx.lineTo(px,py); ctx.stroke();
      ctx.strokeStyle='#fff7a8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px-b.dir.x*CELL*.9,py-b.dir.y*CELL*.9);ctx.lineTo(px,py);ctx.stroke();
      drawSprite('fx', 'star1', px - b.dir.x*CELL*.22, py - b.dir.y*CELL*.22, size);
      if (!drawSprite('food', b.emoji, px, py, size)) ctx.fillText(b.emoji, px, py);
      ctx.restore();
    }
  }

  // 命中特效在名字牌之后再画：糖浆泡泡、冰晶、彗星星屑和闪电都不会压住蛇头。
  function drawAmmoFx() {
    const now = performance.now();
    ammoFxParticles = ammoFxParticles.filter(p => now-p.born < p.life);
    ammoDamageTexts = ammoDamageTexts.filter(p => now-p.born < 800);
    ammoArcs = ammoArcs.filter(a => now-a.born < 260);
    for (const p of ammoFxParticles) {
      const t=(now-p.born)/p.life, x=OFFX+(p.x+p.vx*t)*CELL, y=OFFY+(p.y+p.vy*t)*CELL;
      ctx.save(); ctx.globalAlpha=1-t; ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(x,y,(1-t)*4+2,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    for (const a of ammoArcs) {
      const from={x:OFFX+a.from.x*CELL,y:OFFY+a.from.y*CELL},to={x:OFFX+a.to.x*CELL,y:OFFY+a.to.y*CELL};
      ctx.save();ctx.strokeStyle=a.color;ctx.shadowColor='#fff176';ctx.shadowBlur=16;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo((from.x+to.x)/2+12,(from.y+to.y)/2-13);ctx.lineTo(to.x,to.y);ctx.stroke();ctx.restore();
    }
    ctx.save(); ctx.textAlign='center'; ctx.font='900 23px -apple-system,"PingFang SC",sans-serif';
    for (const d of ammoDamageTexts) { const t=(now-d.born)/800;ctx.globalAlpha=1-t;ctx.fillStyle=d.color;ctx.shadowColor='#fff';ctx.shadowBlur=5;ctx.fillText(d.text,OFFX+d.x*CELL,OFFY+(d.y-t*.8)*CELL); } ctx.restore();
    // 击杀彩纸和连杀大字独立限额，激烈时也不会把 Canvas 画满。
    while(killParticles.length && now-killParticles[0].born>killParticles[0].life)killParticles.shift();
    for(const p of killParticles){const t=(now-p.born)/p.life;ctx.save();ctx.globalAlpha=1-t;ctx.font='18px serif';ctx.fillText(p.emoji,OFFX+(p.x+p.vx*t)*CELL,OFFY+(p.y+p.vy*t-p.vy*t*t)*CELL);ctx.restore();}
    while(killTexts.length && now-killTexts[0].born>900)killTexts.shift();ctx.save();ctx.font='900 30px -apple-system,"PingFang SC",sans-serif';ctx.textAlign='center';for(const d of killTexts){const t=(now-d.born)/900;ctx.globalAlpha=1-t;ctx.fillStyle='#ff4f9a';ctx.strokeStyle='#fff7a8';ctx.lineWidth=7;const x=OFFX+d.x*CELL,y=OFFY+(d.y-t*1.4)*CELL;ctx.strokeText(d.text,x,y);ctx.fillText(d.text,x,y);}ctx.restore();
  }

  // 解锁后的尾迹沿着玩家尾巴轻轻飘；数量受同一粒子上限约束。
  function drawTrail(){
    if(!snakes || save.trail==='none') return; const p=snakes[0], tail=p.body[p.body.length-1], now=performance.now();
    if(Math.random()<.24 && trailParticles.length<MAX_FX_PARTICLES) trailParticles.push({x:tail.x+.5,y:tail.y+.5,born:now,life:650+Math.random()*300,seed:Math.random()});
    trailParticles=trailParticles.filter(a=>now-a.born<a.life); const icon={rainbow:'🌈',star:'⭐',heart:'♥',bubble:'●'}[save.trail];
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='22px sans-serif';for(const a of trailParticles){const t=(now-a.born)/a.life;ctx.globalAlpha=1-t;ctx.fillStyle=save.trail==='bubble'?'#75dfff':'#fff';ctx.fillText(icon,OFFX+a.x*CELL,OFFY+(a.y-t*.8)*CELL);}ctx.restore();
    if(skillActive('rainbow')){if(Math.random()<.55&&skillTrailParticles.length<80)skillTrailParticles.push({x:tail.x+.5,y:tail.y+.5,born:now});while(skillTrailParticles.length&&now-skillTrailParticles[0].born>520)skillTrailParticles.shift();ctx.save();ctx.font='24px serif';for(const a of skillTrailParticles){const t=(now-a.born)/520;ctx.globalAlpha=1-t;ctx.fillText('🌈',OFFX+a.x*CELL,OFFY+(a.y-t*.9)*CELL);}ctx.restore();}
  }

  function drawNameTag(snake, headPt, color) {
    if (snake.isPlayer && kidAvatarReady) { drawKidAvatar(headPt); return; }
    ctx.save();
    ctx.font = '600 15px -apple-system, "PingFang SC", sans-serif';
    const label = snake.name;
    const w = ctx.measureText(label).width + 16;
    const tagY = headPt.y - CELL * .62;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(headPt.x - w / 2, tagY - 12, w, 22, 11);
    else ctx.rect(headPt.x - w / 2, tagY - 12, w, 22);
    ctx.fill();
    ctx.fillStyle = color || snake.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, headPt.x, tagY - 1);
    ctx.restore();
  }

  // 玩家蛇专用：按当前皮肤画蛇身。三层结构——底层勾边柔光（skin.edge，为 null 时
  // 改由每段自发光，彩虹就是这种）、中间逐段流动的主体色（skin.body）、最上面一条更亮的
  // 高光脊线（skin.highlight），配合呼吸式发光，让每套皮肤都有质感而不是死板纯色。
  function drawPlayerBody(pts, skin) {
    if (skin.blocky) { drawBlockyBody(pts, skin); return; }
    const now = performance.now();
    const glow = 14 + Math.sin(now / 150) * 6;
    const glowColor = (i) => (typeof skin.glow === 'function' ? skin.glow(i, now) : skin.glow);

    // 底层：勾边柔光，把蛇身从背景里衬出来（有 edge 的皮肤才画）
    if (skin.edge) {
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = skin.edge;
      ctx.shadowColor = glowColor(0);
      ctx.shadowBlur = glow;
      ctx.lineWidth = CELL * 0.72;
      strokePath(pts);
      ctx.restore();
    }

    // 主体：逐段上色，随身体位置与时间缓缓流动
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = CELL * 0.62;
    // 无勾边皮肤（彩虹等）：逐段 shadowBlur 是 O(身长) 次模糊，iPad 上越长越卡；
    // 改为整条身体只做一次柔光底层，逐段只上色
    if (!skin.edge && pts.length > 1) {
      ctx.save();
      ctx.strokeStyle = glowColor(0); ctx.shadowColor = glowColor(0); ctx.shadowBlur = glow;
      strokePath(pts);
      ctx.restore();
    }
    for (let i = 0; i < pts.length - 1; i++) {
      ctx.strokeStyle = skin.body(i, now);
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
      ctx.stroke();
    }
    ctx.restore();

    // 顶部高光：一条更细更亮的脊线，制造珍珠 / 金属般的光泽
    ctx.strokeStyle = skin.highlight;
    ctx.lineWidth = CELL * 0.2;
    ctx.shadowBlur = 0;
    strokePath(pts);
  }

  // 方块皮肤专用：不画连续曲线，改成一节一个独立正方形（外框 → 主体 → 中心内芯三层），
  // 节间天然留缝，就是经典像素贪吃蛇的样子。位置仍用插值点，所以移动依然是平滑的。
  function drawBlockyBody(pts, skin) {
    const now = performance.now();
    const glow = 10 + Math.sin(now / 150) * 5;
    const outer = CELL * 0.84, inner = CELL * 0.62, core = CELL * 0.24;
    const glowColor = (i) => (typeof skin.glow === 'function' ? skin.glow(i, now) : skin.glow);
    ctx.save();
    // 从尾往头画，后画的压在前面，转弯处不会被后一节的框切掉
    for (let i = pts.length - 1; i >= 1; i--) {
      const p = pts[i];
      ctx.shadowColor = glowColor(i);
      ctx.shadowBlur = glow;
      ctx.fillStyle = skin.edge;
      ctx.fillRect(p.x - outer / 2, p.y - outer / 2, outer, outer);
      ctx.shadowBlur = 0;
      ctx.fillStyle = skin.body(i, now);
      ctx.fillRect(p.x - inner / 2, p.y - inner / 2, inner, inner);
      ctx.fillStyle = skin.highlight;
      ctx.fillRect(p.x - core / 2, p.y - core / 2, core, core);
    }
    ctx.restore();
  }

  function strokePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      const mid = { x: (pts[i - 1].x + pts[i].x) / 2, y: (pts[i - 1].y + pts[i].y) / 2 };
      ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, mid.x, mid.y);
    }
    ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    ctx.stroke();
  }

  // 蛇身和蛇头分两轮画：子弹夹在中间，才会像从嘴里飞出又不会盖住脑袋。
  function drawSnakeBody(snake, t) { drawSnake(snake, t, true, false); }
  function drawSnakeHead(snake, t) { drawSnake(snake, t, false, true); }

  function drawSnake(snake, t, drawBody, drawHead) {
    const pts = [];
    for (let i = 0; i < snake.body.length; i++) pts.push(lerpSeg(snake.prevBody[i], snake.body[i], t));

    const skin = currentSkin;
    const headColor = snake.isPlayer ? skin.head(performance.now()) : snake.headColor;

    if (snake.isPlayer && (skillActive('ghost') || skillActive('rainbow') || skillActive('giant'))) { ctx.save(); ctx.globalAlpha=skillActive('ghost')?.48:1; if(skillActive('giant'))ctx.shadowColor='#ffdf53',ctx.shadowBlur=25; }
    if (drawBody) {
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      // 糖果软糖身体：每节画一颗果冻珠子（玩家用当前皮肤的 body 精灵，AI 用糖果珠），
      // 从尾往头画，后画的压在前面；最后几节逐渐缩小，形成圆润的尾巴。图未加载则回退原绘制。
      const bodyKey = snake.isPlayer ? `skin_${skin.id}_body` : 'ai_candy_body';
      const candyBody = atlasImages.snake && ATLAS_DATA.snake.sprites[bodyKey];
      if (candyBody) {
      // 珠子锚定在「每一节身体」和「相邻两节的中点」上：位置只取决于各节的插值坐标，
      // 不依赖整条蛇的总长度，所以移动时珠子跟着格子平滑前进，不会前后晃动或往回缩。
      // 从尾往头画，后画的压在前面；最后 3 节逐渐缩小成圆润的尾巴。
      const n = pts.length, beadSize = CELL * 1.4 * (snake.isPlayer&&skillActive('giant')?1.45:1);
      const taperAt = (j) => (j < 3 ? 0.6 + 0.4 * j / 3 : 1); // j = 离尾巴的节数（可为小数）
      for (let i = n - 1; i >= 1; i--) {
        const j = n - 1 - i;
        drawSprite('snake', bodyKey, pts[i].x, pts[i].y, beadSize * taperAt(j));
        // 与前一节（靠近头）之间的中点珠，填满空隙让身体连成一体
        const mx = (pts[i].x + pts[i - 1].x) / 2, my = (pts[i].y + pts[i - 1].y) / 2;
        if (i > 1) drawSprite('snake', bodyKey, mx, my, beadSize * taperAt(j + 0.5));
      }
      } else if (snake.isPlayer) {
        drawPlayerBody(pts, skin);
      } else {
        ctx.strokeStyle = snake.color;
        ctx.lineWidth = CELL * 0.66;
        strokePath(pts);

        ctx.strokeStyle = 'rgba(255,255,255,.35)';
        ctx.lineWidth = CELL * 0.18;
        strokePath(pts);
      }
    }

    if (!drawHead) { if(snake.isPlayer && (skillActive('ghost') || skillActive('rainbow') || skillActive('giant')))ctx.restore(); return; }

    const head = pts[0];
    const nx = snake.dir.x, ny = snake.dir.y;
    const px = -ny, py = nx;

    // 蛇头素材原始朝下，旋转到当前移动方向；只替换绘制。
    if (atlasImages.snake) {
      ctx.save();
      ctx.translate(head.x, head.y);
      // 玩家皮肤头是侧面朝右：转到移动方向，向左走时上下翻转避免倒立；
      // AI 小动物头是正脸，保持直立最可爱，不旋转。
      if (snake.isPlayer && ATLAS_DATA.snake.sprites[`skin_${skin.id}_head`]) {
        ctx.rotate(Math.atan2(ny, nx));
        if (nx < 0) ctx.scale(1, -1);
      }
      const size = CELL * 1.3 * (snake.isPlayer&&skillActive('giant')?1.45:1);
      const sprite = snake.isPlayer ? `skin_${skin.id}_head` : ['ai_bear_head', 'ai_rabbit_head', 'ai_cat_head', 'ai_duck_head'][Math.max(0, AI_POOL.findIndex(p => p.name === snake.name)) % 4];
      drawSprite('snake', ATLAS_DATA.snake.sprites[sprite] ? sprite : (snake.isPlayer ? 'player' : friendKey(snake)), 0, 0, size);
      ctx.restore();
      drawNameTag(snake, head, snake.color);
      if(snake.isPlayer && (skillActive('ghost') || skillActive('rainbow') || skillActive('giant')))ctx.restore(); return;
    }
    ctx.save();
    if (snake.isPlayer) {
      ctx.shadowColor = skin.headGlow === 'self' ? headColor : skin.headGlow;
      ctx.shadowBlur = 16;
    }
    if (snake.isPlayer && skin.blocky) {
      // 方块皮肤：头也是方的，比身体略大一圈，外框同色好认
      const oh = CELL * 0.92, ih = CELL * 0.72;
      ctx.fillStyle = skin.headEdge;
      ctx.fillRect(head.x - oh / 2, head.y - oh / 2, oh, oh);
      ctx.shadowBlur = 0;
      ctx.fillStyle = headColor;
      ctx.fillRect(head.x - ih / 2, head.y - ih / 2, ih, ih);
    } else {
      ctx.fillStyle = headColor;
      ctx.beginPath();
      ctx.arc(head.x, head.y, CELL * 0.42, 0, Math.PI * 2);
      ctx.fill();
      // 浅色皮肤的头容易和蛇身糊在一起，按皮肤描一圈边把它「浮」出来（headEdge 为 null 则不描）
      if (snake.isPlayer && skin.headEdge) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = skin.headEdge;
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }
    ctx.restore();

    // 舌头
    ctx.strokeStyle = '#e0463c';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    const tip = { x: head.x + nx * CELL * 0.72, y: head.y + ny * CELL * 0.72 };
    const wig = Math.sin(performance.now() / 120 + snake.wigSeed) * 7;
    ctx.beginPath();
    ctx.moveTo(head.x + nx * CELL * 0.42, head.y + ny * CELL * 0.42);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x + px * (9 + wig) + nx * 7, tip.y + py * (9 + wig) + ny * 7);
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x - px * (9 - wig) + nx * 7, tip.y - py * (9 - wig) + ny * 7);
    ctx.stroke();

    // 眼睛
    const eyeOff = CELL * 0.2, eyeFwd = CELL * 0.1;
    const e1 = { x: head.x + nx * eyeFwd + px * eyeOff, y: head.y + ny * eyeFwd + py * eyeOff };
    const e2 = { x: head.x + nx * eyeFwd - px * eyeOff, y: head.y + ny * eyeFwd - py * eyeOff };
    for (const e of [e1, e2]) {
      // 方块皮肤连眼睛也是方的，不然圆眼睛贴在方脑袋上很出戏
      if (snake.isPlayer && skin.blocky) {
        const ew = CELL * 0.22, pw = CELL * 0.11;
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x - ew / 2, e.y - ew / 2, ew, ew);
        ctx.fillStyle = '#111';
        ctx.fillRect(e.x + nx * 4 - pw / 2, e.y + ny * 4 - pw / 2, pw, pw);
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x, e.y, CELL * 0.12, 0, Math.PI * 2);
      ctx.fill();
      // 浅色皮肤的白眼白会融进白头，给玩家的眼睛描一圈中性淡色勾出轮廓（各皮肤通用）
      if (snake.isPlayer) {
        ctx.strokeStyle = 'rgba(90,100,120,.5)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(e.x + nx * 4, e.y + ny * 4, CELL * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }

    // 名牌是白底，玩家头是白色，直接用会白字白底看不见，改用玩家本体的绿色
    drawNameTag(snake, head, snake.isPlayer ? snake.color : headColor);
    if(snake.isPlayer && (skillActive('ghost') || skillActive('rainbow') || skillActive('giant')))ctx.restore();
  }

  function loop(now) {
    if (!running || paused) return;
    if([...combatPointers.values()].some(b=>b===fireBtn))requestFire();
    const speed = (spaceHeld ? BASE_SPEED / BOOST_DIVISOR : BASE_SPEED) / (skillActive('rainbow') ? 2.5 : 1);
    let elapsed = now - lastStepTime;
    // 切到后台的标签页会被浏览器节流，requestAnimationFrame 可能几秒才回来一次；
    // 这时 elapsed 会暴涨，下面的 while 会把攒下的几十个 tick 在一帧里瞬间跑完——
    // 表现出来就是画面「消失重排」、蛇突然窜一大截。这里做限幅：攒太多就直接丢弃多余的，
    // 从「现在往前推一个 tick」重新起步，而不是把所有欠账都补上。
    const maxCatchUp = speed * 8;
    if (elapsed > maxCatchUp) {
      lastStepTime = now - speed;
      elapsed = speed;
    }
    while (elapsed >= speed) {
      step();
      lastStepTime += speed;
      elapsed -= speed;
    }
    // 子弹和重生计时走真实帧间隔，不跟着蛇的整格步进走，动作才够快
    const dt = Math.min(0.05, lastFrameTime ? (now - lastFrameTime) / 1000 : 0);
    lastFrameTime = now;
    updateBullets(dt);
    processRespawns(now);
    const t = Math.min(1, (now - lastStepTime) / speed);
    const shaking = now < screenShakeUntil;
    if (shaking) { ctx.save(); ctx.translate((Math.random()-.5)*7, (Math.random()-.5)*7); }
    drawBoard();
    drawFoods();
    drawTrail();
    for (const snake of snakes) drawSnakeBody(snake, t);
    drawBullets();
    for (const snake of snakes) drawSnakeHead(snake, t);
    drawAmmoFx();
    renderSkills();
    if (shaking) ctx.restore();
    requestAnimationFrame(loop);
  }

  function setDir(x, y) {
    const player = snakes[0];
    if (player.body.length > 1 && x === -player.dir.x && y === -player.dir.y) return;
    player.nextDir = { x, y };
  }

  function toggleAuto() {
    const player = snakes[0];
    player.auto = !player.auto;
    autoBtn.textContent = '自动吃：' + (player.auto ? '开' : '关');
    autoBtn.classList.toggle('on', player.auto);
  }

  function start(carry=null) {
    resize();
    reset(carry);
    running = true;
    renderAmmo();
    renderSkills(true);syncAudio();if(!carry)playSound('unlock');
    overlay.classList.add('hidden');
    lastStepTime = performance.now();
    lastFrameTime = performance.now();
    requestAnimationFrame(loop);
  }

  function renderTrails(){ trailModal.innerHTML=TRAILS.map(t=>`<button class="trail${save.trail===t.id?' active':''}" data-trail="${t.id}">${t.emoji} ${t.name}</button>`).join(''); }
  function refreshStart(){ startBtn.textContent=save.run ? '继续游戏' : '开始游戏'; }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'p') { togglePause(); e.preventDefault(); return; }
    if (k === 'm') { toggleMute(); e.preventDefault(); return; }
    if (k === ' ') {
      // 空格现在只做加速，按住快跑、松开恢复，绝不再兼任发射。
      spaceHeld = true;
      e.preventDefault();
      return;
    }
    if (!snakes) return;
    if (running && SKILL_DEFS.some(s=>s.key===k)) { activateSkill(SKILL_DEFS.find(s=>s.key===k).id); e.preventDefault(); return; }
    if (running && (k === 'q' || k === 'e')) { cycleAmmo(k === 'q' ? -1 : 1); e.preventDefault(); return; }
    if (running && /^[1-6]$/.test(k)) {
      const category = Object.keys(playerAmmoGroups(snakes[0]))[Number(k)-1];
      if (category) selectAmmo(category); e.preventDefault(); return;
    }
    if ((k === 'f' || k === 'j' || k === 'enter') && running) {
      requestFire();
      e.preventDefault();
      return;
    }
    const player = snakes[0];
    // 手动操作时，按方向键自动退出自动模式
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(k)) {
      if (player.auto) toggleAuto();
    }
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  });

  document.addEventListener('keyup', (e) => {
    if (e.key !== ' ') return;
    spaceHeld = false;
    e.preventDefault();
  });

  // 没弹药时也接住小手的点击，灰按钮晃一晃告诉孩子「先去吃糖果」。
  function requestFire() {
    if(paused||document.hidden)return;
    if (!running || !snakes || !snakes[0].ammo.length) {
      fireBtn.classList.remove('empty-shake');
      void fireBtn.offsetWidth;
      fireBtn.classList.add('empty-shake');
      return;
    }
    fireWeapon(snakes[0]);
  }
  ammoSlotsEl.addEventListener('click', (e) => {
    const slot = e.target.closest('[data-ammo-category]');
    if (slot && running) selectAmmo(slot.dataset.ammoCategory);
  });

  // 方向手势只认自己的 pointerId，战斗键的第二根手指不会重置它。
  let directionPointer = null;
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==0||directionPointer||!running||paused)return;
    e.preventDefault();canvas.setPointerCapture(e.pointerId);directionPointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
  });
  canvas.addEventListener('pointermove',e=>{
    const p=directionPointer;if(!p||p.id!==e.pointerId||!snakes||paused)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(snakes[0].auto)toggleAuto();if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
    p.x=e.clientX;p.y=e.clientY;p.moved=true;
  });
  canvas.addEventListener('pointerup',e=>{const p=directionPointer;if(!p||p.id!==e.pointerId)return;directionPointer=null;if(!p.moved)pickFoodAt(e.clientX,e.clientY);});
  const cancelDirection=e=>{if(directionPointer&&directionPointer.id===e.pointerId)directionPointer=null;};
  canvas.addEventListener('pointercancel',cancelDirection);canvas.addEventListener('lostpointercapture',cancelDirection);

  window.addEventListener('resize', () => {
    resize();
    if (!running) drawBoard();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      resize();
      if (!running) drawBoard();
    });
  }

  // 切走标签页/切到别的窗口时松不到 keyup，别让加速卡死在开启状态
  window.addEventListener('blur', () => { spaceHeld = false; });

  // 鼠标点击：选定离点击点最近的水果，玩家的蛇自动去吃它
  function pickFoodAt(clientX, clientY) {
    if (!running || paused || !foods) return;
    const player = snakes[0];
    const gx = (clientX - OFFX) / CELL;
    const gy = (clientY - OFFY) / CELL;
    let best = Infinity, pick = null;
    for (const f of foods) {
      const cx = f.x + 0.5, cy = f.y + 0.5;
      const d = (cx - gx) ** 2 + (cy - gy) ** 2;
      if (d < best) { best = d; pick = f; }
    }
    if (pick) {
      player.targetFood = pick;
      if (!player.auto) toggleAuto();
    }
  }
  const combatControls=document.getElementById('combatControls'),combatPointers=new Map();
  function pressCombat(b){
    if(b===fireBtn){requestFire();return;}
    if(b.id==='skillMore'){
      const opened=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(opened));document.getElementById('skillOverflow').classList.toggle('hidden',!opened);playSound('ui');return;
    }
    if(b.dataset.skill)activateSkill(b.dataset.skill);
  }
  combatControls.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button');if(!b||e.button!==0)return;e.preventDefault();e.stopPropagation();
    b.setPointerCapture(e.pointerId);combatPointers.set(e.pointerId,b);b.classList.add('pressed');pressCombat(b);
  });
  function releaseCombat(e){const b=combatPointers.get(e.pointerId);combatPointers.delete(e.pointerId);if(b&&![...combatPointers.values()].includes(b))b.classList.remove('pressed');}
  for(const event of ['pointerup','pointercancel','lostpointercapture'])combatControls.addEventListener(event,releaseCombat);
  // 无障碍键盘激活产生 detail=0 的 click；触摸只走 pointerdown，避免一次按两次。
  combatControls.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&e.detail===0)pressCombat(b);});
  window.addEventListener('blur',()=>{directionPointer=null;for(const b of combatPointers.values())b.classList.remove('pressed');combatPointers.clear();});
  pauseBtn.addEventListener('click',togglePause); muteBtn.addEventListener('click',toggleMute);

  startBtn.addEventListener('click', ()=>start(save.run||null));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) start(save.run||null); });
  autoBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleAuto(); });

  dexBtn.addEventListener('click', () => dexModal.classList.remove('hidden'));
  dexCloseBtn.addEventListener('click', () => dexModal.classList.add('hidden'));
  dexModal.addEventListener('click', (e) => { if (e.target === dexModal) dexModal.classList.add('hidden'); });

  skinBtn.addEventListener('click', () => skinModal.classList.remove('hidden'));
  skinCloseBtn.addEventListener('click', () => skinModal.classList.add('hidden'));
  skinModal.addEventListener('click', (e) => { if (e.target === skinModal) skinModal.classList.add('hidden'); });

  // 皮肤选择器：开始页（#skinsOverlay）和面板（#skinsModal）共用同一份渲染，
  // 选中状态两边同步。方块皮肤的预览色块用方角，跟它实际长相对上。
  function renderSkins() {
    const html = SKINS.map(s => (
      '<div class="skin' + (s.id === currentSkin.id ? ' active' : '') + '" data-skin="' + s.id + '">' +
      (atlasImages.snake && ATLAS_DATA.snake.sprites[`skin_${s.id}_head`]
        ? spriteMarkup('snake', `skin_${s.id}_head`, 42, '')
        : '<div class="skin-dot" style="background:' + s.css + (s.blocky ? ';border-radius:8px' : '') + '"></div>') +
      '<div class="skin-name">' + s.name + '</div></div>'
    )).join('');
    for (const box of skinBoxes) if (box) box.innerHTML = html;
  }
  function selectSkin(id) {
    const s = SKINS.find(k => k.id === id);
    if (!s) return;
    currentSkin = s;
    try { localStorage.setItem('snakeSkin', id); } catch (e) {}
    renderSkins();
    if (!running) drawBoard();
  }
  for (const box of skinBoxes) {
    if (!box) continue;
    box.addEventListener('click', (e) => {
      const card = e.target.closest('.skin');
      if (card) selectSkin(card.dataset.skin);
    });
  }
  updateToolIcons(); renderSkills(true); renderSkins();
  renderTrails(); refreshStart();
  trailModal.addEventListener('click',e=>{const b=e.target.closest('[data-trail]');if(!b)return;save.trail=b.dataset.trail;saveGame(true);renderTrails();});
  window.addEventListener('beforeunload',()=>saveGame(true)); document.addEventListener('visibilitychange',()=>{if(document.hidden){saveGame(true);spaceHeld=false;directionPointer=null;for(const b of combatPointers.values())b.classList.remove('pressed');combatPointers.clear();}syncAudio();});

  resize();
  drawBoard();
})();
</script>
</body>
</html>
