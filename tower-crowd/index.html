<script>
(() => {
'use strict';
// 纯逻辑不访问浏览器，供 Node 的内置测试器原样执行。
const W = 744, H = 1133, MAX_COUNT = 9999, MAX_GROUPS = 32, MAX_DRAWN = 60;
const THEMES = ['糖果平原', '棉花糖天空', '饼干城堡'];
const SKIN_NAMES = ['红衣队长', '小蓝熊', '小黄鸡', '小恐龙', '小狐狸', '独角兽'];
const SKIN_COSTS = [0, 70, 120, 190, 280, 380];
const clamp = (value, low, high) => Math.max(low, Math.min(high, Number.isFinite(value) ? value : low));
const integer = (value, low = 0, high = MAX_COUNT) => Math.floor(clamp(Number(value), low, high));
const safeLevel = value => integer(value, 1, 1000000);
function fieldBounds(y) {
  const t = clamp((y - 190) / 820, 0, 1), half = 252 + 82 * t;
  return { left: W / 2 - half, right: W / 2 + half, top: 145, bottom: 1010 };
}
// 外框包含真实人物宽高；按外框上沿较窄的场地限位，绘制和碰撞共用它。
function footprint(x, y, width, height) {
  y = clamp(y, 145 + height, 1010);
  const b = fieldBounds(y - height);
  x = clamp(x, b.left + width / 2 + 5, b.right - width / 2 - 5);
  return { x, y, left: x - width / 2, right: x + width / 2, top: y - height, bottom: y, width, height };
}
function packLayout(group, scale = 1, budget = 6) {
  const size = Math.max(36, 30 / Math.max(.25, scale)) * (group.giant ? 1.35 : 1);
  const height=size*2.16+4,edge=fieldBounds(group.y-height),opening=group.passage;
  const left=opening?Math.max(edge.left+5,opening.left):edge.left+5,right=opening?Math.min(edge.right-5,opening.right):edge.right-5;
  const capacity=Math.max(1,Math.floor((right-left-size)/(size*1.22))+1);
  const count = Math.min(integer(group.count), Math.max(0, budget), group.giant ? 2 : 4,capacity);
  if (!count) return { points: [], ...footprint(group.x, group.y, size, height), size };
  const width = size * (1 + (count - 1) * 1.22);
  const box = footprint(clamp(group.x,left+width/2,right-width/2), group.y, width, height);
  const points = Array.from({ length: count }, (_, i) => ({ x: box.x + (i - (count - 1) / 2) * size * 1.22, y: box.y, size, i }));
  return { ...box, size, points };
}
function gateX(gate, time) {
  const offset = gate.moving ? Math.sin(time * .72 + gate.phase) * gate.travel : 0;
  return footprint(gate.x + offset, gate.y, gate.width, 130).x;
}
function nearestGate(run,x){return run.level.gates.reduce((a,b)=>Math.abs(gateX(a,run.elapsed)-x)<=Math.abs(gateX(b,run.elapsed)-x)?a:b);}
function applyGate(count, gate) {
  count = integer(count);
  return integer(gate.op === '×' ? count * gate.value : count + gate.value);
}
function generateLevel(number) {
  const n = safeLevel(number), chapter = (n - 1) % 12 + 1, loop = Math.min(8, Math.floor((n - 1) / 12));
  const boss = chapter === 12, twin = chapter >= 4 && chapter <= 8;
  const hp = 44 + chapter * 4 + loop * 12;
  const towers = (twin ? [250, 494] : [372]).map((x, i) => ({ id: i, x, y: boss ? 465 : 420, width: boss ? 282 : twin ? 174 : 204, hp: boss ? hp * 2 : hp, maxHp: boss ? hp * 2 : hp, shield: chapter >= 7 ? 14 + loop * 3 : 0, maxShield: chapter >= 7 ? 14 + loop * 3 : 0, siege: 0, hurt: 0, fallen: 0 }));
  const broad = chapter <= 3;
  const gates = broad ? [{ id: 0, x: 372, y: 706, width: 400, op: chapter === 3 ? '+' : '×', value: chapter === 3 ? 10 : 2, moving: chapter === 2, travel: 40, phase: 0 }] : [
    { id: 0, x: 246, y: 706, width: 222, op: '×', value: chapter >= 9 ? 3 : 2, moving: chapter >= 5, travel: 12, phase: 0 },
    { id: 1, x: 498, y: 706, width: 222, op: '+', value: 10, moving: chapter >= 5, travel: 12, phase: Math.PI }];
  const obstacles = chapter === 1 ? [] : [{ id: 0, kind: chapter % 2 ? 'wall' : 'windmill', x: chapter % 2 ? 185 : 559, y: 510, width: 92, moving: chapter >= 6, phase: chapter * .6 }];
  if (chapter >= 9) obstacles.push({ id: 1, kind: 'windmill', x: 155, y: 575, width: 78, moving: true, phase: 1.4 });
  return { number: n, chapter, loop, theme: Math.floor((n - 1) / 3) % 3, boss, towers, gates, obstacles,
    enemyInterval: Math.max(3.1, 5.6 - chapter * .12 - loop * .08), enemyCount: chapter <= 3 ? 2 : chapter <= 10 ? 3 : 4 + Math.min(2, loop),
    enemySpeed: 40 + Math.min(14, chapter + loop), baseHp: chapter <= 10 ? 16 : 18, limit: 120, speed: 142 };
}
function cleanSave(raw) {
  raw = raw && typeof raw === 'object' ? raw : {};
  const owned = Array.from(new Set([0, ...(Array.isArray(raw.owned) ? raw.owned.filter(i => Number.isInteger(i) && i >= 0 && i < 6) : [])]));
  const skin = owned.includes(raw.skin) ? raw.skin : 0;
  const stars = {};
  if (raw.stars && typeof raw.stars === 'object') Object.entries(raw.stars).slice(0, 1000).forEach(([key, val]) => { if (/^\d+$/.test(key) && Number(key) > 0 && Number(key) <= 1000000) stars[key] = integer(val, 0, 3); });
  return { version: 1, level: safeLevel(raw.level), coins: integer(raw.coins, 0, 999999), owned, skin, speed: integer(raw.speed, 0, 3), health: integer(raw.health, 0, 3), muted: raw.muted === true, stars };
}
function buySkin(save, index) {
  const next = cleanSave(save);
  if (!Number.isInteger(index) || index < 0 || index > 5) return { ok: false, save: next };
  if (!next.owned.includes(index)) {
    if (next.coins < SKIN_COSTS[index]) return { ok: false, save: next };
    next.coins -= SKIN_COSTS[index]; next.owned.push(index);
  }
  next.skin = index; return { ok: true, save: next };
}
const upgradeCost = rank => 80 + integer(rank, 0, 3) * 80;
function buyUpgrade(save, kind) {
  const next = cleanSave(save);
  if (!['speed', 'health'].includes(kind) || next[kind] >= 3 || next.coins < upgradeCost(next[kind])) return { ok: false, save: next };
  next.coins -= upgradeCost(next[kind]); next[kind]++; return { ok: true, save: next };
}
// 八帧跑步用累计步程驱动；变速只改变后续步频，暂停后恢复不会跳相位。
function advanceRunClock(clock, dt, speed, baseSpeed = 126) {
  return clock + Math.max(0, dt) * 16 * (speed > 0 ? Math.max(.15, Math.min(2.5, speed / baseSpeed)) : 0);
}
function runFrame(clock, phase = 0, speed = 1) {
  if (!(speed > 0) || !Number.isFinite(clock) || !Number.isFinite(phase)) return 0;
  return (Math.floor((clock + phase) % 8) + 8) % 8;
}
// 编号散列给每个人固定的伪随机相位，增减人数、换队形和换装都不重新抽签。
function runPhase(id, seed = 0) {
  let n = (id + Math.imul(seed + 1, 2654435761)) | 0;
  n = Math.imul(n ^ (n >>> 16), 2246822507);
  n = Math.imul(n ^ (n >>> 13), 3266489909);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296 * 8;
}

function oscillator(freq=660,delay=0,duration=.13){if(!audio||save.muted)return;const o=audio.createOscillator(),g=audio.createGain(),start=audio.currentTime+delay;o.type='sine';o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(.12,start+.008);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(g);g.connect(master);o.start(start);o.stop(start+duration+.01);}
function sound(name){if(save.muted||!audio)return;const now=audio.currentTime;if(now-(lastSound[name]||-9)<(name==='attack'?.18:name==='spawn'?.17:.08))return;lastSound[name]=now;
  if(buffers[name]){const s=audio.createBufferSource();s.buffer=buffers[name];const gain=audio.createGain();gain.gain.value=name==='spawn'?.24:name==='attack'?.36:.65;s.connect(gain);gain.connect(master);s.start();}
  else if(clips[name]&&clips[name].dataset.failed!=='true'){const clip=clips[name].cloneNode();clip.volume=name==='spawn'?.12:.28;clip.play().catch(()=>oscillator());}
  else{const frequencies=name==='win'?[523,659,784,1047]:name==='lose'?[392,349,330]:['hit','bomb'].includes(name)?[150,100]:name==='gate'?[659,880,1047]:[660,880];frequencies.forEach((f,i)=>oscillator(f,i*.075));}
}

// 正常画面全部使用专属图片，路径外不会摆人物；矢量只负责阴影、数字与缺图兜底。
function box(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function label(value,x,y,size=24,color='#426c85',outline=true){ctx.font='1000 '+size+'px ui-rounded,"PingFang SC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';if(outline){ctx.lineWidth=Math.max(3,size*.17);ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.strokeText(value,x,y);}ctx.fillStyle=color;ctx.fillText(value,x,y);}
function drawImage(name,x,y,w,h,alpha=1){ctx.save();ctx.globalAlpha*=alpha;if(images[name])ctx.drawImage(images[name],x,y,w,h);else{const color=name.startsWith('enemy')?'#b4a2db':name.startsWith('tower')?'#f7b9bd':name.startsWith('kid')||name.startsWith('charge')?'#e88678':'#72cbd0';box(x,y,w,h,Math.min(15,w*.2),color,'#fff');if(w>42)label(name.startsWith('tower')?'糖果塔':name.startsWith('enemy')?'对手':name.startsWith('charge')||name.startsWith('kid')?'队员':'',x+w/2,y+h/2,Math.min(15,w/4),'#fff',false);}ctx.restore();}
function shadow(x,y,w){ctx.fillStyle='#3b7d831e';ctx.beginPath();ctx.ellipse(x,y,w*.45,w*.13,0,0,Math.PI*2);ctx.fill();}
// 缩小复用同一套八帧图；每个格位使用稳定相位，原队形与限位保持不变。
function runSprite(x,y,w,id,speed=run.runSpeed){
  const name='kid_run_'+(save.skin+1),sheet=images['run/'+name+'_sheet'];
  const phase=runPhase(id,run.level.number),frame=runFrame(run.runClock,phase,speed),h=w*2.08;
  const hop=speed>0?Math.abs(Math.sin((run.runClock+phase)*Math.PI/4))*.45:0;
  shadow(x,y,w);
  if(sheet)ctx.drawImage(sheet,frame*256,0,256,512,x-w/2,y-h*500/512-hop,w,h);
  else drawImage(name,x-w/2,y-h,w,h);
}
function sprite(name,x,y,w,phase=0){const img=images[name],ratio=img?Math.min(2.08,img.height/img.width):1.6,h=w*ratio,hop=Math.abs(Math.sin(phase))*2;shadow(x,y,w);ctx.save();ctx.translate(x,y-hop);ctx.rotate(Math.sin(phase)*.025);drawImage(name,-w/2,-h,w,h);ctx.restore();}
function badge(count,x,y,color='#4cabc5',small=false){const size=small?20:24,w=Math.max(47,String(Math.ceil(count)).length*15+29);x=clamp(x,w/2+12,W-w/2-12);box(x-w/2,y-16,w,32,12,color,'#fff');label('×'+Math.ceil(count),x,y+1,size,'#fff',false);}
const numberTags=[];
// 人数牌放在队列侧面，所有人物和门画完再显示，不能被前排或门楣挡住。
function queueCount(count,layout,color){
  const width=Math.max(47,String(Math.ceil(count)).length*15+29),y=(layout.top+layout.bottom)/2,bounds=fieldBounds(y);
  const right=layout.right+width/2+8,left=layout.left-width/2-8;
  const x=clamp(right+width/2<bounds.right-6?right:left,bounds.left+width/2+6,bounds.right-width/2-6);
  let top=y;for(const tag of numberTags)if(Math.abs(tag.x-x)<width&&Math.abs(tag.y-top)<35)top-=35;
  numberTags.push({count,x,y:Math.max(170,top),color});
}
function drawBoard(){
  const theme=run.level.theme,bg=images['background_'+theme];ctx.fillStyle=['#c6eee3','#d8e6fa','#f5dfbb'][theme];ctx.fillRect(0,0,W,H);
  if(bg){const drift=Math.sin(time*.13)*6;ctx.drawImage(bg,-8+drift,-9,W+16,H+18);}
  const top=fieldBounds(145),bottom=fieldBounds(1010);ctx.save();ctx.beginPath();ctx.moveTo(top.left,145);ctx.lineTo(top.right,145);ctx.lineTo(bottom.right,1010);ctx.quadraticCurveTo(372,1070,bottom.left,1010);ctx.closePath();ctx.clip();

  const light=ctx.createLinearGradient(0,145,0,1010);light.addColorStop(0,'#ffffff88');light.addColorStop(1,'#fff0');ctx.fillStyle=light;ctx.fillRect(0,145,W,930);
  // 细小路砖随纵深变大，衬出大场地，不遮挡塔楼和门。
  ctx.strokeStyle='#bca87d12';ctx.lineWidth=2;for(let y=220;y<1010;y+=70){const b=fieldBounds(y);ctx.beginPath();ctx.moveTo(b.left,y);ctx.lineTo(b.right,y);ctx.stroke();}
  ctx.restore();ctx.lineWidth=7;ctx.strokeStyle='#fffff8c9';ctx.beginPath();ctx.moveTo(top.left,145);ctx.lineTo(bottom.left,1010);ctx.moveTo(top.right,145);ctx.lineTo(bottom.right,1010);ctx.stroke();

}
function drawTowers(){for(const tower of run.level.towers){

function drawGates(front=false){for(const gate of run.level.gates){const x=gateX(gate,run.elapsed),w=gate.width,h=Math.min(155,w*.57),img=images.gate;
  if(!front){shadow(x,gate.y+4,w);ctx.fillStyle='#68dfdc22';ctx.beginPath();ctx.ellipse(x,gate.y-5,w*.33,20,0,0,Math.PI*2);ctx.fill();if(img){drawImage('gate',x-w/2,gate.y-h,w,h);}else{box(x-w/2,gate.y-h,w*.1,h,10,'#5ac9d3','#fff');box(x+w*.4,gate.y-h,w*.1,h,10,'#5ac9d3','#fff');box(x-w/2,gate.y-h,w,47,12,'#bceade','#fff');}label(gate.op+gate.value,x,gate.y-h+h*.30,w>300?34:27,'#338d94');}

function drawObstacles(){for(const obstacle of run.level.obstacles){const x=obstacleX(obstacle,run.elapsed),w=obstacle.width;shadow(x,obstacle.y,w);if(obstacle.kind==='windmill'){ctx.save();ctx.translate(x,obstacle.y-w*.725);ctx.rotate(time*1.8);drawImage('windmill',-w/2,-w/2,w,w);ctx.restore();}else drawImage('wall',x-w/2,obstacle.y-w*.6,w,w*.65);}}
function drawDrops(){for(const drop of run.drops){const size=drop.kind==='chest'?49:32,box=footprint(drop.x,drop.y,size,size),bob=Math.sin(time*3+drop.id)*3;shadow(box.x,box.y,size);drawImage(drop.kind==='chest'?'icon_chest':'icon_coin',box.left,box.top+bob,size,size);if(drop.kind==='chest')label('惊喜',box.x,box.top-12,16,'#b28b3b');}}
function drawGroups(){
  // 每个代表有独立格位；过多人数只计数字，世界坐标没有为美观而改动。
  const all=[...run.groups.map(g=>({g,enemy:false})),...run.enemies.map(g=>({g,enemy:true}))].sort((a,b)=>a.g.y-b.g.y);
  let budget=MAX_DRAWN-9;const occupied=[];
  for(const {g,enemy}of all){const layout=packLayout(g,scale,Math.min(4,budget));let drawn=0;
    for(const p of layout.points){const h=p.size*1.9,rect={left:p.x-p.size*.56,right:p.x+p.size*.56,top:p.y-h-4,bottom:p.y+3};
      if(occupied.some(r=>rect.left<r.right&&rect.right>r.left&&rect.top<r.bottom&&rect.bottom>r.top))continue;
      // 门楣永远先画在人物后方，过门事件线设在门脚，前行小人不盖住数字。
      if(enemy)sprite('enemy_'+g.kind,p.x,p.y,p.size,time*7+g.id+p.i);
      else runSprite(p.x,p.y,p.size,g.id*60+p.i);occupied.push(rect);drawn++;budget--;
    }
    if(g.count>drawn||g.giant)queueCount(g.count,layout,enemy?'#b38bc7':g.giant?'#e2ac47':'#51b1bf');
  }
}
function drawBase(){const box=footprint(run.x,1004,137,88);shadow(box.x,box.y,137);drawImage('base',box.left,box.top,box.width,box.height);runSprite(box.x,box.y-15,Math.max(38,30/scale),0,0);if(run.holding){ctx.strokeStyle='#83e6d8';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(box.x,box.y+2,75+Math.sin(time*15)*3,18,0,0,Math.PI*2);ctx.stroke();}}
function burst(x,y,count=12,kind='star'){for(let i=0;i<count&&particles.length<180;i++){const a=Math.random()*Math.PI*2,s=50+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,life:.55+Math.random()*.5,max:1,size:kind==='confetti'?12+Math.random()*12:12+Math.random()*18,angle:Math.random()*6,kind});}}
function float(text,x,y,color='#ebad35'){floats.push({text,x,y,life:.95,color});if(floats.length>24)floats.shift();}
function effects(events){for(const event of events){if(event.type==='spawn')sound('spawn');if(event.type==='gate'){sound('gate');burst(event.x,event.y,10);float('+'+event.extra+'人',event.x+72,event.y-115,'#3da7ad');if(event.combo%4===0){$('toast').textContent=event.combo+' 次倍增，太棒啦！';$('toast').classList.add('show');toastUntil=time+1.4;}}if(event.type==='release'){burst(event.x,event.y,3);}if(['clash','hit','basehit'].includes(event.type)){sound('hit');burst(event.x,event.y,8);shake=event.type==='basehit'?5:2;if(event.text&&event.type!=='clash')float(event.text,event.x,event.y-20,'#c786a5');}if(event.type==='attack'){sound('attack');burst(event.x,event.y,4);float(event.text,event.x+30,event.y-60,event.shield?'#66b4df':'#dc8a92');}if(event.type==='collapse'){sound('bomb');burst(event.x,event.y,28,'confetti');burst(event.x,event.y,12,'crumb');shake=7;slow=.65;float(event.text,event.x,event.y-60);}if(event.type==='coin'){sound('coin');burst(event.x,event.y,5);float(event.text,event.x,event.y-35);}if(event.type==='chest'){sound(event.power==='bomb'?'bomb':'chest');burst(event.x,event.y,15);float({giant:'大块头！',speed:'加速啦！',bomb:'糖果炸弹！'}[event.power],event.x,event.y-50);}}}
function updateEffects(dt){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt;p.angle+=dt*3;}particles=particles.filter(p=>p.life>0);for(const f of floats){f.life-=dt;f.y-=34*dt;}floats=floats.filter(f=>f.life>0);shake=Math.max(0,shake-dt*15);slow=Math.max(0,slow-dt);if(toastUntil<time)$('toast').classList.remove('show');}
function drawEffects(){for(const p of particles){if(run.level.gates.some(g=>{const h=Math.min(155,g.width*.57);return Math.abs(p.x-gateX(g,run.elapsed))<g.width*.29&&Math.abs(p.y-(g.y-h+h*.30))<20;}))continue;ctx.save();ctx.globalAlpha=Math.min(1,p.life*2);ctx.translate(p.x,p.y);ctx.rotate(p.angle);drawImage(p.kind==='crumb'?'tower_'+(run.level.boss?'boss':run.level.theme)+'_rubble':p.kind==='confetti'?'fx_confetti':'fx_star',-p.size/2,-p.size/2,p.size,p.size);ctx.restore();}for(const f of floats){ctx.save();ctx.globalAlpha=Math.min(1,f.life*3);label(f.text,f.x,f.y,23,f.color);ctx.restore();}}
let lastHud='';function updateHud(){const key=[Math.floor(run.energy),run.baseHp,run.coins,Math.floor(run.elapsed),Math.ceil(run.powers.giant),Math.ceil(run.powers.speed)].join(',');if(key===lastHud)return;lastHud=key;$('themeLabel').textContent=THEMES[run.level.theme]+(scale<.81?' · 营地 '+run.baseHp:run.level.boss?' · 皇冠大城堡':' · '+run.level.towers.length+' 座城堡');$('coinLabel').textContent=run.coins;$('baseLabel').textContent='营地 '+run.baseHp+' / '+run.level.baseHp;$('timeLabel').textContent=formatTime(run.elapsed);$('energyNumber').textContent=Math.floor(run.energy)+' / 100';$('energyFill').style.width=run.energy+'%';$('energyFill').parentElement.setAttribute('aria-valuenow',Math.floor(run.energy));$('energyLabel').textContent=run.energy<12?'松手休息，能量会回来':'出兵能量';$('energyFill').style.background=run.energy<20?'linear-gradient(90deg,#f6b66e,#ffd18e)':'';$('powerbar').replaceChildren();for(const kind of ['giant','speed'])if(run.powers[kind]>0){const tag=document.createElement('div');tag.className='power-tag';tag.innerHTML='<img src="assets/icon_'+kind+'.png" alt="">'+(kind==='giant'?'大块头':'加速')+' '+Math.ceil(run.powers[kind])+'s';$('powerbar').append(tag);}$('hintLabel').textContent=run.elapsed<4?'按住出兵 · 左右拖动选门 · 松手回能':run.holding?'小队出发！穿亮亮的门变得更多':'按住屏幕继续出兵';}
function render(){numberTags.length=0;ctx.clearRect(0,0,W,H);ctx.save();if(shake>0&&run.phase==='running')ctx.translate(Math.sin(time*97)*shake,Math.cos(time*83)*shake*.45);drawBoard();drawTowers();drawObstacles();drawGates(false);drawDrops();drawGroups();drawGates(true);numberTags.forEach(t=>badge(t.count,t.x,t.y,t.color,true));drawBase();drawEffects();ctx.restore();}
function loop(now){const dt=Math.min(.1,Math.max(0,(now-(last||now))/1000));last=now;time+=dt;if(run.phase==='running'&&!qaFrozen){if(audio&&!save.muted&&!buffers.bgm&&clips.bgm&&clips.bgm.dataset.failed==='true'){const beat=Math.floor(time*2);if(beat!==synthBeat){synthBeat=beat;oscillator([523,659,784,880,784,659,587,659][beat%8],0,.3);}}accumulator+=dt*(slow>0?.38:1);let guard=0;while(accumulator>=1/60&&guard++<8){advance(run,1/60);effects(run.events);run.events.length=0;accumulator-=1/60;}updateEffects(dt);updateHud();}if(['won','lost'].includes(run.phase)&&!resultHandled)finish();render();requestAnimationFrame(loop);}
// 仅显式 ?qa 时提供可重复场景；正式入口无跳关或作弊接口。
if(new URLSearchParams(location.search).has('qa'))window.__towerQA={api:API,get run(){return run;},get save(){return save;},get assets(){return {failed:failedAssets,loaded,count:Object.keys(images).length,audio:Object.keys(buffers)};},freeze(value=true){qaFrozen=value;},start,home,pause,resume,render,advance(seconds){let steps=Math.ceil(seconds*60);while(steps--&&run.phase==='running'){advance(run,1/60);effects(run.events);run.events.length=0;time+=1/60;updateEffects(1/60);}updateHud();if(['won','lost'].includes(run.phase))finish();render();},seedSave(value){save=cleanSave(value);persist();renderShop();},scenario(name){start(name==='boss'?12:name==='twins'?7:name==='crowd'?9:1);if(name==='crowd'){addGroup(run,310,595,120,[0]);addGroup(run,500,810,300,[]);run.level.towers[0].siege=90;run.powers.giant=6;}if(name==='boss'){run.level.towers[0].siege=40;spawnEnemy(run);run.powers.speed=6;}if(name==='won'){run.level.towers.forEach(t=>damageTower(run,t,t.hp+t.shield));this.advance(1.5);}if(name==='lost'){run.baseHp=0;this.advance(.1);}render();}};
resize();syncMute();home();preload();requestAnimationFrame(loop);
})();
